name: Build M127F Kernel - KSUN v3.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - ksun-3.3.0-susfs
    paths:
      - ".github/workflows/build-ksun.yml"
      - "arch/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - "KernelSU-Next/**"
      - "Makefile"
      - "Kconfig*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download Android Clang r383902
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/toolchain"

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz

          tar -xf /tmp/clang-r383902.tar.gz \
            -C "$HOME/toolchain"

          echo "=== Clang version ==="
          "$HOME/toolchain/bin/clang" --version

          echo "=== AArch64 GNU linker ==="
          aarch64-linux-gnu-ld --version | head

      - name: Verify KernelSU-Next v3.3.0 source
        run: |
          set -euxo pipefail

          echo "=== KernelSU-Next source ==="

          test -d KernelSU-Next

          cd KernelSU-Next

          echo "HEAD:"
          git rev-parse HEAD || true

          echo "Description:"
          git describe --tags --always || true

          echo "SELinux Hide source:"
          find kernel -type f \
            \( -iname '*selinux*hide*' -o -iname '*susfs*' \) \
            -print || true

          cd ..

      - name: Patch KSUN file wrapper for Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/infra/file_wrapper.c")
          s = p.read_text()

          def replace_once(old, new, label):
              global s

              count = s.count(old)

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match, found {count}"
                  )

              s = s.replace(old, new, 1)
              print(f"Patched: {label}")

          # ------------------------------------------------------------
          # 1. iopoll
          #
          # Samsung 4.19 struct file_operations has no iopoll member.
          # ------------------------------------------------------------

          old = r'''#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, struct io_comp_batch *icb,
                                        unsigned int v)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, icb, v);
          }
          #else
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, spin);
          }
          #endif
          '''

          new = r'''/*
           * Samsung Linux 4.19 has no file_operations::iopoll.
           * Keep the upstream implementation for kernels with the modern
           * callback, but do not compile it into this old vendor VFS ABI.
           */
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, struct io_comp_batch *icb,
                                        unsigned int v)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, icb, v);
          }
          #else
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, spin);
          }
          #endif
          #endif
          '''

          replace_once(old, new, "guard iopoll implementation")

          # ------------------------------------------------------------
          # 2. remap_file_range
          #
          # Samsung 4.19 has clone_file_range/dedupe_file_range instead.
          # ------------------------------------------------------------

          old = r'''// no REMAP_FILE_DEDUP: use file_in
          // https://cs.android.com/android/kernel/superproject/+/common-android-mainline:common/fs/read_write.c;l=1598-1599;drc=398da7defe218d3e51b0f3bdff75147e28125b60
          // https://cs.android.com/android/kernel/superproject/+/common-android-mainline:common/fs/remap_range.c;l=403-404;drc=398da7defe218d3e51b0f3bdff75147e28125b60
          // REMAP_FILE_DEDUP: use file_out
          // https://cs.android.com/android/kernel/superproject/+/common-android-mainline:common/fs/remap_range.c;l=483-484;drc=398da7defe218d3e51b0f3bdff75147e28125b60
          static loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in,
                                                     struct file *file_out,
                                                     loff_t pos_out, loff_t len,
                                                     unsigned int remap_flags)
          {
              if (remap_flags & REMAP_FILE_DEDUP) {
                  struct ksu_file_wrapper *data = file_out->private_data;
                  struct file *orig = data->orig;
                  return orig->f_op->remap_file_range(file_in, pos_in, orig, pos_out, len,
                                                      remap_flags);
              } else {
                  struct ksu_file_wrapper *data = file_in->private_data;
                  struct file *orig = data->orig;
                  return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out,
                                                      len, remap_flags);
              }
          }
          '''

          new = r'''/*
           * Samsung Linux 4.19 predates file_operations::remap_file_range
           * and REMAP_FILE_DEDUP. Its VFS still exposes the older
           * clone_file_range/dedupe_file_range callbacks.
           */
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 3, 0)
          // no REMAP_FILE_DEDUP: use file_in
          // REMAP_FILE_DEDUP: use file_out
          static loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in,
                                                     struct file *file_out,
                                                     loff_t pos_out, loff_t len,
                                                     unsigned int remap_flags)
          {
              if (remap_flags & REMAP_FILE_DEDUP) {
                  struct ksu_file_wrapper *data = file_out->private_data;
                  struct file *orig = data->orig;
                  return orig->f_op->remap_file_range(file_in, pos_in, orig, pos_out, len,
                                                      remap_flags);
              } else {
                  struct ksu_file_wrapper *data = file_in->private_data;
                  struct file *orig = data->orig;
                  return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out,
                                                      len, remap_flags);
              }
          }
          #endif
          '''

          replace_once(old, new, "guard remap_file_range implementation")

          # ------------------------------------------------------------
          # 3. iopoll assignment
          # ------------------------------------------------------------

          old = r'''    p->ops.write_iter = fp->f_op->write_iter ? ksu_wrapper_write_iter : NULL;
              p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
          '''

          new = r'''    p->ops.write_iter = fp->f_op->write_iter ? ksu_wrapper_write_iter : NULL;
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
              p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
          '''

          replace_once(old, new, "guard iopoll file_operations assignment")

          # ------------------------------------------------------------
          # 4. remap_file_range assignment
          # ------------------------------------------------------------

          old = r'''    p->ops.copy_file_range =
                  fp->f_op->copy_file_range ? ksu_wrapper_copy_file_range : NULL;
              p->ops.remap_file_range =
                  fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;
              p->ops.fadvise = fp->f_op->fadvise ? ksu_wrapper_fadvise : NULL;
          '''

          new = r'''    p->ops.copy_file_range =
                  fp->f_op->copy_file_range ? ksu_wrapper_copy_file_range : NULL;
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 3, 0)
              p->ops.remap_file_range =
                  fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;
          #endif
              p->ops.fadvise = fp->f_op->fadvise ? ksu_wrapper_fadvise : NULL;
          '''

          replace_once(old, new, "guard remap_file_range assignment")

          # ------------------------------------------------------------
          # 5. security_inode_init_security_anon
          # ------------------------------------------------------------

          old = r'''static struct inode *
          ksu_anon_inode_make_secure_inode(const char *name,
                                           const struct inode *context_inode)
          {
              struct inode *inode;
              const struct qstr qname = QSTR_INIT(name, strlen(name));
              int error;

              if (unlikely(!anon_inode_mnt)) {
                  return ERR_PTR(-ENODEV);
              }

              inode = alloc_anon_inode(anon_inode_mnt->mnt_sb);
              if (IS_ERR(inode))
                  return inode;
              inode->i_flags &= ~S_PRIVATE;
              error = security_inode_init_security_anon(inode, &qname, context_inode);
              if (error) {
                  iput(inode);
                  return ERR_PTR(error);
              }
              return inode;
          }
          '''

          new = r'''static struct inode *
          ksu_anon_inode_make_secure_inode(const char *name,
                                           const struct inode *context_inode)
          {
              struct inode *inode;

              if (unlikely(!anon_inode_mnt)) {
                  return ERR_PTR(-ENODEV);
              }

              inode = alloc_anon_inode(anon_inode_mnt->mnt_sb);
              if (IS_ERR(inode))
                  return inode;

              inode->i_flags &= ~S_PRIVATE;

          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
              {
                  const struct qstr qname = QSTR_INIT(name, strlen(name));
                  int error;

                  error = security_inode_init_security_anon(inode, &qname,
                                                            context_inode);
                  if (error) {
                      iput(inode);
                      return ERR_PTR(error);
                  }
              }
          #else
              /*
               * Samsung 4.19 has no security_inode_init_security_anon().
               * alloc_anon_inode() has allocated the inode security storage.
               * KSUN later sets its desired SID directly.
               */
              (void)name;
              (void)context_inode;
          #endif

              return inode;
          }
          '''

          replace_once(old, new, "backport anonymous inode security setup")

          # ------------------------------------------------------------
          # 6. selinux_inode()
          # ------------------------------------------------------------

          old = r'''    struct inode_security_struct *wrapper_sec = selinux_inode(wrapper_inode);
          '''

          new = r'''#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
              struct inode_security_struct *wrapper_sec =
                  selinux_inode(wrapper_inode);
          #else
              struct inode_security_struct *wrapper_sec =
                  (struct inode_security_struct *)wrapper_inode->i_security;
          #endif
          '''

          replace_once(old, new, "use Samsung 4.19 inode security storage")

          p.write_text(s)

          print()
          print("Samsung 4.19 file_wrapper compatibility patch applied.")
          PY

          echo
          echo "=== Verify file_wrapper compatibility ==="

          grep -n -A4 -B4 \
            'ksu_wrapper_iopoll' \
            KernelSU-Next/kernel/infra/file_wrapper.c \
            | head -80

          grep -n -A8 -B8 \
            'ksu_wrapper_remap_file_range' \
            KernelSU-Next/kernel/infra/file_wrapper.c \
            | head -120

          grep -n -A35 -B5 \
            'ksu_anon_inode_make_secure_inode' \
            KernelSU-Next/kernel/infra/file_wrapper.c \
            | head -100

          grep -n -A8 -B5 \
            'wrapper_sec' \
            KernelSU-Next/kernel/infra/file_wrapper.c

      - name: Patch KSUN package observer for Samsung 4.19 fsnotify
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/manager/pkg_observer.c")
          s = p.read_text()

          old = r'''static int ksu_handle_inode_event(struct fsnotify_mark *mark, u32 mask,
                                        struct inode *inode, struct inode *dir,
                                        const struct qstr *file_name, u32 cookie)
          {
              if (!file_name)
                  return 0;
              if (mask & FS_ISDIR)
                  return 0;
              if (file_name->len == 13 && !memcmp(file_name->name, "packages.list", 13)) {
                  pr_info("packages.list detected: %d\n", mask);
                  track_throne(false);
              }
              return 0;
          }

          static const struct fsnotify_ops ksu_ops = {
              .handle_inode_event = ksu_handle_inode_event,
          };
          '''

          new = r'''/*
           * KernelSU-Next v3.3.0 normally uses the newer fsnotify
           * handle_inode_event callback.
           *
           * Samsung Linux 4.19 still exposes the older fsnotify_ops::handle_event
           * callback:
           *
           *   handle_event(group, inode, mask, data, data_type,
           *                file_name, cookie, iter_info)
           *
           * This observer only needs the event mask and child filename, so the
           * legacy API provides everything required for the original behaviour.
           */
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)

          static int ksu_handle_event(struct fsnotify_group *group,
                                      struct inode *inode,
                                      u32 mask,
                                      const void *data,
                                      int data_type,
                                      const unsigned char *file_name,
                                      u32 cookie,
                                      struct fsnotify_iter_info *iter_info)
          {
              (void)group;
              (void)inode;
              (void)data;
              (void)data_type;
              (void)cookie;
              (void)iter_info;

              if (!file_name)
                  return 0;

              if (mask & FS_ISDIR)
                  return 0;

              if (!strcmp((const char *)file_name, "packages.list")) {
                  pr_info("packages.list detected: %d\n", mask);
                  track_throne(false);
              }

              return 0;
          }

          static const struct fsnotify_ops ksu_ops = {
              .handle_event = ksu_handle_event,
          };

          #else

          static int ksu_handle_inode_event(struct fsnotify_mark *mark, u32 mask,
                                            struct inode *inode, struct inode *dir,
                                            const struct qstr *file_name, u32 cookie)
          {
              if (!file_name)
                  return 0;
              if (mask & FS_ISDIR)
                  return 0;
              if (file_name->len == 13 &&
                  !memcmp(file_name->name, "packages.list", 13)) {
                  pr_info("packages.list detected: %d\n", mask);
                  track_throne(false);
              }
              return 0;
          }

          static const struct fsnotify_ops ksu_ops = {
              .handle_inode_event = ksu_handle_inode_event,
          };

          #endif
          '''

          count = s.count(old)

          if count != 1:
              raise SystemExit(
                  "pkg_observer fsnotify block: "
                  f"expected exactly one match, found {count}"
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          print("Samsung 4.19 fsnotify compatibility patch applied.")
          PY

          echo
          echo "=== Samsung fsnotify ABI ==="

          grep -n -A18 \
            'struct fsnotify_ops {' \
            include/linux/fsnotify_backend.h \
            | head -30

          echo
          echo "=== Patched KSUN package observer ==="

          grep -n -A85 -B5 \
            'ksu_handle_event' \
            KernelSU-Next/kernel/manager/pkg_observer.c \
            | head -120

          echo
          echo "=== Verify legacy callback selected for Samsung 4.19 ==="

          grep -n \
            '\.handle_event = ksu_handle_event' \
            KernelSU-Next/kernel/manager/pkg_observer.c

      - name: Configure M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos850-m12nsxx_defconfig

          echo "=== Kernel release configuration ==="
          grep -E 'CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO' .config || true

          echo "=== KernelSU configuration ==="
          grep -iE 'KSU|KERNELSU' .config || true

          echo "=== SELinux configuration ==="
          grep -i 'CONFIG_SECURITY_SELINUX' .config || true

          echo "=== SUSFS configuration ==="
          grep -i 'SUSFS' .config || true

          echo "=== KPROBE configuration ==="
          grep -i 'KPROBE' .config || true

      - name: Verify compiler environment
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          echo "=== clang ==="
          which clang
          clang --version

          echo "=== linker ==="
          which aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version | head

          echo "=== assembler ==="
          which aarch64-linux-gnu-as
          aarch64-linux-gnu-as --version | head

          echo "=== compiler target test ==="
          echo | clang \
            --target=aarch64-linux-gnu \
            -dM -E - \
            | grep -E "__aarch64__|__AARCH64"

      - name: Build M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Verify kernel image
        run: |
          set -euxo pipefail

          echo "=== arch/arm64/boot ==="
          ls -lah arch/arm64/boot/

          echo "=== Kernel images ==="
          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -ls

          test -s arch/arm64/boot/Image

          echo "=== Final Image ==="
          ls -lh arch/arm64/boot/Image

          echo "SHA256:"
          sha256sum arch/arm64/boot/Image

      - name: Verify KernelSU objects
        run: |
          set -euxo pipefail

          echo "=== KernelSU build output ==="

          find drivers/kernelsu \
            -type f \
            \( -name '*.o' -o -name 'built-in.a' \) \
            -print | head -150 || true

          if [ -d drivers/kernelsu ]; then
            test -n "$(find drivers/kernelsu -type f -name '*.o' -print -quit)"
          else
            echo "drivers/kernelsu does not exist"
            exit 1
          fi

      - name: Verify native SELinux Hide was compiled
        run: |
          set -euxo pipefail

          echo "=== Searching compiled SELinux Hide objects ==="

          SELINUX_HIDE_OBJECT="$(
            find drivers/kernelsu \
              -type f \
              -name 'selinux_hide.o' \
              -print -quit
          )"

          if [ -z "$SELINUX_HIDE_OBJECT" ]; then
            echo "ERROR: selinux_hide.o was not produced"
            exit 1
          fi

          echo "SELinux Hide object:"
          echo "$SELINUX_HIDE_OBJECT"

          ls -lh "$SELINUX_HIDE_OBJECT"

          echo
          echo "=== SELinux Hide source references ==="

          grep -Rni \
            --include='*.c' \
            --include='*.h' \
            --include='Makefile' \
            --include='Kbuild' \
            'selinux_hide' \
            drivers/kernelsu \
            KernelSU-Next/kernel 2>/dev/null | head -150 || true

      - name: Verify AnyKernel template
        run: |
          set -euxo pipefail

          echo "=== AnyKernel template ==="

          test -d anykernel
          test -f anykernel/anykernel.sh

          ls -lah anykernel/

          echo "=== anykernel.sh header ==="
          head -80 anykernel/anykernel.sh

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail

          rm -rf output
          mkdir -p output

          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image

          echo "=== Packaged Image ==="
          ls -lh output/Image

          echo "=== AnyKernel package contents ==="
          find output \
            -maxdepth 3 \
            -type f \
            -print | sort

          test -s output/Image
          test -f output/anykernel.sh

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail

          rm -f M127F-KSUN-v3.3.0-SELinuxHide.zip

          cd output

          zip -r9 \
            ../M127F-KSUN-v3.3.0-SELinuxHide.zip \
            .

          cd ..

          echo "=== Flashable ZIP ==="
          ls -lh M127F-KSUN-v3.3.0-SELinuxHide.zip

          echo "=== ZIP contents ==="
          unzip -l M127F-KSUN-v3.3.0-SELinuxHide.zip

          echo "=== ZIP SHA256 ==="
          sha256sum M127F-KSUN-v3.3.0-SELinuxHide.zip

          test -s M127F-KSUN-v3.3.0-SELinuxHide.zip

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-SELinuxHide
          path: M127F-KSUN-v3.3.0-SELinuxHide.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config
          if-no-files-found: error
