      - name: Trial 44 port SUSFS namespace mount ID model with robust guards
        run: |
          set -euxo pipefail

          FILE="fs/namespace.c"
          test -f "$FILE"
          grep -q '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          grep -q 'DEFAULT_KSU_MNT_ID' include/linux/susfs_def.h
          grep -q 'DEFAULT_KSU_MNT_GROUP_ID' include/linux/susfs_def.h
          grep -q 'VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT' include/linux/susfs_def.h

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/namespace.c")
          s = p.read_text()

          # SUSFS v2.2.0 renamed the reserved KSU mount-ID ranges.
          #
          # Trial43 incorrectly asserted exact raw token counts here. Samsung's
          # imported v1.5.7 namespace.c also contains these symbols in comments,
          # so raw text counts are not stable. Validate the real executable
          # anchors below instead.
          if "DEFAULT_SUS_MNT_ID" not in s:
              raise SystemExit("Trial44: no DEFAULT_SUS_MNT_ID references found")
          if "DEFAULT_SUS_MNT_GROUP_ID" not in s:
              raise SystemExit("Trial44: no DEFAULT_SUS_MNT_GROUP_ID references found")
          if "DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE" not in s:
              raise SystemExit("Trial44: no old KSU proc-unshare sentinel found")

          # Handle the removed proc-unshare sentinel semantically before the
          # broad mount-ID rename. v2.2.0 stores this state in vfsmount::mnt_flags.
          old_free = """	if (unlikely(mnt->mnt.susfs_mnt_id_backup == DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE)) {
          		return;
          	}
          """
          new_free = """	if (unlikely(mnt->mnt.mnt_flags & VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT)) {
          		return;
          	}
          """
          if old_free not in s:
              raise SystemExit("Trial44: old mnt_free_id KSU-unshare sentinel block not found")
          s = s.replace(old_free, new_free, 1)

          old_mark = (
              "mnt->mnt.susfs_mnt_id_backup = "
              "DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE;"
          )
          new_mark = (
              "mnt->mnt.mnt_flags |= "
              "VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;"
          )
          if old_mark not in s:
              raise SystemExit("Trial44: old clone_mnt KSU-unshare sentinel assignment not found")
          s = s.replace(old_mark, new_mark, 1)

          # Direct v1.5.7 -> v2.2.0 reserved-range renames.
          s = s.replace("DEFAULT_SUS_MNT_GROUP_ID", "DEFAULT_KSU_MNT_GROUP_ID")
          s = s.replace("DEFAULT_SUS_MNT_ID", "DEFAULT_KSU_MNT_ID")

          for stale in (
              "DEFAULT_SUS_MNT_ID",
              "DEFAULT_SUS_MNT_GROUP_ID",
              "DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE",
          ):
              if stale in s:
                  raise SystemExit(
                      f"Trial44: stale v1.5.7 namespace mount-ID symbol remains: {stale}"
                  )

          if s.count("VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT") != 2:
              raise SystemExit(
                  "Trial44: expected exactly two v2.2.0 KSU-unshared mount flag uses"
              )

          p.write_text(s)
          print(
              "Trial44: migrated namespace mount-ID ranges and "
              "KSU proc-unshare sentinel semantics"
          )
          PY

          echo "=== Trial 44 namespace v2.2.0 mount-ID model verification ==="
          grep -n -E -A3 -B3             'DEFAULT_KSU_MNT_ID|DEFAULT_KSU_MNT_GROUP_ID|VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT'             "$FILE" | head -n 220

          ! grep -q 'DEFAULT_SUS_MNT_ID' "$FILE"
          ! grep -q 'DEFAULT_SUS_MNT_GROUP_ID' "$FILE"
          ! grep -q 'DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE' "$FILE"
          grep -q 'DEFAULT_KSU_MNT_ID' "$FILE"
          grep -q 'DEFAULT_KSU_MNT_GROUP_ID' "$FILE"
          test "$(grep -c 'VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT' "$FILE")" -eq 2

          echo "Trial44: namespace mount-ID ranges and KSU-unshare state migrated to SUSFS v2.2.0."

