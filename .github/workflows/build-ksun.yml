            echo "ERROR: unsupported nofault helper remains"
            exit 1
          fi

      - name: Backport KSUN SELinux core to Samsung 4.19
        run: |
          set -euxo pipefail
          
          python3 - <<'PY'
          from pathlib import Path
          
          KVER_GUARD = "KERNEL_VERSION(5, 10, 0)"
          
          # ------------------------------------------------------------
          # 1) selinux.c: selinux_cred() does not exist on old SELinux.
          #    Linux 4.19 stores task_security_struct directly in
