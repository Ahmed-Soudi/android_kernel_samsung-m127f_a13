      - name: Trial 19 v2 enable SUSFS v1.5.7 features after defconfig
        run: |
          set -euxo pipefail
          
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH="$HOME/toolchain/bin:$PATH"
          
          test -f .config
          echo "Trial 19 v2: .config exists after exynos850-m12nsxx_defconfig"
          
          ./scripts/config --enable KSU_SUSFS
          
          for sym in \
            KSU_SUSFS_SUS_PATH \
            KSU_SUSFS_SUS_MOUNT \
            KSU_SUSFS_SUS_KSTAT \
            KSU_SUSFS_TRY_UMOUNT \
            KSU_SUSFS_SPOOF_UNAME \
            KSU_SUSFS_ENABLE_LOG \
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            KSU_SUSFS_OPEN_REDIRECT
          do
            if grep -qE "^config[[:space:]]+$sym([[:space:]]|$)" KernelSU-Next/kernel/Kconfig; then
              ./scripts/config --enable "$sym"
            fi
          done
          
          # Keep SUS_SU off: this Samsung 4.19 build already uses our proven
          # non-kprobe KernelSU transport/hook path.
          ./scripts/config --disable KSU_SUSFS_SUS_SU || true
          
          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig
          
          echo "=== Trial 19 final SUSFS config ==="
          grep -E '^CONFIG_KSU_SUSFS(=|_)|^# CONFIG_KSU_SUSFS' .config | sort
          
          grep -q '^CONFIG_KSU_SUSFS=y$' .config
          
          if grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y$' .config; then
            echo "::error::SUS_SU must remain disabled on this Samsung 4.19 non-kprobe build."
            exit 1
          fi
          
          echo "Trial 19 v2: SUSFS v1.5.7 features enabled after M127F defconfig; SUS_SU intentionally disabled."

      - name: Trial 18 v4 enable SUSFS core
        run: |
          set -euxo pipefail
          
          test -x scripts/config
          
          echo "=== SUSFS symbols available after proven import ==="
          grep -Rns --include='Kconfig*' \
            -E 'config[[:space:]]+KSU_SUSFS|KSU_SUSFS_' \
            . 2>/dev/null | head -n 160 || true
          
          # Start with the exact core only. Optional hide/spoof switches remain
          # at their declared defaults for the first boot-safety validation.
          ./scripts/config --enable KSU_SUSFS
          
          export PATH="$HOME/toolchain/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "Trial 18 v4: reusing Samsung Kconfig environment for olddefconfig"
          echo "PLATFORM_VERSION=$PLATFORM_VERSION ANDROID_MAJOR_VERSION=$ANDROID_MAJOR_VERSION"
          
          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig
          
          echo "=== Final Trial 18 v2 SUSFS configuration ==="
          grep -E '^CONFIG_KSU_SUSFS(=|_)|^# CONFIG_KSU_SUSFS' .config || true
          
          if ! grep -q '^CONFIG_KSU_SUSFS=y$' .config; then
            echo "::error::Trial 18 v4: CONFIG_KSU_SUSFS=y was not retained by olddefconfig."
            exit 1
          fi
          
          echo "Trial 18 v4: SUSFS core retained in final kernel config."

      - name: Make boot-completed handler track-throne-only on Samsung 4.19
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          
          p = Path("KernelSU-Next/kernel/runtime/boot_event.c")
          s = p.read_text()
          old = "void on_boot_completed(void)\n{\n    ksu_boot_completed = true;\n    pr_info(\"on_boot_completed!\\n\");\n    track_throne(true);\n    ksu_selinux_hide_drop_backup_if_unused();\n    ksu_avc_spoof_late_init();\n}\n"
          new = "void on_boot_completed(void)\n{\n    /* Samsung 4.19 diagnostic: full boot-completed handler with staged logs. */\n    ksu_boot_completed = true;\n    pr_warn(\"Samsung 4.19 diagnostic: on_boot_completed full-handler entered\\n\");\n    track_throne(true);\n    pr_warn(\"Samsung 4.19 diagnostic: track_throne(true) returned\\n\");\n    ksu_selinux_hide_drop_backup_if_unused();\n    pr_warn(\"Samsung 4.19 diagnostic: selinux_hide_drop_backup_if_unused returned\\n\");\n    ksu_avc_spoof_late_init();\n    pr_warn(\"Samsung 4.19 diagnostic: ksu_avc_spoof_late_init returned\\n\");\n}\n"
          if old not in s:
              raise SystemExit("original on_boot_completed body not found")
          p.write_text(s.replace(old, new, 1))
          
          p = Path("KernelSU-Next/kernel/extras.c")
          s = p.read_text()
          old = '#ifdef CONFIG_KPROBES\n\tpr_info("avc_spoof/init: register slow_avc_audit kprobe!\\n");\n\tslow_avc_audit_kp = init_kprobe("slow_avc_audit", slow_avc_audit_pre_handler);\n#endif'
          new = '#ifdef CONFIG_KPROBES\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\n\tpr_warn("Samsung 4.19 diagnostic: avc_spoof slow_avc_audit kprobe suppressed\\n");\n#else\n\tpr_info("avc_spoof/init: register slow_avc_audit kprobe!\\n");\n\tslow_avc_audit_kp = init_kprobe("slow_avc_audit", slow_avc_audit_pre_handler);\n#endif\n#endif'
          if old not in s:
              raise SystemExit("AVC spoof kprobe registration block not found")
          p.write_text(s.replace(old, new, 1))
          PY2
          
          grep -nA6 -B2 'on_boot_completed(void)' KernelSU-Next/kernel/runtime/boot_event.c
          grep -q 'on_boot_completed full-handler entered' KernelSU-Next/kernel/runtime/boot_event.c
          grep -nA8 -B4 'slow_avc_audit kprobe suppressed' KernelSU-Next/kernel/extras.c
          grep -q 'avc_spoof slow_avc_audit kprobe suppressed' KernelSU-Next/kernel/extras.c

      - name: Trial 16 fix ARM64 4.19 section-mapped kernel address translation
        run: |
          set -euxo pipefail
          
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path("KernelSU-Next/kernel/hook/arm64/patch_memory.c")
          s = p.read_text()
          
          pud_marker = '    pud = pud_offset(p4d, addr);\n'
          pud_insert = '    pud = pud_offset(p4d, addr);\n#if defined(pud_sect)\n    if (pud_sect(*pud)) {\n        unsigned long phys = __pud_to_phys(*pud) + (addr & ~PUD_MASK);\n        pr_info("Samsung 4.19 Trial16: PUD section VA 0x%lx -> PA 0x%lx\\n",\n                addr, phys);\n        return phys;\n    }\n#endif\n'
          if pud_marker not in s:
              raise SystemExit("Trial 16: PUD marker not found")
          s = s.replace(pud_marker, pud_insert, 1)
          
          pmd_marker = '    pmd = pmd_offset(pud, addr);\n'
          pmd_insert = '    pmd = pmd_offset(pud, addr);\n#if defined(pmd_sect)\n    if (pmd_sect(*pmd)) {\n        unsigned long phys = __pmd_to_phys(*pmd) + (addr & ~PMD_MASK);\n        pr_info("Samsung 4.19 Trial16: PMD section VA 0x%lx -> PA 0x%lx\\n",\n                addr, phys);\n        return phys;\n    }\n#endif\n'
          if pmd_marker not in s:
              raise SystemExit("Trial 16: PMD marker not found")
          s = s.replace(pmd_marker, pmd_insert, 1)
          
          p.write_text(s)
          print("Trial 16 ARM64 4.19 section mapping patch applied")
          PY
          
          echo "=== Trial 16 patch verification ==="
          python3 - <<'PY'
          from pathlib import Path
          
          s = Path("KernelSU-Next/kernel/hook/arm64/patch_memory.c").read_text()
          required = [
              '#if defined(pud_sect)',
              'if (pud_sect(*pud))',
              '__pud_to_phys(*pud) + (addr & ~PUD_MASK)',
              'Samsung 4.19 Trial16: PUD section',
              '#if defined(pmd_sect)',
              'if (pmd_sect(*pmd))',
              '__pmd_to_phys(*pmd) + (addr & ~PMD_MASK)',
              'Samsung 4.19 Trial16: PMD section',
              'set_fixmap_offset(FIX_TEXT_POKE0, phy)',
              'clear_fixmap(FIX_TEXT_POKE0)',
              'stop_machine(ksu_patch_text_cb',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"Trial 16 verification missing: {needle}")
          print("Trial 16 verification passed")
          PY

      - name: Trial 17 initialize SELinux status page through 4.19 lazy allocator
        run: |
          set -euxo pipefail
          
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path("KernelSU-Next/kernel/feature/selinux_hide.c")
          s = p.read_text()
          
          marker = "static void initialize_fake_status()\n{"
          if marker not in s:
              raise SystemExit("Trial 17 v2: initialize_fake_status function marker not found")
          
          insert = 'static void initialize_fake_status()\n{\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\n    /*\n     * Linux 4.19 SELinux creates its status page lazily. The Samsung 4.19\n     * compatibility layer may expose the page through KSU_SELINUX_STATUS_PAGE,\n     * so do not anchor this patch to the exact field/mutex spelling produced\n     * by earlier compatibility steps.\n     *\n     * selinux_kernel_status_page() takes the SELinux status mutex internally,\n     * therefore call it before the existing lock in this function.\n     */\n    if (!KSU_SELINUX_STATUS_PAGE) {\n        struct page *real_status =\n            selinux_kernel_status_page(&selinux_state);\n        if (real_status)\n            pr_info("Samsung 4.19 Trial17: real SELinux status page initialized lazily\\n");\n        else\n            pr_warn("Samsung 4.19 Trial17: selinux_kernel_status_page returned NULL\\n");\n    }\n#endif\n'
          
          s = s.replace(marker, insert, 1)
          p.write_text(s)
          print("Trial 17 v2 lazy SELinux status-page patch applied")
          PY
          
          echo "=== Trial 17 v2 patch verification ==="
          python3 - <<'PY'
          from pathlib import Path
          
          s = Path("KernelSU-Next/kernel/feature/selinux_hide.c").read_text()
          required = [
              'static void initialize_fake_status()',
              'if (!KSU_SELINUX_STATUS_PAGE)',
              'selinux_kernel_status_page(&selinux_state)',
              'Samsung 4.19 Trial17: real SELinux status page initialized lazily',
              'Samsung 4.19 Trial17: selinux_kernel_status_page returned NULL',
              'initialize_fake_status initialized:',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"Trial 17 v2 verification missing: {needle}")
          
          print("Trial 17 v2 verification passed")
          PY

      - name: Build M127F kernel
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchain/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Verify kernel and KSUN output
        run: |
          set -euxo pipefail

          test -s arch/arm64/boot/Image
          test -s vmlinux
          test -s System.map
          test -e drivers/kernelsu

          KSUN_OBJECT="$(
            find -L drivers/kernelsu -type f -name '*.o' -print -quit
          )"
          test -n "$KSUN_OBJECT"

          SELINUX_HIDE_OBJECT="$(
            find -L drivers/kernelsu -type f -name 'selinux_hide.o' -print -quit
          )"
          test -n "$SELINUX_HIDE_OBJECT"

          if ! grep -Eq 'ksu_(selinux_hide|feature_selinux_hide)|selinux_hide' System.map; then
            echo "ERROR: SELinux Hide symbol not found in final System.map"
            exit 1
          fi

          echo "KSUN object: $KSUN_OBJECT"
          echo "SELinux Hide object: $SELINUX_HIDE_OBJECT"
          echo "SELinux Hide symbols found in final linked kernel."
          ls -lh arch/arm64/boot/Image vmlinux System.map
          sha256sum arch/arm64/boot/Image

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail
          test -d anykernel
          test -f anykernel/anykernel.sh
          rm -rf output
          mkdir -p output
          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image
          test -s output/Image
          test -f output/anykernel.sh

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail
          ZIP_NAME="M127F-KSUN-v3.3.0-TRIAL-54-SUSFS-V220-TASK-MMU-KSTAT-HELPER-API.zip"
          rm -f "$ZIP_NAME"
          cd output
          zip -r9 "../$ZIP_NAME" .
          cd ..
          test -s "$ZIP_NAME"
          ls -lh "$ZIP_NAME"
          sha256sum "$ZIP_NAME"
          unzip -l "$ZIP_NAME"

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-TRIAL-54-SUSFS-V220-TASK-MMU-KSTAT-HELPER-API
          path: M127F-KSUN-v3.3.0-TRIAL-54-SUSFS-V220-TASK-MMU-KSTAT-HELPER-API.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config
          if-no-files-found: error
          include-hidden-files: true
