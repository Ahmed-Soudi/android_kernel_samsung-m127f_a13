                  pr_err("SELinux 4.19 state has no security server\\n");
                  goto out_unlock;
              }
              db = &selinux_state.ss->policydb;
          #else
              mutex_lock(&selinux_state.policy_mutex);

              old_pol = selinux_state.policy;
              pol = ksu_dup_sepolicy(rcu_dereference_protected(
                  old_pol, lockdep_is_held(&selinux_state.policy_mutex)));
              if (IS_ERR(pol)) {
                  ret = PTR_ERR(pol);
                  pr_err("ksu_dup_sepolicy err: %d\\n", ret);
                  goto out_unlock;
              }
              db = &pol->policydb;
          #endif
          '''

              if old_lock_block not in original:
                  raise SystemExit("handle_sepolicy lock block not found")
              original = original.replace(old_lock_block, new_lock_block, 1)

              old_commit = '''    rcu_assign_pointer(selinux_state.policy, pol);
              synchronize_rcu();
              ksu_destroy_sepolicy(old_pol);

              reset_avc_cache();
              ret = success_cmd_count;
              goto out_unlock;

          out_drop_new_policy:
              ksu_destroy_sepolicy(pol);
          out_unlock:
              mutex_unlock(&selinux_state.policy_mutex);
          '''

              new_commit = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
              rcu_assign_pointer(selinux_state.policy, pol);
              synchronize_rcu();
              ksu_destroy_sepolicy(old_pol);
          #endif

              reset_avc_cache();
              ret = success_cmd_count;
              goto out_unlock;

          out_drop_new_policy:
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
              ksu_destroy_sepolicy(pol);
          #endif
          out_unlock:
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
              mutex_unlock(&ksu_rules_419);
          #else
              mutex_unlock(&selinux_state.policy_mutex);
          #endif
          '''

              if old_commit not in original:
                  raise SystemExit("handle_sepolicy commit block not found")
              original = original.replace(old_commit, new_commit, 1)

              s = s[:start] + original + s[end:]

          p.write_text(s)

          # ------------------------------------------------------------
          # C) selinux_hide.c: fix Samsung's sidtab pointer layout and a
          #    macro replacement bug from the previous compatibility step.
          #    SELinux Hide remains enabled and uses backup_sepolicy.
          # ------------------------------------------------------------
          p = Path("KernelSU-Next/kernel/feature/selinux_hide.c")
          h = p.read_text()

          h = h.replace(
              "#define KSU_SELINUX_STATUS_LOCK (KSU_SELINUX_STATUS_LOCK)",
              "#define KSU_SELINUX_STATUS_LOCK (selinux_state.status_lock)",
