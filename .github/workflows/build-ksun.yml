name: Build M127F Kernel - KSUN v3.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - ksun-3.3.0-susfs
    paths:
      - ".github/workflows/build-ksun.yml"
      - "arch/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - "KernelSU-Next/**"
      - "Makefile"
      - "Kconfig*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download Android Clang r383902
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/toolchain"

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz

          tar -xf /tmp/clang-r383902.tar.gz \
            -C "$HOME/toolchain"

          echo "=== Clang version ==="
          "$HOME/toolchain/bin/clang" --version

          echo "=== AArch64 GNU linker ==="
          aarch64-linux-gnu-ld --version | head

      - name: Verify KernelSU-Next v3.3.0 source
        run: |
          set -euxo pipefail

          echo "=== KernelSU-Next source ==="

          test -d KernelSU-Next

          cd KernelSU-Next

          echo "HEAD:"
          git rev-parse HEAD || true

          echo "Description:"
          git describe --tags --always || true

          echo "SELinux Hide source:"
          find kernel -type f \
            \( -iname '*selinux*hide*' -o -iname '*susfs*' \) \
            -print || true

          cd ..

      - name: Configure M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos850-m12nsxx_defconfig

          echo "=== Kernel release configuration ==="
          grep -E 'CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO' .config || true

          echo "=== KernelSU configuration ==="
          grep -iE 'KSU|KERNELSU' .config || true

          echo "=== SELinux configuration ==="
          grep -i 'CONFIG_SECURITY_SELINUX' .config || true

          echo "=== SUSFS configuration ==="
          grep -i 'SUSFS' .config || true

          echo "=== KPROBE configuration ==="
          grep -i 'KPROBE' .config || true

      - name: Verify compiler environment
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          echo "=== clang ==="
          which clang
          clang --version

          echo "=== linker ==="
          which aarch64-linux-gnu-ld
          aarch64-linux-gnu-ld --version | head

          echo "=== assembler ==="
          which aarch64-linux-gnu-as
          aarch64-linux-gnu-as --version | head

          echo "=== compiler target test ==="
          echo | clang \
            --target=aarch64-linux-gnu \
            -dM -E - \
            | grep -E "__aarch64__|__AARCH64"

      - name: Build M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Verify kernel image
        run: |
          set -euxo pipefail

          echo "=== arch/arm64/boot ==="
          ls -lah arch/arm64/boot/

          echo "=== Kernel images ==="
          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
            \) \
            -ls

          test -s arch/arm64/boot/Image

          echo "=== Final Image ==="
          ls -lh arch/arm64/boot/Image

          echo "SHA256:"
          sha256sum arch/arm64/boot/Image

      - name: Verify KernelSU objects
        run: |
          set -euxo pipefail

          echo "=== KernelSU build output ==="

          find drivers/kernelsu \
            -type f \
            \( -name '*.o' -o -name 'built-in.a' \) \
            -print | head -100 || true

          if [ -d drivers/kernelsu ]; then
            test -n "$(find drivers/kernelsu -type f -name '*.o' -print -quit)"
          else
            echo "drivers/kernelsu does not exist"
            exit 1
          fi

      - name: Verify native SELinux Hide was compiled
        run: |
          set -euxo pipefail

          echo "=== Searching compiled SELinux Hide objects ==="

          find drivers/kernelsu \
            -type f \
            \( \
              -iname '*selinux*hide*.o' \
              -o -iname '*selinux_hide*.o' \
            \) \
            -print || true

          echo "=== Searching source references ==="

          grep -Rni \
            --include='*.c' \
            --include='*.h' \
            --include='Makefile' \
            --include='Kbuild' \
            'selinux_hide' \
            drivers/kernelsu \
            KernelSU-Next/kernel 2>/dev/null | head -100 || true

      - name: Verify AnyKernel template
        run: |
          set -euxo pipefail

          echo "=== AnyKernel template ==="

          test -d anykernel
          test -f anykernel/anykernel.sh

          ls -lah anykernel/

          echo "=== anykernel.sh header ==="
          head -80 anykernel/anykernel.sh

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail

          rm -rf output
          mkdir -p output

          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image

          echo "=== Packaged Image ==="
          ls -lh output/Image

          echo "=== AnyKernel package contents ==="
          find output \
            -maxdepth 3 \
            -type f \
            -print | sort

          test -s output/Image
          test -f output/anykernel.sh

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail

          rm -f M127F-KSUN-v3.3.0-SELinuxHide.zip

          cd output

          zip -r9 \
            ../M127F-KSUN-v3.3.0-SELinuxHide.zip \
            .

          cd ..

          echo "=== Flashable ZIP ==="
          ls -lh M127F-KSUN-v3.3.0-SELinuxHide.zip

          echo "=== ZIP contents ==="
          unzip -l M127F-KSUN-v3.3.0-SELinuxHide.zip

          echo "=== ZIP SHA256 ==="
          sha256sum M127F-KSUN-v3.3.0-SELinuxHide.zip

          test -s M127F-KSUN-v3.3.0-SELinuxHide.zip

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-SELinuxHide
          path: M127F-KSUN-v3.3.0-SELinuxHide.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config
          if-no-files-found: error
