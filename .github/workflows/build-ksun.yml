name: Build M127F Kernel - KSUN v3.3.0 - Trial 54 SUSFS v2.2.0 task_mmu Kstat Helper API Port

on:
  workflow_dispatch:
  push:
    branches:
      - ksun-3.3.0-susfs
    paths:
      - ".github/workflows/build-ksun.yml"
      - "arch/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - "KernelSU-Next/**"
      - "anykernel/**"
      - "Makefile"
      - "Kconfig*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev python3 zip unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache Android Clang r383902
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: android-clang-r383902-${{ runner.os }}-${{ runner.arch }}

      - name: Download Android Clang r383902
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$HOME/toolchain"
          mkdir -p "$HOME/toolchain"

          curl --fail --location --retry 5 --retry-delay 3 \
            --connect-timeout 30 --max-time 600 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz

          tar -xf /tmp/clang-r383902.tar.gz -C "$HOME/toolchain"
          rm -f /tmp/clang-r383902.tar.gz

      - name: Verify Android Clang r383902
        run: |
          set -euxo pipefail
          test -x "$HOME/toolchain/bin/clang"
          
          CLANG_VERSION="$("$HOME/toolchain/bin/clang" --version)"
          printf '%s\n' "$CLANG_VERSION"
          
          # r383902 is Android clang 11.0.1. If a damaged/wrong cache is ever
          # restored, fail here instead of compiling with an unknown toolchain.
          printf '%s\n' "$CLANG_VERSION" | grep -q "clang version 11.0.1"
          aarch64-linux-gnu-ld --version | head -1

      - name: Verify KernelSU-Next v3.3.0 source
        run: |
          set -euxo pipefail
          test -d KernelSU-Next
          cd KernelSU-Next
          test "$(git rev-parse HEAD)" = "3b18216f71df189ab3d1b1ce0bdb21be1268e771"
          test -f kernel/feature/selinux_hide.c
          test -f kernel/feature/selinux_hide.h
          git describe --tags --always
          cd ..

      - name: Trial 18 v2 import proven Project-Xed SUSFS v1.5.5 + v1.5.7
        run: |
          set -euxo pipefail
          
          SUSFS_155="dbd9d7cbd0229c2a35fd9909a36f4649dfc47a73"
          SUSFS_157="6d2c2003ad0f5c0f2a1f5f303f00aef19a0b79f2"
          XED_REPO="https://github.com/maazm7d/kernel_samsung_a12.git"
          
          echo "=== Browser-only Trial 18 v2 ==="
          echo "The GitHub Actions runner performs the SUSFS import automatically."
          echo "Source: $XED_REPO"
          echo "SUSFS base commit: $SUSFS_155"
          echo "SUSFS v1.5.7 update: $SUSFS_157"
          
          git remote remove xed-susfs 2>/dev/null || true
          git remote add xed-susfs "$XED_REPO"
          git fetch --no-tags --depth=2 xed-susfs "$SUSFS_155"
          git fetch --no-tags --depth=2 xed-susfs "$SUSFS_157"
          
          echo "=== Files changed by original SUSFS 1.5.5 import ==="
          git diff-tree --no-commit-id --name-status -r "$SUSFS_155"
          
          echo "=== Files changed by original SUSFS 1.5.7 update ==="
          git diff-tree --no-commit-id --name-status -r "$SUSFS_157"
          
          # Recreate the exact two Project-Xed SUSFS kernel commits as patches.
          # This runs on the CI runner; the user does not need a terminal.
          git show --format= --binary "$SUSFS_155" > /tmp/xed-susfs-1.5.5.patch
          git show --format= --binary "$SUSFS_157" > /tmp/xed-susfs-1.5.7.patch
          
          echo "=== Apply SUSFS v1.5.5 ==="
          if ! git apply --3way --whitespace=nowarn /tmp/xed-susfs-1.5.5.patch; then
            echo "::error::Trial 18 v2: SUSFS v1.5.5 did not apply cleanly."
            git status --short
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          
          echo "=== Apply SUSFS v1.5.7 update ==="
          if ! git apply --3way --whitespace=nowarn /tmp/xed-susfs-1.5.7.patch; then
            echo "::error::Trial 18 v2: SUSFS v1.5.7 update did not apply cleanly."
            git status --short
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          
          echo "=== Verify imported SUSFS tree ==="
          test -f fs/susfs.c
          test -f include/linux/susfs_def.h
          grep -Rns --include='Kconfig*' \
            -E 'config[[:space:]]+KSU_SUSFS|KSU_SUSFS_SUS_PATH|KSU_SUSFS_SUS_MOUNT' \
            . 2>/dev/null | head -n 120 || true
          grep -Rns \
            -E 'SUSFS_VERSION|v1\.5\.7' \
            fs include 2>/dev/null | head -n 80 || true
          
          if ! grep -Rqs --include='Kconfig*' \
              -E 'config[[:space:]]+KSU_SUSFS([[:space:]]|$)' \
              . 2>/dev/null; then
            echo "Trial 18 v3: kernel-side SUSFS imported; Kconfig glue is absent as expected and will be added next."
          else
            echo "Trial 18 v3: existing KSU_SUSFS Kconfig definition found."
          fi
          
          echo "Trial 18 v3: proven Project-Xed SUSFS kernel integration imported."

      - name: Trial 18 v3 add KSUN SUSFS Kconfig glue
        run: |
          set -euxo pipefail
          
          KCFG="KernelSU-Next/kernel/Kconfig"
          test -f "$KCFG"
          
          if ! grep -qE '^config[[:space:]]+KSU_SUSFS([[:space:]]|$)' "$KCFG"; then
            cat >> "$KCFG" <<'EOF'
          
          config KSU_SUSFS
              bool "KernelSU SUSFS support"
              depends on KSU
              default n
              help
                Enable SUSFS kernel integration for KernelSU.
          
          EOF
            echo "Trial 18 v3: added CONFIG_KSU_SUSFS to $KCFG"
          else
            echo "Trial 18 v3: CONFIG_KSU_SUSFS already exists in $KCFG"
          fi
          
          echo "=== Kconfig glue verification ==="
          grep -nA8 -B2 -E '^config[[:space:]]+KSU_SUSFS([[:space:]]|$)' "$KCFG"

      - name: Trial 19 wire SUSFS v1.5.7 feature Kconfig
        run: |
          set -euxo pipefail
          
          KCFG="KernelSU-Next/kernel/Kconfig"
          test -f "$KCFG"
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          
          echo "=== SUSFS feature macros referenced by imported Project-Xed tree ==="
          grep -RhoE 'CONFIG_KSU_SUSFS_[A-Z0-9_]+' \
            fs include KernelSU-Next/kernel 2>/dev/null \
            | sort -u | tee /tmp/susfs_feature_macros.txt || true
          
          add_cfg () {
            sym="$1"
            prompt="$2"
            macro="CONFIG_${sym}"
          
            if ! grep -qx "$macro" /tmp/susfs_feature_macros.txt; then
              echo "skip $sym: imported v1.5.7 tree does not reference it"
              return 0
            fi
          
            if grep -qE "^config[[:space:]]+$sym([[:space:]]|$)" "$KCFG"; then
              echo "skip $sym: already defined"
              return 0
            fi
          
            cat >> "$KCFG" <<EOF
          
          config $sym
              bool "$prompt"
              depends on KSU_SUSFS
              default y
          EOF
          }
          
          add_cfg KSU_SUSFS_SUS_PATH "Hide suspicious paths"
          add_cfg KSU_SUSFS_SUS_MOUNT "Hide suspicious mounts"
          add_cfg KSU_SUSFS_SUS_KSTAT "Spoof suspicious kstat"
          add_cfg KSU_SUSFS_TRY_UMOUNT "Enable SUSFS try_umount"
          add_cfg KSU_SUSFS_SPOOF_UNAME "Enable uname spoofing"
          add_cfg KSU_SUSFS_ENABLE_LOG "Enable SUSFS kernel logging"
          add_cfg KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS "Hide KSU/SUSFS kallsyms"
          add_cfg KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG "Spoof cmdline/bootconfig"
          add_cfg KSU_SUSFS_OPEN_REDIRECT "Enable open redirect"
          
          echo "=== Final SUSFS Kconfig symbols ==="
          grep -nE '^config KSU_SUSFS($|_)' "$KCFG" || true

      - name: Trial 19 v3 backport SUSFS inotify fdinfo to Samsung 4.19
        run: |
          set -euxo pipefail
          
          FILE="fs/notify/fdinfo.c"
          test -f "$FILE"
          
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path("fs/notify/fdinfo.c")
          s = p.read_text()
          
          # Project-Xed SUSFS was synced against a newer inotify fdinfo API
          # which has inotify_mark_user_mask(). Samsung 4.19 instead computes
          # the userspace-visible mask directly as mark->mask & IN_ALL_EVENTS.
          # Also keep the declaration before SUSFS goto labels: a declaration
          # immediately following a label is invalid for this kernel's C mode.
          needle = """\tstruct inotify_inode_mark *inode_mark;
          \tstruct inode *inode;
          """
          repl = """\tstruct inotify_inode_mark *inode_mark;
          \tstruct inode *inode;
          \tu32 mask;
          """
          if needle not in s:
              raise SystemExit("Trial19 v3: inotify local-variable anchor not found")
          s = s.replace(needle, repl, 1)
          
          # Replace both SUSFS and normal fdinfo uses of the newer helper.
          if "inotify_mark_user_mask(mark)" not in s:
              raise SystemExit("Trial19 v3: expected inotify_mark_user_mask() calls not found")
          s = s.replace("inotify_mark_user_mask(mark)", "mark->mask & IN_ALL_EVENTS")
          
          # The original Samsung 4.19 block declares mask after the SUSFS
          # out_seq_printf label once the Xed patch is applied. Remove that
          # declaration and use the function-scope variable instead.
          old = """\t\t/*
          \t\t * IN_ALL_EVENTS represents all of the mask bits
          \t\t * that we expose to userspace.  There is at
          \t\t * least one bit (FS_EVENT_ON_CHILD) which is
          \t\t * used only internally to the kernel.
          \t\t */
          \t\tu32 mask = mark->mask & IN_ALL_EVENTS;
          """
          if old in s:
              s = s.replace(old, """\t\tmask = mark->mask & IN_ALL_EVENTS;
          """, 1)
          else:
              # Xed's patch may have replaced the surrounding block. Ensure
              # the fallback normal path still assigns the old-kernel mask.
              label = "out_seq_printf:\n#endif\n"
              if label not in s:
                  raise SystemExit("Trial19 v3: out_seq_printf label anchor not found")
              s = s.replace(label, label + "\t\tmask = mark->mask & IN_ALL_EVENTS;\n", 1)
          
          p.write_text(s)
          PY
          
          echo "=== Trial 19 v3 fdinfo compatibility verification ==="
          if grep -n 'inotify_mark_user_mask' "$FILE"; then
            echo "::error::newer inotify_mark_user_mask helper remains"
            exit 1
          fi
          grep -n -A60 -B8 'static void inotify_fdinfo' "$FILE" | head -n 100
          grep -q 'u32 mask;' "$FILE"
          grep -q 'mark->mask & IN_ALL_EVENTS' "$FILE"
          
          echo "Trial 19 v3: SUSFS inotify fdinfo adapted to Samsung 4.19 API."

      - name: Trial 19 v5 bridge SUSFS v1.5.7 to pinned KSUN 3.3.0
        run: |
          set -euxo pipefail
          
          cat > /tmp/trial19_bridge.py <<'PY'
          from pathlib import Path
          
          sel = Path("KernelSU-Next/kernel/selinux/selinux.c")
          s = sel.read_text()
          if "bool susfs_is_current_ksu_domain(void)" not in s:
              s += """
          #ifdef CONFIG_KSU_SUSFS
          bool susfs_is_current_ksu_domain(void)
          {
              return is_ksu_domain();
          }
          
          bool susfs_is_current_zygote_domain(void)
          {
              return is_zygote(current_cred());
          }
          #endif
          """
              sel.write_text(s)
          
          ku = Path("KernelSU-Next/kernel/feature/kernel_umount.c")
          s = ku.read_text()
          marker = "void ksu_try_umount(const char *mnt, bool check_mnt, int flags, uid_t uid)"
          if marker not in s:
              if "static void try_umount(const char *mnt, int flags)" not in s:
                  raise SystemExit("Trial19 v5: KSUN try_umount helper not found")
              insert_anchor = "struct umount_tw {"
              pos = s.find(insert_anchor)
              if pos < 0:
                  raise SystemExit("Trial19 v5: struct umount_tw anchor not found")
              add = """
          #ifdef CONFIG_KSU_SUSFS
          void ksu_try_umount(const char *mnt, bool check_mnt, int flags, uid_t uid)
          {
              (void)check_mnt;
              (void)uid;
              try_umount(mnt, flags);
          }
          #endif
          
          """
              s = s[:pos] + add + s[pos:]
              ku.write_text(s)
          
          ns = Path("fs/namespace.c")
          s = ns.read_text()
          s = s.replace("susfs_try_umount_all", "susfs_try_umount")
          ns.write_text(s)
          PY
          
          python3 /tmp/trial19_bridge.py
          
          echo "=== Trial 19 v5 bridge verification ==="
          grep -n 'bool susfs_is_current_ksu_domain' KernelSU-Next/kernel/selinux/selinux.c
          grep -n 'bool susfs_is_current_zygote_domain' KernelSU-Next/kernel/selinux/selinux.c
          grep -n 'void ksu_try_umount' KernelSU-Next/kernel/feature/kernel_umount.c
          ! grep -n 'susfs_try_umount_all' fs/namespace.c
          grep -n 'susfs_try_umount(current_uid().val)' fs/namespace.c
          echo "Trial 19 v5: SUSFS/KSUN bridge installed."

      - name: Trial 34 transplant SUSFS v2.2.0 after proven v1.5.7 import/bridge
        run: |
          set -euxo pipefail
          
          # Trial34 ordering guard: the known-good Project-Xed v1.5.7 import and
          # KSUN bridge MUST already have run before we snapshot/replace the core.
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          test -f fs/susfs.c
          grep -q '#define SUSFS_VERSION "v1.5.7"' include/linux/susfs.h
          grep -q 'Trial19v5' KernelSU-Next/kernel/supercall/supercall.c || true
          echo "Trial34: confirmed v1.5.7 core exists before v2.2.0 transplant"
          
          # First v2.x migration gate.
          #
          # IMPORTANT:
          # - We deliberately DO NOT apply the upstream 5.15 kernel patch wholesale.
          # - We deliberately DO NOT replace our proven Samsung 4.19 KSUN/SELinux/Exynos fixes.
          # - We transplant only the v2.2.0 SUSFS core implementation + public ABI headers.
          # - Compile errors from old 4.19 call sites are expected to identify the exact
          #   compatibility work needed for the next porting trial.
          #
          # Trial32 successfully resolved the exact v2.2.0 commit but then
          # exited 141 because `set -o pipefail` treated awk's early exit as
          # SIGPIPE from `git log`. Pin the resolved full SHA directly.
          SUSFS_V220_BRANCH="gki-android14-5.15"
          SUSFS_V220_COMMIT="dbd8552d63ba7fcbc259aef2324867076b62fce5"
          
          rm -rf /tmp/susfs-v220
          git clone --filter=blob:none --single-branch --branch "${SUSFS_V220_BRANCH}" \
            --depth=250 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs-v220
          
          # Verify the pinned commit is present in the fetched branch history.
          git -C /tmp/susfs-v220 cat-file -e "${SUSFS_V220_COMMIT}^{commit}" || {
            echo "Trial34: pinned SUSFS v2.2.0 commit is not present in fetched history"
            exit 1
          }
          
          git -C /tmp/susfs-v220 checkout --detach "${SUSFS_V220_COMMIT}"
          
          echo "=== Pinned SUSFS v2.2.0 source ==="
          git -C /tmp/susfs-v220 log -1 --format='%H %s'
          test "$(git -C /tmp/susfs-v220 rev-parse HEAD)" = "${SUSFS_V220_COMMIT}"
          test "$(git -C /tmp/susfs-v220 log -1 --format='%s')" = "Bump version to v2.2.0"
          grep -n 'SUSFS_VERSION' \
            /tmp/susfs-v220/kernel_patches/include/linux/susfs.h
          grep -nE \
            'SUSFS_MAGIC|CMD_SUSFS_ADD_SUS_PATH_LOOP|CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS|CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING|CMD_SUSFS_ADD_SUS_MAP' \
            /tmp/susfs-v220/kernel_patches/include/linux/susfs_def.h
          
          grep -q '#define SUSFS_VERSION "v2.2.0"' \
            /tmp/susfs-v220/kernel_patches/include/linux/susfs.h || {
              echo "Trial34: pinned source is not SUSFS v2.2.0"
              exit 1
            }
          
          # Preserve the complete known-good v1.5.7 core for comparison in CI logs.
          mkdir -p /tmp/susfs-v157-known-good
          cp -f include/linux/susfs.h /tmp/susfs-v157-known-good/
          cp -f include/linux/susfs_def.h /tmp/susfs-v157-known-good/
          cp -f fs/susfs.c /tmp/susfs-v157-known-good/
          
          # Core transplant only. Do NOT import the GKI 5.15 kernel patch or upstream
          # KernelSU patch; our Samsung 4.19 integration must be ported deliberately.
          cp -f /tmp/susfs-v220/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h
          cp -f /tmp/susfs-v220/kernel_patches/include/linux/susfs_def.h \
            include/linux/susfs_def.h
          cp -f /tmp/susfs-v220/kernel_patches/fs/susfs.c \
            fs/susfs.c
          
          echo "=== v1.5.7 -> v2.2.0 ABI delta summary ==="
          diff -u /tmp/susfs-v157-known-good/susfs_def.h include/linux/susfs_def.h \
            | sed -n '1,260p' || true
          diff -u /tmp/susfs-v157-known-good/susfs.h include/linux/susfs.h \
            | sed -n '1,320p' || true
          
          echo "=== Trial34 invariants ==="
          grep -q '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          grep -q '#define SUSFS_MAGIC 0xFAFAFAFA' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_ADD_SUS_PATH_LOOP' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_ADD_SUS_MAP' include/linux/susfs_def.h
          
          # v2.x changes the ABI materially. Ensure we do not accidentally leave the
          # old Trial20-30 synthetic dispatcher in supercall.c.
          if grep -q 'Trial30 SUSFS:' KernelSU-Next/kernel/supercall/supercall.c; then
            echo "Trial34: stale Trial30 SUSFS dispatcher still present"
            exit 1
          fi
          
          # Keep the Samsung-dangerous probe suppressions untouched.
          grep -R -n \
            'Samsung 4.19.*reboot\|Samsung 4.19.*input_event\|slow_avc_audit\|syscall_regfunc' \
            KernelSU-Next/kernel | head -120 || true
          
          echo "Trial34: v2.2.0 core transplant complete; continuing to compile gate."

      - name: Trial 35 port SUSFS fdinfo to v2.2.0 state model
        run: |
          set -euxo pipefail
          
          FILE="fs/notify/fdinfo.c"
          test -f "$FILE"
          grep -q '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          grep -q 'AS_FLAGS_SUS_KSTAT' include/linux/susfs_def.h
          grep -q 'TIF_PROC_UMOUNTED' include/linux/susfs_def.h
          
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path("fs/notify/fdinfo.c")
          s = p.read_text()
          
          old = """\t\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&
          \t\t\t\tunlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {
          """
          new = """\t\tif (likely(test_thread_flag(TIF_PROC_UMOUNTED)) &&
          \t\t\t\tunlikely(test_bit(AS_FLAGS_SUS_KSTAT,
          \t\t\t\t\t\t  &inode->i_mapping->flags))) {
          """
          
          if old not in s:
              raise SystemExit("Trial35: v1.5.7 fdinfo task/inode state check not found")
          
          s = s.replace(old, new, 1)
          
          for stale in (
              "TASK_STRUCT_NON_ROOT_USER_APP_PROC",
              "INODE_STATE_SUS_KSTAT",
          ):
              if stale in s:
                  raise SystemExit(f"Trial35: stale v1.5.7 fdinfo symbol remains: {stale}")
          
          p.write_text(s)
          PY
          
          echo "=== Trial 35 fdinfo v2.2.0 state-model verification ==="
          grep -n -A10 -B6 'TIF_PROC_UMOUNTED' "$FILE"
          grep -q 'test_bit(AS_FLAGS_SUS_KSTAT' "$FILE"
          ! grep -q 'TASK_STRUCT_NON_ROOT_USER_APP_PROC' "$FILE"
          ! grep -q 'INODE_STATE_SUS_KSTAT' "$FILE"
          
          echo "Trial35: fdinfo migrated from v1.5.7 task/inode flags to SUSFS v2.2.0 thread/address-space flags."

      - name: Trial 36 port SUSFS task_mmu kstat state to v2.2.0 address-space flags
        run: |
          set -euxo pipefail

          FILE="fs/proc/task_mmu.c"
          test -f "$FILE"
          grep -q '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          grep -q 'AS_FLAGS_SUS_KSTAT' include/linux/susfs_def.h

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/proc/task_mmu.c")
          s = p.read_text()

          old = "if (unlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {"
          new = """if (unlikely(test_bit(AS_FLAGS_SUS_KSTAT,
                                          &inode->i_mapping->flags))) {"""

          count = s.count(old)
          if count != 1:
              raise SystemExit(
                  f"Trial36: expected exactly one v1.5.7 task_mmu SUS_KSTAT check, found {count}"
              )

          s = s.replace(old, new, 1)

          if "INODE_STATE_SUS_KSTAT" in s:
              raise SystemExit(
                  "Trial36: stale INODE_STATE_SUS_KSTAT remains in fs/proc/task_mmu.c"
              )

          p.write_text(s)
          PY

          echo "=== Trial 36 task_mmu v2.2.0 state-model verification ==="
          grep -n -A8 -B6 'AS_FLAGS_SUS_KSTAT' "$FILE"
          ! grep -q 'INODE_STATE_SUS_KSTAT' "$FILE"
          grep -q 'test_bit(AS_FLAGS_SUS_KSTAT' "$FILE"

          echo "Trial36: task_mmu SUS_KSTAT check migrated from inode->i_state to inode->i_mapping->flags."

      - name: Trial 37 port SUSFS proc fd mount state to v2.2.0 model
