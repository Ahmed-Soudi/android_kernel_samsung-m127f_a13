      - name: Trial 47 port SUSFS proc_namespace mount IDs and current_uid dependency
        run: |
          set -euxo pipefail

          HDR="include/linux/susfs_def.h"
          FILE="fs/proc_namespace.c"

          test -f "$HDR"
          test -f "$FILE"
          grep -q '#define SUSFS_VERSION "v2.2.0"' include/linux/susfs.h
          grep -q 'DEFAULT_KSU_MNT_ID' "$HDR"
          grep -q '#define current_uid()' include/linux/cred.h

          python3 - <<'PY'
          from pathlib import Path

          hdr = Path("include/linux/susfs_def.h")
          hs = hdr.read_text()

          # SUSFS v2.2.0 defines inline helpers in susfs_def.h that call
          # current_uid(). Samsung 4.19 provides current_uid() in linux/cred.h,
          # so the defining header must include it itself rather than relying
          # on include-order accidents from individual callers.
          if "#include <linux/cred.h>" not in hs:
              anchor = "#include <linux/bits.h>\n"
              if anchor not in hs:
                  raise SystemExit(
                      "Trial47: susfs_def.h bits.h include anchor not found"
                  )
              hs = hs.replace(
                  anchor,
                  anchor + "#include <linux/cred.h>\n",
                  1,
              )

          hdr.write_text(hs)

          p = Path("fs/proc_namespace.c")
          s = p.read_text()

          old = "DEFAULT_SUS_MNT_ID"
          count = s.count(old)
          if count != 3:
              raise SystemExit(
                  f"Trial47: expected exactly three proc_namespace "
                  f"DEFAULT_SUS_MNT_ID thresholds, found {count}"
              )

          s = s.replace(old, "DEFAULT_KSU_MNT_ID")

          if "DEFAULT_SUS_MNT_ID" in s:
              raise SystemExit(
                  "Trial47: stale DEFAULT_SUS_MNT_ID remains in fs/proc_namespace.c"
              )

          p.write_text(s)

          print(
              "Trial47: added linux/cred.h dependency to susfs_def.h and "
