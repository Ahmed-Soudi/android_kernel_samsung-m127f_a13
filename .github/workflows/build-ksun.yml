          PY

          echo "=== SELinux Hide early-hook isolation verification ==="
          grep -n -A28 'void __init ksu_selinux_hide_init' \
            KernelSU-Next/kernel/feature/selinux_hide.c
          grep -n -A18 'static int ksu_selinux_hide_enable' \
            KernelSU-Next/kernel/feature/selinux_hide.c

      - name: Fully isolate SELinux Hide runtime on Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/feature/selinux_hide.c")
          s = p.read_text()

          old_init = r'''void __init ksu_selinux_hide_init()
          {
              if (ksu_register_feature_handler(&selinux_hide_handler)) {
                  pr_err("Failed to register selinux_hide feature handler\n");
              }
              if (ksu_late_loaded) {
                  initialize_fake_status();
              } else {
                  static_key_enable(&fake_status_initialize_key.key);
              }

          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
              /*
               * Samsung 4.19 runtime-isolation test:
               *
               * Keep SELinux Hide compiled and registered, but do NOT patch
               * sel_handle_status_ops->open during early boot.
               *
               * The previous runtime log showed:
               *   failed to find phy addr for patch dst addr ...
               *   selinux_hide: init: patch_text sel_open_handle_status err: -2
               *
               * This leaves the feature handler, backup policy, fake-status
               * machinery, context/access hooks and setprocattr path intact.
               * If the phone boots, the next test is to make the status-open
               * hook Samsung-safe rather than permanently removing it.
               */
              pr_warn("selinux_hide: Samsung 4.19 test: skip early status-open text patch\n");
          #else
              hook_selinux_status_open();
          #endif
          }
          '''

          new_init = r'''void __init ksu_selinux_hide_init()
          {
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
              /*
               * Diagnostic only: completely skip SELinux Hide runtime
               * initialization on this Samsung 4.19 kernel. The code remains
               * compiled so this test isolates runtime initialization from
               * the rest of KSUN and our 4.19 SELinux policy backport.
               */
              pr_warn("selinux_hide: Samsung 4.19 diagnostic: runtime init disabled\n");
              return;
          #else
              if (ksu_register_feature_handler(&selinux_hide_handler)) {
                  pr_err("Failed to register selinux_hide feature handler\n");
              }
              if (ksu_late_loaded) {
                  initialize_fake_status();
              } else {
                  static_key_enable(&fake_status_initialize_key.key);
              }
              hook_selinux_status_open();
          #endif
          }
          '''

          if old_init not in s:
              raise SystemExit("patched ksu_selinux_hide_init() body not found exactly")
          s = s.replace(old_init, new_init, 1)

          # Prevent any accidental userspace activation on the diagnostic build.
          fn = "static int selinux_hide_feature_set(u64 value)"
          start = s.find(fn)
          if start < 0:
              raise SystemExit("selinux_hide_feature_set not found")
          body = s.find("{", start)
          if body < 0:
              raise SystemExit("selinux_hide_feature_set body not found")

          depth = 0
          end = None
          for i in range(body, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("selinux_hide_feature_set end not found")

          replacement = r'''static int selinux_hide_feature_set(u64 value)
          {
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
              pr_warn("selinux_hide: Samsung 4.19 diagnostic: runtime enable blocked\n");
              return -EOPNOTSUPP;
          #else
              bool enable = value != 0;
              int ret = 0;
              pr_info("selinux_hide: set to %d\n", enable);
              mutex_lock(&selinux_hide_mutex);
              ksu_selinux_hide_enabled = enable;
              if (enable) {
                  if (!ksu_selinux_hide_running) {
                      ret = ksu_selinux_hide_enable();
                      if (!ret) {
                          ksu_selinux_hide_running = true;
                      }
                  }
              } else {
                  if (ksu_selinux_hide_running) {
                      ksu_selinux_hide_disable();
                      ksu_selinux_hide_running = false;
                  }
              }
              mutex_unlock(&selinux_hide_mutex);
              return ret;
          #endif
          }'''

          s = s[:start] + replacement + s[end:]

          required = [
              "runtime init disabled",
              "runtime enable blocked",
              "static int ksu_selinux_hide_enable()",
              "KSU_FEATURE_SELINUX_HIDE",
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"missing diagnostic/feature code: {needle}")

          p.write_text(s)
          print("SELinux Hide runtime fully isolated for Samsung 4.19 diagnostic boot")
          PY

          echo "=== SELinux Hide full runtime isolation ==="
          grep -n -A24 'void __init ksu_selinux_hide_init' \
            KernelSU-Next/kernel/feature/selinux_hide.c
          grep -n -A18 'static int selinux_hide_feature_set' \
            KernelSU-Next/kernel/feature/selinux_hide.c

      - name: Configure M127F kernel
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchain/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos850-m12nsxx_defconfig

          echo "=== KernelSU ==="
          grep -iE 'KSU|KERNELSU' .config || true
          echo "=== SELinux ==="
          grep -i 'CONFIG_SECURITY_SELINUX' .config || true
          echo "=== SUSFS ==="
          grep -i 'SUSFS' .config || true
          echo "=== KPROBES ==="
          grep -i 'KPROBE' .config || true

      - name: Build M127F kernel
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchain/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Verify kernel and KSUN output
        run: |
          set -euxo pipefail

          test -s arch/arm64/boot/Image
          test -s vmlinux
          test -s System.map
          test -e drivers/kernelsu

          # drivers/kernelsu is a symlink to KernelSU-Next/kernel.
          # Plain `find` does not descend through a command-line symlink,
          # so follow it explicitly when checking generated KSUN objects.
          KSUN_OBJECT="$(
            find -L drivers/kernelsu -type f -name '*.o' -print -quit
          )"
          test -n "$KSUN_OBJECT"

          SELINUX_HIDE_OBJECT="$(
            find -L drivers/kernelsu -type f -name 'selinux_hide.o' -print -quit
          )"
          test -n "$SELINUX_HIDE_OBJECT"

          # Also verify that SELinux Hide made it into the final linked kernel,
          # not merely that its object file was produced.
          if ! grep -Eq 'ksu_(selinux_hide|feature_selinux_hide)|selinux_hide' System.map; then
            echo "ERROR: SELinux Hide symbol not found in final System.map"
            exit 1
          fi

          echo "KSUN object: $KSUN_OBJECT"
          echo "SELinux Hide object: $SELINUX_HIDE_OBJECT"
          echo "SELinux Hide symbols found in final linked kernel."

          ls -lh arch/arm64/boot/Image vmlinux System.map
          sha256sum arch/arm64/boot/Image

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail
          test -d anykernel
          test -f anykernel/anykernel.sh
          rm -rf output
          mkdir -p output
          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image
          test -s output/Image
          test -f output/anykernel.sh

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail
          ZIP_NAME="M127F-KSUN-v3.3.0-SELinuxHide.zip"
          rm -f "$ZIP_NAME"
          cd output
          zip -r9 "../$ZIP_NAME" .
          cd ..
          test -s "$ZIP_NAME"
          ls -lh "$ZIP_NAME"
          sha256sum "$ZIP_NAME"
          unzip -l "$ZIP_NAME"

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-SELinuxHide
          path: M127F-KSUN-v3.3.0-SELinuxHide.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config
          if-no-files-found: error
          include-hidden-files: true
