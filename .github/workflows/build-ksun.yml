name: Build M127F Kernel - KSUN v3.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - ksun-3.3.0-susfs
    paths:
      - ".github/workflows/build-ksun.yml"
      - "arch/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - "KernelSU-Next/**"
      - "anykernel/**"
      - "Makefile"
      - "Kconfig*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev python3 zip unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download Android Clang r383902
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchain"
          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz
          tar -xf /tmp/clang-r383902.tar.gz -C "$HOME/toolchain"
          rm -f /tmp/clang-r383902.tar.gz
          "$HOME/toolchain/bin/clang" --version
          aarch64-linux-gnu-ld --version | head

      - name: Verify KernelSU-Next v3.3.0 source
        run: |
          set -euxo pipefail
          test -d KernelSU-Next
          cd KernelSU-Next
          test "$(git rev-parse HEAD)" = "3b18216f71df189ab3d1b1ce0bdb21be1268e771"
          test -f kernel/feature/selinux_hide.c
          test -f kernel/feature/selinux_hide.h
          git describe --tags --always
          cd ..

      - name: Patch KSUN file wrapper for Samsung 4.19
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/infra/file_wrapper.c")
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              s = s.replace(old, new, 1)
              print("patched:", label)

          old = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, struct io_comp_batch *icb,
                                        unsigned int v)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, icb, v);
          }
          #else
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, spin);
          }
          #endif
          '''
          new = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, struct io_comp_batch *icb,
                                        unsigned int v)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, icb, v);
          }
          #else
          static int ksu_wrapper_iopoll(struct kiocb *kiocb, bool spin)
          {
              struct ksu_file_wrapper *data = kiocb->ki_filp->private_data;
              struct file *orig = data->orig;
              kiocb->ki_filp = orig;
              return orig->f_op->iopoll(kiocb, spin);
          }
          #endif
          #endif
          '''
          once(old, new, "iopoll implementation")

          start = s.index("// no REMAP_FILE_DEDUP: use file_in")
          end_marker = "\n}\n\nstatic int ksu_wrapper_fadvise"
          end = s.index(end_marker, start) + 3
          block = s[start:end]
          s = s[:start] + (
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 3, 0)\n" +
              block +
              "#endif\n"
          ) + s[end:]
          print("patched: remap_file_range implementation")

          old = "    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n"
          new = (
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n"
              "    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n"
              "#endif\n"
          )
          once(old, new, "iopoll assignment")

          old = '''    p->ops.remap_file_range =
                  fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;
          '''
          new = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 3, 0)
              p->ops.remap_file_range =
                  fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;
          #endif
          '''
          once(old, new, "remap_file_range assignment")

          old = '''    const struct qstr qname = QSTR_INIT(name, strlen(name));
              int error;
          '''
          new = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
              const struct qstr qname = QSTR_INIT(name, strlen(name));
              int error;
          #endif
          '''
          once(old, new, "anon inode declarations")

          old = '''    inode->i_flags &= ~S_PRIVATE;
              error = security_inode_init_security_anon(inode, &qname, context_inode);
              if (error) {
                  iput(inode);
                  return ERR_PTR(error);
              }
              return inode;
          '''
          new = '''    inode->i_flags &= ~S_PRIVATE;
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
              error = security_inode_init_security_anon(inode, &qname, context_inode);
              if (error) {
                  iput(inode);
                  return ERR_PTR(error);
              }
          #else
              (void)name;
              (void)context_inode;
          #endif
              return inode;
          '''
          once(old, new, "anon inode security")

          old = "    struct inode_security_struct *wrapper_sec = selinux_inode(wrapper_inode);\n"
          new = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)
              struct inode_security_struct *wrapper_sec = selinux_inode(wrapper_inode);
          #else
              struct inode_security_struct *wrapper_sec =
                  (struct inode_security_struct *)wrapper_inode->i_security;
          #endif
          '''
          once(old, new, "inode security access")

          p.write_text(s)
          PY

      - name: Backport KSUN package observer to Samsung 4.19 fsnotify
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path("KernelSU-Next/kernel/manager/pkg_observer.c")
          p.write_text(dedent(r'''
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/fs.h>
          #include <linux/namei.h>
          #include <linux/fsnotify_backend.h>
          #include <linux/slab.h>
          #include <linux/string.h>
          #include "klog.h"
          #include "manager/throne_tracker.h"

          #define MASK_SYSTEM (FS_CREATE | FS_MOVE | FS_EVENT_ON_CHILD)

          struct watch_dir {
              const char *path;
              u32 mask;
              struct path kpath;
              struct inode *inode;
              struct fsnotify_mark *mark;
          };

          static struct fsnotify_group *g;

          static void ksu_free_mark(struct fsnotify_mark *mark)
          {
              kfree(mark);
          }

          static int ksu_handle_event(struct fsnotify_group *group,
                                      struct inode *inode,
                                      u32 mask,
                                      const void *data,
                                      int data_type,
                                      const unsigned char *file_name,
                                      u32 cookie,
                                      struct fsnotify_iter_info *iter_info)
          {
              (void)group;
              (void)inode;
              (void)data;
              (void)data_type;
              (void)cookie;
              (void)iter_info;

              if (!file_name || (mask & FS_ISDIR))
                  return 0;

              if (!strcmp((const char *)file_name, "packages.list"))
                  track_throne(false);

              return 0;
          }

          static const struct fsnotify_ops ksu_ops = {
              .handle_event = ksu_handle_event,
              .free_mark = ksu_free_mark,
          };

          static int add_mark_on_inode(struct inode *inode,
                                       u32 mask,
                                       struct fsnotify_mark **out)
          {
              struct fsnotify_mark *m;
              int ret;

              m = kzalloc(sizeof(*m), GFP_KERNEL);
              if (!m)
                  return -ENOMEM;

              fsnotify_init_mark(m, g);
              m->mask = mask;

              ret = fsnotify_add_mark(m,
                                      &inode->i_fsnotify_marks,
                                      FSNOTIFY_OBJ_TYPE_INODE,
                                      0);
              if (ret) {
                  fsnotify_put_mark(m);
                  return ret;
              }

              *out = m;
              return 0;
          }

          static struct watch_dir g_watch = {
              .path = "/data/system",
              .mask = MASK_SYSTEM,
          };

          int ksu_observer_init(void)
          {
              int ret;

              g = fsnotify_alloc_group(&ksu_ops);
              if (IS_ERR(g))
                  return PTR_ERR(g);

              ret = kern_path(g_watch.path, LOOKUP_FOLLOW, &g_watch.kpath);
              if (ret)
                  goto err_group;

              g_watch.inode = d_inode(g_watch.kpath.dentry);
              if (!g_watch.inode) {
                  ret = -ENOENT;
                  goto err_path;
              }

              ihold(g_watch.inode);

              ret = add_mark_on_inode(g_watch.inode,
                                      g_watch.mask,
                                      &g_watch.mark);
              if (ret)
                  goto err_inode;

              return 0;

          err_inode:
              iput(g_watch.inode);
              g_watch.inode = NULL;
          err_path:
              path_put(&g_watch.kpath);
              memset(&g_watch.kpath, 0, sizeof(g_watch.kpath));
          err_group:
              fsnotify_put_group(g);
              g = NULL;
              return ret;
          }

          void __exit ksu_observer_exit(void)
          {
              if (!g)
                  return;

              if (g_watch.mark) {
                  fsnotify_destroy_mark(g_watch.mark, g);
                  fsnotify_put_mark(g_watch.mark);
                  g_watch.mark = NULL;
              }

              if (g_watch.inode) {
                  iput(g_watch.inode);
                  g_watch.inode = NULL;
              }

              if (g_watch.kpath.dentry) {
                  path_put(&g_watch.kpath);
                  memset(&g_watch.kpath, 0, sizeof(g_watch.kpath));
              }

              fsnotify_put_group(g);
              g = NULL;
          }
          ''').lstrip())
          PY

          grep -nE '^[[:space:]]*\.handle_event[[:space:]]*=' \
            KernelSU-Next/kernel/manager/pkg_observer.c
          grep -nE '^[[:space:]]*\.free_mark[[:space:]]*=' \
            KernelSU-Next/kernel/manager/pkg_observer.c

      - name: Backport KSUN seccomp cache syscall limits to Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/infra/seccomp_cache.c")
          s = p.read_text()

          needle = '#include <linux/seccomp.h>\n'
          compat = r'''#include <asm/unistd.h>

          /*
           * Samsung 4.19 predates SECCOMP_ARCH_*_NR.
           * arm64 already exposes the equivalent syscall counts.
           */
          #ifndef SECCOMP_ARCH_NATIVE_NR
          #define SECCOMP_ARCH_NATIVE_NR NR_syscalls
          #endif

          #if defined(CONFIG_COMPAT) && !defined(SECCOMP_ARCH_COMPAT)
          #define SECCOMP_ARCH_COMPAT
          #endif

          #if defined(SECCOMP_ARCH_COMPAT) && !defined(SECCOMP_ARCH_COMPAT_NR)
          #define SECCOMP_ARCH_COMPAT_NR __NR_compat_syscalls
          #endif
          '''

          if needle not in s:
              raise SystemExit("linux/seccomp.h include not found")

          if "#define SECCOMP_ARCH_NATIVE_NR NR_syscalls" not in s:
              s = s.replace(needle, needle + compat, 1)

          p.write_text(s)
          PY

          echo "=== Patched seccomp_cache.c ==="
          sed -n '1,100p' KernelSU-Next/kernel/infra/seccomp_cache.c

          grep -q '#define SECCOMP_ARCH_NATIVE_NR NR_syscalls' \
            KernelSU-Next/kernel/infra/seccomp_cache.c

      - name: Verify existing strncpy_from_user_nofault backport
        run: |
          set -euxo pipefail

          # This Samsung 4.19 tree already carries the compatibility helper
          # in include/linux/pgtable.h. Do not redefine it in KSUN sucompat.c.
          grep -n "ksu_strncpy_from_user_nofault" include/linux/pgtable.h
          grep -n "strncpy_from_user_nofault" KernelSU-Next/kernel/feature/sucompat.c

      - name: Backport KSUN mount namespace code to Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/infra/su_mount_ns.c")
          s = p.read_text()

          old_include = '#include <uapi/linux/mount.h>\n'
          new_include = (
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 2, 0)\n'
              '#include <uapi/linux/mount.h>\n'
              '#endif\n'
          )

          if old_include in s and '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 2, 0)\n#include <uapi/linux/mount.h>' not in s:
              s = s.replace(old_include, new_include, 1)

          old_extern = (
              'extern int path_mount(const char *dev_name, struct path *path,\n'
              '                      const char *type_page, unsigned long flags,\n'
              '                      void *data_page);\n'
          )
          new_extern = (
              '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 2, 0)\n'
              'extern int path_mount(const char *dev_name, struct path *path,\n'
              '                      const char *type_page, unsigned long flags,\n'
              '                      void *data_page);\n'
              '#endif\n'
          )

          if old_extern in s and '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 2, 0)\nextern int path_mount' not in s:
              s = s.replace(old_extern, new_extern, 1)

          fn_start = s.find("static void ksu_mnt_ns_individual(void)\n{")
          if fn_start == -1:
              raise SystemExit("ksu_mnt_ns_individual() not found")

          fn_end_marker = "\n}\n\nvoid setup_mount_ns"
          fn_end = s.find(fn_end_marker, fn_start)
          if fn_end == -1:
              raise SystemExit("end of ksu_mnt_ns_individual() not found")

          old_fn = s[fn_start:fn_end + 2]

          if "Samsung 4.19: individual mount namespace mode is unavailable" not in old_fn:
              prefix = "static void ksu_mnt_ns_individual(void)\n{"
              body = old_fn[len(prefix):-2]
              new_fn = (
                  "static void ksu_mnt_ns_individual(void)\n"
                  "{\n"
                  "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 2, 0)\n"
                  "    /*\n"
                  "     * Samsung 4.19 does not provide the path_mount() VFS API used by\n"
                  "     * modern KSUN. Keep inherited/global namespace support working\n"
                  "     * and gracefully skip individual namespace mode on this kernel.\n"
                  "     */\n"
                  "    pr_warn(\"Samsung 4.19: individual mount namespace mode is unavailable\\n\");\n"
                  "    return;\n"
                  "#else"
                  + body +
                  "\n#endif\n"
                  "}"
              )
              s = s[:fn_start] + new_fn + s[fn_end + 2:]

          p.write_text(s)
          PY

          echo "=== Patched su_mount_ns.c ==="
          sed -n '1,220p' KernelSU-Next/kernel/infra/su_mount_ns.c

          grep -q 'Samsung 4.19: individual mount namespace mode is unavailable' \
            KernelSU-Next/kernel/infra/su_mount_ns.c

      - name: Backport KSUN allowlist helpers to Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/policy/allowlist.c")
          s = p.read_text()

          # put_task_struct() is declared in sched/task.h on Linux 4.19.
          if "#include <linux/sched/task.h>" not in s:
              marker = "#include <linux/task_work.h>\n"
              if marker not in s:
                  raise SystemExit("task_work.h include not found")
              s = s.replace(
                  marker,
                  marker + "#include <linux/sched/task.h>\n#include <linux/string.h>\n",
                  1,
              )

          # Linux 4.19 task_work_add() takes a bool notify argument.
          # true is the old-kernel equivalent needed for this persistent
          # allowlist task-work callback.
          old = "task_work_add(tsk, cb, TWA_RESUME)"
          if old in s:
              s = s.replace(old, "task_work_add(tsk, cb, true)", 1)

          # strscpy_pad() is newer than this Samsung 4.19 tree.
          # Preserve its zero-padding behavior using memset + strscpy(),
          # both available in Linux 4.19.
          old = "strscpy_pad(domain, KSU_DEFAULT_SELINUX_DOMAIN, domain_len);"
          new = (
              "memset(domain, 0, domain_len);\n"
              "                strscpy(domain, KSU_DEFAULT_SELINUX_DOMAIN, domain_len);"
          )
          if old in s:
              s = s.replace(old, new, 1)

          # The fallthrough macro is unavailable in this old tree/compiler
          # combination. The recognized comment keeps the intended switch
          # fall-through without relying on the newer macro.
          if "        fallthrough;\n" in s:
              s = s.replace(
                  "        fallthrough;\n",
                  "        /* fall through */\n",
                  1,
              )

          # Fail loudly if any known incompatible construct remains.
          leftovers = [
              "TWA_RESUME",
              "strscpy_pad(domain, KSU_DEFAULT_SELINUX_DOMAIN, domain_len)",
              "        fallthrough;",
          ]
          bad = [x for x in leftovers if x in s]
          if bad:
              raise SystemExit(f"allowlist compatibility patch incomplete: {bad}")

          p.write_text(s)
          PY

          echo "=== Patched allowlist.c compatibility area ==="
          sed -n '1,35p' KernelSU-Next/kernel/policy/allowlist.c
          sed -n '460,520p' KernelSU-Next/kernel/policy/allowlist.c

          grep -q '#include <linux/sched/task.h>' KernelSU-Next/kernel/policy/allowlist.c
          grep -q 'task_work_add(tsk, cb, true)' KernelSU-Next/kernel/policy/allowlist.c
          grep -q 'strscpy(domain, KSU_DEFAULT_SELINUX_DOMAIN, domain_len)' KernelSU-Next/kernel/policy/allowlist.c

      - name: Backport KSUN app profile seccomp handling to Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/policy/app_profile.c")
          s = p.read_text()

          # Linux 4.19 struct seccomp only contains mode + filter.
          # KSUN v3.3.0 also clears the newer filter_count field, which does
          # not exist on this Samsung tree. Keep the assignment for newer
          # kernels only.
          old = "    atomic_set(&current->seccomp.filter_count, 0);\n"
          new = (
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n"
              "    atomic_set(&current->seccomp.filter_count, 0);\n"
              "#endif\n"
          )

          if old in s and "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n    atomic_set(&current->seccomp.filter_count, 0);" not in s:
              s = s.replace(old, new, 1)

          if "atomic_set(&current->seccomp.filter_count, 0);" not in s:
              raise SystemExit("filter_count statement not found after patch")

          p.write_text(s)
          PY

          echo "=== Patched app_profile.c seccomp area ==="
          sed -n '68,105p' KernelSU-Next/kernel/policy/app_profile.c

          grep -q '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)' \
            KernelSU-Next/kernel/policy/app_profile.c

      - name: Backport KSUN ksud nofault uaccess helpers to Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/runtime/ksud_integration.c")
          s = p.read_text()

          # Samsung 4.19 does not expose the newer *_user_nofault helpers
          # used by KSUN v3.3.0. This code executes in normal process
          # context while inspecting/updating the current task's userspace,
          # so use the corresponding 4.19 uaccess helpers.
          replacements = {
              "strncpy_from_user_nofault(buf, p, buf_len)":
                  "strncpy_from_user(buf, p, buf_len)",
              "copy_from_user_nofault(&size, st_size_ptr, sizeof(long))":
                  "copy_from_user(&size, st_size_ptr, sizeof(long))",
              "copy_to_user_nofault(st_size_ptr, &new_size, sizeof(long))":
                  "copy_to_user(st_size_ptr, &new_size, sizeof(long))",
          }

          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed += 1

          if changed != 3:
              missing = [old for old in replacements if old in s]
              # If an expression was already patched, don't fail just for that.
              remaining_nofault = [
                  "strncpy_from_user_nofault(",
                  "copy_from_user_nofault(",
                  "copy_to_user_nofault(",
              ]
              leftovers = [x for x in remaining_nofault if x in s]
              if leftovers:
                  raise SystemExit(
                      f"ksud uaccess patch incomplete; remaining helpers: {leftovers}"
                  )

          p.write_text(s)
          PY

          echo "=== Patched ksud_integration.c uaccess calls ==="
          grep -nE 'strncpy_from_user\(|copy_(from|to)_user\('             KernelSU-Next/kernel/runtime/ksud_integration.c | head -30

          if grep -qE 'strncpy_from_user_nofault|copy_from_user_nofault|copy_to_user_nofault'             KernelSU-Next/kernel/runtime/ksud_integration.c; then
            echo "ERROR: unsupported nofault helper remains"
            exit 1
          fi

      - name: Backport KSUN SELinux core to Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          KVER_GUARD = "KERNEL_VERSION(5, 10, 0)"

          # ------------------------------------------------------------
          # 1) selinux.c: selinux_cred() does not exist on old SELinux.
          #    Linux 4.19 stores task_security_struct directly in
          #    cred->security.
          # ------------------------------------------------------------
          p = Path("KernelSU-Next/kernel/selinux/selinux.c")
          s = p.read_text()

          compat = '''
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
          static inline struct task_security_struct *ksu_selinux_cred_compat(const struct cred *cred)
          {
              return (struct task_security_struct *)cred->security;
          }
          #define selinux_cred(cred) ksu_selinux_cred_compat(cred)
          #endif

          '''
          marker = '#include "ksu.h"\n'
          if "ksu_selinux_cred_compat" not in s:
              if marker not in s:
                  raise SystemExit("selinux.c include anchor not found")
              s = s.replace(marker, marker + compat, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # 2) sepolicy.h: kernels before the policy-pointer SELinux
          #    conversion do not define struct selinux_policy. Provide
          #    the layout KSUN needs for a detached backup policy.
          # ------------------------------------------------------------
          p = Path("KernelSU-Next/kernel/selinux/sepolicy.h")
          s = p.read_text()

          if '#include <linux/version.h>' not in s:
              s = s.replace('#include <linux/types.h>\n',
                            '#include <linux/types.h>\n#include <linux/version.h>\n', 1)

          if '#include "ss/services.h"' not in s:
              s = s.replace('#include "ss/policydb.h"\n',
                            '#include "ss/policydb.h"\n#include "ss/services.h"\n', 1)

          compat_struct = '''
          /*
           * Linux 4.19 keeps the active policy inside struct selinux_ss
           * rather than behind selinux_state.policy.  KSUN v3.3.0 uses
           * struct selinux_policy for its detached backup used by
           * SELinux Hide, so provide the equivalent container here.
           */
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
          struct selinux_policy {
              struct sidtab *sidtab;
              struct policydb policydb;
              struct selinux_map map;
              u32 latest_granting;
          };
          #endif

          '''
          anchor2 = '#include "ss/services.h"\n'
          if "Linux 4.19 keeps the active policy" not in s:
              s = s.replace(anchor2, anchor2 + compat_struct, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # 3) sepolicy.c: newer Android policydb compatibility flags are
          #    not fields of the old 4.19 policydb. They are not needed
          #    for the detached 4.19 backup.
          # ------------------------------------------------------------
          p = Path("KernelSU-Next/kernel/selinux/sepolicy.c")
          s = p.read_text()

          old_cfg = '''        if (old_pol->policydb.android_netlink_route) {
              pr_info("adding POLICYDB_CONFIG_ANDROID_NETLINK_ROUTE\\n");
              *config_ptr |= POLICYDB_CONFIG_ANDROID_NETLINK_ROUTE;
          }
          if (old_pol->policydb.android_netlink_getneigh) {
              pr_info("adding POLICYDB_CONFIG_ANDROID_NETLINK_GETNEIGH\\n");
              *config_ptr |= POLICYDB_CONFIG_ANDROID_NETLINK_GETNEIGH;
          }
          '''
          if old_cfg in s and "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n        if (old_pol->policydb.android_netlink_route)" not in s:
              new_cfg = '''#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
          ''' + old_cfg + '''#endif
          '''
              s = s.replace(old_cfg, new_cfg, 1)
          p.write_text(s)

          # ------------------------------------------------------------
          # 4) rules.c:
          #    5.10+ -> keep KSUN v3.3.0's copy/swap policy mechanism.
          #    4.19  -> back up the old selinux_ss policy, then modify the
          #             live policydb directly (the method used by older
          #             KernelSU on these kernels).
          # ------------------------------------------------------------
          p = Path("KernelSU-Next/kernel/selinux/rules.c")
          s = p.read_text()

          if "ksu_rules_419" not in s:
              fn_start = s.find("void apply_kernelsu_rules()\n{")
              if fn_start < 0:
                  raise SystemExit("apply_kernelsu_rules() not found")

              fn_end_marker = "\n}\n\n#define KSU_SEPOLICY_MAX_BATCH_SIZE"
              fn_end = s.find(fn_end_marker, fn_start)
              if fn_end < 0:
                  raise SystemExit("end of apply_kernelsu_rules() not found")

              original_fn = s[fn_start:fn_end + 2]

              rule_start = original_fn.find("    db = &pol->policydb;\n")
              rule_end = original_fn.find("    rcu_assign_pointer(selinux_state.policy, pol);")
              if rule_start < 0 or rule_end < 0:
                  raise SystemExit("could not isolate KSUN rule block")

              rule_block = original_fn[
                  rule_start + len("    db = &pol->policydb;\n"):rule_end
              ]

              old_fn = '''#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
          static DEFINE_MUTEX(ksu_rules_419);

          void apply_kernelsu_rules()
          {
              struct selinux_ss *ss;
              struct selinux_policy old_wrap;
              struct policydb *db;

              if (!getenforce()) {
                  pr_info("SELinux permissive or disabled, apply rules!\\n");
              }

              mutex_lock(&ksu_rules_419);

              ss = rcu_dereference(selinux_state.ss);
              if (!ss) {
                  pr_err("SELinux 4.19 state has no security server\\n");
                  goto out_unlock_419;
              }

              /*
               * Serialize the pristine policy into a detached
               * struct selinux_policy before KSUN changes the live db.
               * SELinux Hide uses this pristine copy for app-visible
               * context/access queries.
               */
              memset(&old_wrap, 0, sizeof(old_wrap));
              old_wrap.sidtab = &ss->sidtab;
              old_wrap.policydb = ss->policydb;
              old_wrap.map = ss->map;
              old_wrap.latest_granting = ss->latest_granting;

              backup_sepolicy = ksu_dup_sepolicy(&old_wrap);
              if (IS_ERR(backup_sepolicy)) {
                  pr_err("failed to create 4.19 backup sepolicy: %ld\\n",
                         PTR_ERR(backup_sepolicy));
                  backup_sepolicy = NULL;
              } else {
                  backup_sepolicy->sidtab =
                      kzalloc(sizeof(*backup_sepolicy->sidtab), GFP_KERNEL);
                  if (!backup_sepolicy->sidtab) {
                      pr_err("failed to alloc 4.19 backup sidtab\\n");
                      ksu_destroy_sepolicy(backup_sepolicy);
                      backup_sepolicy = NULL;
                  } else {
                      int ret = policydb_load_isids(&backup_sepolicy->policydb,
                                                   backup_sepolicy->sidtab);
                      if (ret) {
                          pr_err("failed to load 4.19 backup isids: %d\\n", ret);
                          kfree(backup_sepolicy->sidtab);
                          backup_sepolicy->sidtab = NULL;
                          ksu_destroy_sepolicy(backup_sepolicy);
                          backup_sepolicy = NULL;
                      } else {
                          pr_info("4.19 backup sepolicy ready\\n");
                      }
                  }
              }

              db = &ss->policydb;
          ''' + rule_block + '''
              reset_avc_cache();

          out_unlock_419:
              mutex_unlock(&ksu_rules_419);
          }
          #else
          ''' + original_fn + '''
          #endif'''

              s = s[:fn_start] + old_fn + s[fn_end + 2:]

          p.write_text(s)

          # ------------------------------------------------------------
          # 5) selinux_hide.c:
          #    Old selinux_state has ->ss instead of ->policy, and the
          #    status page/lock live inside selinux_ss.
          # ------------------------------------------------------------
          p = Path("KernelSU-Next/kernel/feature/selinux_hide.c")
          s = p.read_text()

          status_compat = '''
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
          #define KSU_SELINUX_STATUS_LOCK (selinux_state.ss->status_lock)
          #define KSU_SELINUX_STATUS_PAGE (selinux_state.ss->status_page)
          static struct selinux_ss ksu_fake_ss_419;
          #else
          #define KSU_SELINUX_STATUS_LOCK (selinux_state.status_lock)
          #define KSU_SELINUX_STATUS_PAGE (selinux_state.status_page)
          #endif

          '''
          hide_anchor = "static DEFINE_MUTEX(selinux_hide_mutex);\n"
          if "KSU_SELINUX_STATUS_LOCK" not in s:
              if hide_anchor not in s:
                  raise SystemExit("selinux_hide.c anchor not found")
              s = s.replace(hide_anchor, status_compat + hide_anchor, 1)

          # Use the version-neutral status aliases everywhere.
          s = s.replace("selinux_state.status_lock", "KSU_SELINUX_STATUS_LOCK")
          s = s.replace("selinux_state.status_page", "KSU_SELINUX_STATUS_PAGE")

          old_fake = '''#else
              fake_state.initialized = true;
              fake_state.policy = backup_sepolicy;
          #endif'''
          if old_fake in s:
              new_fake = '''#else
              fake_state.initialized = true;
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
              /*
               * Recreate the old selinux_ss view around the pristine
               * backup.  The 4.19 security_* helpers dereference
               * state->ss, not state->policy.
               */
              memset(&ksu_fake_ss_419, 0, sizeof(ksu_fake_ss_419));
              ksu_fake_ss_419.sidtab = *backup_sepolicy->sidtab;
              ksu_fake_ss_419.policydb = backup_sepolicy->policydb;
              ksu_fake_ss_419.map = backup_sepolicy->map;
              ksu_fake_ss_419.latest_granting = backup_sepolicy->latest_granting;
              rwlock_init(&ksu_fake_ss_419.policy_rwlock);
              mutex_init(&ksu_fake_ss_419.status_lock);
              fake_state.ss = &ksu_fake_ss_419;
          #else
              fake_state.policy = backup_sepolicy;
          #endif
          #endif'''
              s = s.replace(old_fake, new_fake, 1)

          if "fake_state.policy = backup_sepolicy;" in s and \
             "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)" not in s:
              raise SystemExit("SELinux Hide fake_state compatibility patch failed")

          p.write_text(s)

          # ------------------------------------------------------------
          # Verification
          # ------------------------------------------------------------
          grep_targets = {
              "KernelSU-Next/kernel/selinux/selinux.c":
                  "ksu_selinux_cred_compat",
              "KernelSU-Next/kernel/selinux/sepolicy.h":
                  "Linux 4.19 keeps the active policy",
              "KernelSU-Next/kernel/selinux/rules.c":
                  "ksu_rules_419",
              "KernelSU-Next/kernel/feature/selinux_hide.c":
                  "ksu_fake_ss_419",
          }

          for name, needle in grep_targets.items():
              data = Path(name).read_text()
              if needle not in data:
                  raise SystemExit(f"verification failed: {needle} missing from {name}")

          print("Samsung 4.19 SELinux compatibility cluster patched successfully")
          PY

          echo "=== SELinux 4.19 compatibility verification ==="
          grep -n 'ksu_selinux_cred_compat' KernelSU-Next/kernel/selinux/selinux.c
          grep -n 'ksu_rules_419' KernelSU-Next/kernel/selinux/rules.c
          grep -n 'ksu_fake_ss_419' KernelSU-Next/kernel/feature/selinux_hide.c
          grep -n 'KSU_SELINUX_STATUS_' KernelSU-Next/kernel/feature/selinux_hide.c | head -20

      - name: Configure M127F kernel
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchain/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            exynos850-m12nsxx_defconfig

          echo "=== KernelSU ==="
          grep -iE 'KSU|KERNELSU' .config || true
          echo "=== SELinux ==="
          grep -i 'CONFIG_SECURITY_SELINUX' .config || true
          echo "=== SUSFS ==="
          grep -i 'SUSFS' .config || true
          echo "=== KPROBES ==="
          grep -i 'KPROBE' .config || true

      - name: Build M127F kernel
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchain/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Verify kernel and KSUN output
        run: |
          set -euxo pipefail
          test -s arch/arm64/boot/Image
          test -d drivers/kernelsu
          test -n "$(find drivers/kernelsu -type f -name '*.o' -print -quit)"
          ls -lh arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image

          SELINUX_HIDE_OBJECT="$(
            find drivers/kernelsu -type f -name 'selinux_hide.o' -print -quit
          )"
          test -n "$SELINUX_HIDE_OBJECT"
          echo "SELinux Hide: $SELINUX_HIDE_OBJECT"

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail
          test -d anykernel
          test -f anykernel/anykernel.sh
          rm -rf output
          mkdir -p output
          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image
          test -s output/Image
          test -f output/anykernel.sh

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail
          ZIP_NAME="M127F-KSUN-v3.3.0-SELinuxHide.zip"
          rm -f "$ZIP_NAME"
          cd output
          zip -r9 "../$ZIP_NAME" .
          cd ..
          test -s "$ZIP_NAME"
          ls -lh "$ZIP_NAME"
          sha256sum "$ZIP_NAME"
          unzip -l "$ZIP_NAME"

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-SELinuxHide
          path: M127F-KSUN-v3.3.0-SELinuxHide.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config
          if-no-files-found: error
