name: Build M127F - KSUN v3.3.0

on:
  push:
    branches:
      - ksun-3.3.0-susfs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      PLATFORM_VERSION: "13"
      ANDROID_MAJOR_VERSION: t
      DEFCONFIG: exynos850-m12nsxx_defconfig
      KSUN_SHA: 3b18216f71df189ab3d1b1ce0bdb21be1268e771

    steps:
      - name: Free runner disk space
        run: |
          set -euxo pipefail

          echo "=== Disk before cleanup ==="
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          sudo apt-get clean || true

          echo
          echo "=== Disk after cleanup ==="
          df -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ksun-3.3.0-susfs
          fetch-depth: 0
          submodules: recursive

      - name: Show repository state
        run: |
          set -euxo pipefail

          echo "=== Branch ==="
          git branch --show-current

          echo
          echo "=== Kernel commit ==="
          git log -1 --oneline

          echo
          echo "=== Recent kernel commits ==="
          git log -8 --oneline

          echo
          echo "=== Submodules ==="
          git submodule status

          echo
          echo "=== KernelSU-Next ==="

          ACTUAL_KSUN_SHA="$(git -C KernelSU-Next rev-parse HEAD)"
          ACTUAL_KSUN_TAG="$(
            git -C KernelSU-Next describe \
              --tags \
              --exact-match
          )"

          echo "Expected SHA: $KSUN_SHA"
          echo "Actual SHA:   $ACTUAL_KSUN_SHA"
          echo "Tag:          $ACTUAL_KSUN_TAG"

          test "$ACTUAL_KSUN_SHA" = "$KSUN_SHA"
          test "$ACTUAL_KSUN_TAG" = "v3.3.0"

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          sudo apt-get clean

          echo
          df -h

      - name: Download Android Clang r383902
        run: |
          set -euxo pipefail

          rm -rf "$HOME/toolchain"
          mkdir -p "$HOME/toolchain"

          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" \
            -o /tmp/clang-r383902.tar.gz

          tar -xf /tmp/clang-r383902.tar.gz \
            -C "$HOME/toolchain"

          rm -f /tmp/clang-r383902.tar.gz

          echo "=== Clang ==="
          "$HOME/toolchain/bin/clang" --version

          echo
          echo "=== GNU LD ==="
          aarch64-linux-gnu-ld --version | head

          echo
          echo "=== GNU AS ==="
          aarch64-linux-gnu-as --version | head

          echo
          echo "=== Disk ==="
          df -h

      - name: Verify Samsung 4.19 compatibility layer
        run: |
          set -euxo pipefail

          echo "=== pgtable compatibility wrapper ==="

          test -f include/linux/pgtable.h

          cat include/linux/pgtable.h

          echo
          echo "=== Samsung mm.h page-table support ==="

          grep -n \
            '#include <asm/pgtable.h>' \
            include/linux/mm.h

          grep -n \
            'untagged_addr' \
            include/linux/mm.h

          echo
          echo "=== KSUN consumer ==="

          grep -n \
            'linux/pgtable.h' \
            KernelSU-Next/kernel/feature/sucompat.c

      - name: Verify KSUN source integration
        run: |
          set -euxo pipefail

          echo "=== drivers/kernelsu ==="

          test -L drivers/kernelsu

          ls -ld drivers/kernelsu
          readlink drivers/kernelsu

          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/Kconfig

          echo
          echo "=== Build-system wiring ==="

          grep -n -F \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -n -F \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          echo
          echo "=== Native SELinux Hide source ==="

          test -f \
            KernelSU-Next/kernel/feature/selinux_hide.c

          test -f \
            KernelSU-Next/kernel/feature/selinux_hide.h

          grep -n \
            'feature/selinux_hide.o' \
            KernelSU-Next/kernel/Kbuild

          echo
          echo "Native SELinux Hide source is still present."

      - name: Configure M127F kernel
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make \
            ARCH="$ARCH" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG" \
            2>&1 | tee configure.log

          echo
          echo "=== Generated KernelSU configuration ==="

          grep -E \
            'CONFIG_(KSU|KPROBES|KRETPROBES|EXT4_FS|HAVE_SYSCALL_TRACEPOINTS)' \
            .config \
            || true

          echo
          echo "=== Generated SELinux configuration ==="

          grep \
            'CONFIG_SECURITY_SELINUX' \
            .config \
            || true

      - name: Validate generated configuration
        run: |
          set -euxo pipefail

          grep '^CONFIG_KSU=y$' .config
          grep '^CONFIG_KPROBES=y$' .config
          grep '^CONFIG_KRETPROBES=y$' .config
          grep '^CONFIG_EXT4_FS=y$' .config
          grep '^CONFIG_HAVE_SYSCALL_TRACEPOINTS=y$' .config
          grep '^CONFIG_SECURITY_SELINUX=y$' .config

          echo
          echo "=== Effective configuration accepted ==="

      - name: Verify compiler target
        run: |
          set -euxo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          which clang
          clang --version

          echo | clang \
            --target=aarch64-linux-gnu \
            -dM \
            -E \
            - \
            | grep -E \
              '__aarch64__|__AARCH64'

      - name: Build M127F kernel
        id: kernel_build
        shell: bash
        run: |
          set -uo pipefail

          export PATH="$HOME/toolchain/bin:$PATH"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "=== Disk immediately before build ==="
          df -h

          echo
          echo "=== Starting M127F build ==="

          set +e

          make \
            ARCH="$ARCH" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            2>&1 | tee build.log

          BUILD_RC=${PIPESTATUS[0]}

          set -e

          echo
          echo "=== BUILD_RC ==="
          echo "$BUILD_RC"

          echo "build_rc=$BUILD_RC" >> "$GITHUB_OUTPUT"

          echo
          echo "=== FIRST REAL COMPILER ERRORS ==="

          grep -n -m 100 -E \
            'fatal error:|error:|undefined reference|No rule to make target' \
            build.log \
            || true

          echo
          echo "=== KSUN BUILD PROGRESS ==="

          grep -n -E \
            'drivers/kernelsu|KernelSU-Next|selinux_hide' \
            build.log \
            | tail -n 300 \
            || true

          echo
          echo "=== LAST 300 BUILD LINES ==="

          tail -n 300 build.log

          echo
          echo "=== Disk after build ==="
          df -h

          exit "$BUILD_RC"

      - name: Inspect KSUN objects
        if: always()
        run: |
          set +e

          echo "=== Compiled KSUN objects ==="

          find KernelSU-Next/kernel \
            -type f \
            -name '*.o' \
            -print \
            2>/dev/null \
            | sort \
            | head -n 500

          echo
          echo "=== Native SELinux Hide object ==="

          find KernelSU-Next/kernel \
            -type f \
            -name 'selinux_hide.o' \
            -print \
            2>/dev/null

          echo
          echo "=== Failed KSUN source/object vicinity ==="

          find KernelSU-Next/kernel/feature \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.c' \
              -o -name '*.o' \
            \) \
            -print \
            2>/dev/null \
            | sort

      - name: Verify native SELinux Hide compiled
        if: steps.kernel_build.outputs.build_rc == '0'
        run: |
          set -euxo pipefail

          SELINUX_HIDE_OBJECT="$(
            find KernelSU-Next/kernel \
              -type f \
              -name 'selinux_hide.o' \
              -print -quit
          )"

          if [ -z "$SELINUX_HIDE_OBJECT" ]; then
            echo "ERROR: selinux_hide.o was not built"
            exit 1
          fi

          echo "=== Native SELinux Hide compiled ==="
          echo "$SELINUX_HIDE_OBJECT"

          ls -lh "$SELINUX_HIDE_OBJECT"

      - name: Verify final kernel Image
        if: steps.kernel_build.outputs.build_rc == '0'
        run: |
          set -euxo pipefail

          test -f arch/arm64/boot/Image

          echo "=== Kernel Image ==="
          ls -lh arch/arm64/boot/Image

      - name: Generate small diagnostic files
        if: always()
        run: |
          set +e

          mkdir -p diagnostics

          {
            echo "=== Kernel commits ==="
            git log -8 --oneline

            echo
            echo "=== Submodules ==="
            git submodule status

            echo
            echo "=== KernelSU SHA ==="
            git -C KernelSU-Next rev-parse HEAD

            echo
            echo "=== KernelSU tag ==="
            git -C KernelSU-Next describe \
              --tags \
              --exact-match

            echo
            echo "=== KSU configuration ==="

            grep -E \
              'CONFIG_(KSU|KPROBES|KRETPROBES|EXT4_FS|HAVE_SYSCALL_TRACEPOINTS)' \
              .config \
              || true

            echo
            echo "=== SELinux configuration ==="

            grep \
              'CONFIG_SECURITY_SELINUX' \
              .config \
              || true

            echo
            echo "=== SELinux Hide Kbuild ==="

            grep -n \
              'feature/selinux_hide.o' \
              KernelSU-Next/kernel/Kbuild \
              || true

            echo
            echo "=== SELinux Hide object ==="

            find KernelSU-Next/kernel \
              -type f \
              -name 'selinux_hide.o' \
              -print \
              2>/dev/null

            echo
            echo "=== First compiler errors ==="

            grep -n -m 150 -E \
              'fatal error:|error:|undefined reference|No rule to make target' \
              build.log \
              2>/dev/null \
              || true

            echo
            echo "=== Disk ==="
            df -h

          } > diagnostics/ksun-state.txt

          du -sh diagnostics || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Build-Diagnostics
          path: |
            diagnostics/ksun-state.txt
            configure.log
            build.log
            .config
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Upload kernel Image
        if: steps.kernel_build.outputs.build_rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0
