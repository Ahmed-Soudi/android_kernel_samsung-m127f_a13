      - name: Allow K02 and observe K03 event only on Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("KernelSU-Next/kernel/supercall/supercall.c")
          s = p.read_text()

          pattern = re.compile(
              r'static\s+long\s+anon_ksu_ioctl\s*\(\s*struct\s+file\s*\*\s*filp\s*,\s*'
              r'unsigned\s+int\s+cmd\s*,\s*unsigned\s+long\s+arg\s*\)\s*\{\s*'
              r'return\s+ksu_supercall_handle_ioctl\s*\(\s*cmd\s*,\s*'
              r'\(void\s+__user\s*\*\)\s*arg\s*\)\s*;\s*\}',
              re.S
          )

          replacement = """static long anon_ksu_ioctl(struct file *filp, unsigned int cmd,
                                   unsigned long arg)
          {
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)
              long ret;

              /*
               * Samsung 4.19 diagnostic:
               * - K02 GET_INFO executes normally.
               * - K03 REPORT_EVENT executes normally for all event IDs.
               * - AVC spoof late init remains enabled, but its
               *   slow_avc_audit kprobe is suppressed separately.
               * - Block every ioctl after K03.
               */
              if (cmd == 0x40004b0fU) {
                  struct ksu_get_wrapper_fd_cmd k15 = { 0 };

                  pr_warn("Samsung 4.19 diagnostic: K15 GET_WRAPPER_FD entered arg=0x%lx\\n",
                          arg);
                  if (copy_from_user(&k15, (void __user *)arg, sizeof(k15))) {
                      pr_err("Samsung 4.19 diagnostic: K15 copy_from_user failed\\n");
                      return -EFAULT;
                  }

                  pr_warn("Samsung 4.19 diagnostic: K15 request fd=%u flags=0x%x\\n",
                          k15.fd, k15.flags);
                  ret = ksu_supercall_handle_ioctl(cmd, (void __user *)arg);
                  pr_warn("Samsung 4.19 diagnostic: K15 GET_WRAPPER_FD returned %ld\\n",
                          ret);
                  return ret;
              }

              if (cmd == 0x80104b02U || cmd == 0x80004b02U ||
                  cmd == 0x40004b03U || cmd == 0x80004b63U ||
                  cmd == 0x80004b05U || cmd == 0xc0004b0dU ||
                  cmd == 0xc0044b06U || cmd == 0x80004b62U ||
                  cmd == 0xc0004b0bU || cmd == 0x40004b0cU ||
                  cmd == 0x40004b0eU) {
                  pr_warn("Samsung 4.19 diagnostic: allowing through GET_WRAPPER_FD K15 ioctl cmd=0x%x\\n",
                          cmd);
                  ret = ksu_supercall_handle_ioctl(cmd, (void __user *)arg);
                  pr_warn("Samsung 4.19 diagnostic: allowed ioctl cmd=0x%x returned %ld\\n",
                          cmd, ret);
                  return ret;
              }

              pr_warn("Samsung 4.19 diagnostic: blocked post-GET_WRAPPER_FD-K15 ioctl cmd=0x%x\\n", cmd);
              return -ENOTTY;
          #else
              return ksu_supercall_handle_ioctl(cmd, (void __user *)arg);
          #endif
          }"""

          ns, n = pattern.subn(lambda _m: replacement, s, count=1)
          if n != 1:
              raise SystemExit("anon_ksu_ioctl anchor not found or changed")

          p.write_text(ns)
          PY

          echo "=== Samsung 4.19 TRIAL-13B GET_WRAPPER_FD K15 observer diagnostic ==="
          grep -n -A30 -B2 'static long anon_ksu_ioctl' \
            KernelSU-Next/kernel/supercall/supercall.c

          grep -q 'allowing through GET_WRAPPER_FD K15 ioctl cmd=' KernelSU-Next/kernel/supercall/supercall.c
          grep -q 'cmd == 0x40004b03U' KernelSU-Next/kernel/supercall/supercall.c
          grep -q 'blocked post-GET_WRAPPER_FD-K15 ioctl cmd=' KernelSU-Next/kernel/supercall/supercall.c

          python3 - <<'PY'
          from pathlib import Path
          s = Path("KernelSU-Next/kernel/supercall/supercall.c").read_text()
          start = s.find("static long anon_ksu_ioctl")
          end = s.find("static const struct file_operations anon_ksu_fops", start)
          if start < 0 or end < 0:
              raise SystemExit("cannot isolate anon_ksu_ioctl")
          body = s[start:end]
          if "cmd == 0x40004b03U" not in body:
              raise SystemExit("K03 allow path missing")
          if "cmd == 0x80004b63U" not in body:
              raise SystemExit("GET_VERSION_TAG allow path missing")
          if "cmd == 0x80004b05U" not in body:
              raise SystemExit("CHECK_SAFEMODE allow path missing")
          if "cmd == 0xc0004b0dU" not in body:
              raise SystemExit("GET_FEATURE K13 allow path missing")
          if "cmd == 0xc0044b06U" not in body:
              raise SystemExit("NEW_GET_ALLOW_LIST K06 allow path missing")
          if "cmd == 0x80004b62U" not in body:
              raise SystemExit("GET_HOOK_MODE K98 allow path missing")
          if "cmd == 0xc0004b0bU" not in body:
              raise SystemExit("GET_APP_PROFILE K11 allow path missing")
          if "cmd == 0x40004b0cU" not in body:
              raise SystemExit("SET_APP_PROFILE K12 allow path missing")
          if "cmd == 0x40004b0eU" not in body:
              raise SystemExit("SET_FEATURE K14 allow path missing")
          if "cmd == 0x40004b0fU" not in body:
              raise SystemExit("GET_WRAPPER_FD K15 allow path missing")
          if "K15 GET_WRAPPER_FD entered" not in body:
              raise SystemExit("K15 observer entry log missing")
          if "K15 request fd=%u flags=0x%x" not in body:
              raise SystemExit("K15 payload observer log missing")
          if "K15 GET_WRAPPER_FD returned %ld" not in body:
              raise SystemExit("K15 return observer log missing")
          if "ksu_supercall_handle_ioctl(cmd, (void __user *)arg)" not in body:
              raise SystemExit("real K02/K03 dispatcher path missing")
          if "struct ksu_report_event_cmd evt;" in body or "handler suppressed" in body:
              raise SystemExit("stale K03 observer/suppression logic still present")
          print("Verified: previous safe ioctls + K15 observer enabled; later ioctls blocked")
          PY


