          static DEFINE_MUTEX(ksu_rules_419);
          
          void apply_kernelsu_rules()
          {
              struct selinux_ss *ss;
              struct selinux_policy old_wrap;
              struct policydb *db;
          
              if (!getenforce()) {
                  pr_info("SELinux permissive or disabled, apply rules!\\n");
              }
          
              mutex_lock(&ksu_rules_419);
          
              ss = rcu_dereference(selinux_state.ss);
              if (!ss) {
                  pr_err("SELinux 4.19 state has no security server\\n");
                  goto out_unlock_419;
              }
          
