          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/feature/selinux_hide.c")
          s = p.read_text()

          marker = "static void initialize_fake_status()\n{"
          if marker not in s:
              raise SystemExit("Trial 17 v2: initialize_fake_status function marker not found")

          insert = 'static void initialize_fake_status()\n{\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\n    /*\n     * Linux 4.19 SELinux creates its status page lazily. The Samsung 4.19\n     * compatibility layer may expose the page through KSU_SELINUX_STATUS_PAGE,\n     * so do not anchor this patch to the exact field/mutex spelling produced\n     * by earlier compatibility steps.\n     *\n     * selinux_kernel_status_page() takes the SELinux status mutex internally,\n     * therefore call it before the existing lock in this function.\n     */\n    if (!KSU_SELINUX_STATUS_PAGE) {\n        struct page *real_status =\n            selinux_kernel_status_page(&selinux_state);\n        if (real_status)\n            pr_info("Samsung 4.19 Trial17: real SELinux status page initialized lazily\\n");\n        else\n            pr_warn("Samsung 4.19 Trial17: selinux_kernel_status_page returned NULL\\n");\n    }\n#endif\n'

          s = s.replace(marker, insert, 1)
          p.write_text(s)
          print("Trial 17 v2 lazy SELinux status-page patch applied")
          PY

          echo "=== Trial 17 v2 patch verification ==="
          python3 - <<'PY'
          from pathlib import Path

          s = Path("KernelSU-Next/kernel/feature/selinux_hide.c").read_text()
          required = [
              'static void initialize_fake_status()',
              'if (!KSU_SELINUX_STATUS_PAGE)',
              'selinux_kernel_status_page(&selinux_state)',
              'Samsung 4.19 Trial17: real SELinux status page initialized lazily',
              'Samsung 4.19 Trial17: selinux_kernel_status_page returned NULL',
              'initialize_fake_status initialized:',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f"Trial 17 v2 verification missing: {needle}")

          print("Trial 17 v2 verification passed")
          PY

      - name: Build M127F kernel
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchain/bin:$PATH"
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Verify kernel and KSUN output
        run: |
          set -euxo pipefail

          test -s arch/arm64/boot/Image
          test -s vmlinux
          test -s System.map
          test -e drivers/kernelsu

          # drivers/kernelsu is a symlink to KernelSU-Next/kernel.
          # Plain `find` does not descend through a command-line symlink,
          # so follow it explicitly when checking generated KSUN objects.
          KSUN_OBJECT="$(
            find -L drivers/kernelsu -type f -name '*.o' -print -quit
          )"
          test -n "$KSUN_OBJECT"

          SELINUX_HIDE_OBJECT="$(
            find -L drivers/kernelsu -type f -name 'selinux_hide.o' -print -quit
          )"
          test -n "$SELINUX_HIDE_OBJECT"

          # Also verify that SELinux Hide made it into the final linked kernel,
          # not merely that its object file was produced.
          if ! grep -Eq 'ksu_(selinux_hide|feature_selinux_hide)|selinux_hide' System.map; then
            echo "ERROR: SELinux Hide symbol not found in final System.map"
            exit 1
          fi

          echo "KSUN object: $KSUN_OBJECT"
          echo "SELinux Hide object: $SELINUX_HIDE_OBJECT"
          echo "SELinux Hide symbols found in final linked kernel."

          ls -lh arch/arm64/boot/Image vmlinux System.map
          sha256sum arch/arm64/boot/Image

      - name: Prepare AnyKernel package
        run: |
          set -euxo pipefail
          test -d anykernel
          test -f anykernel/anykernel.sh
          rm -rf output
          mkdir -p output
          cp -a anykernel/. output/
          cp arch/arm64/boot/Image output/Image
          test -s output/Image
          test -f output/anykernel.sh

      - name: Create flashable ZIP
        run: |
          set -euxo pipefail
          ZIP_NAME="M127F-KSUN-v3.3.0-TRIAL-22-SUSFS-UNAME-LOG-ABI.zip"
          rm -f "$ZIP_NAME"
          cd output
          zip -r9 "../$ZIP_NAME" .
          cd ..
          test -s "$ZIP_NAME"
          ls -lh "$ZIP_NAME"
          sha256sum "$ZIP_NAME"
          unzip -l "$ZIP_NAME"

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-TRIAL-22-SUSFS-UNAME-LOG-ABI
          path: M127F-KSUN-v3.3.0-TRIAL-22-SUSFS-UNAME-LOG-ABI.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-Config
          path: .config
          if-no-files-found: error
          include-hidden-files: true
