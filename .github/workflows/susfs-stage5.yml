          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              bool "Spoof cmdline/bootconfig"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_OPEN_REDIRECT
              bool "Open redirect"
              depends on KSU_SUSFS
              default y

          endmenu

          '''
              pos = k.rfind(marker)
              k = k[:pos] + block + k[pos:]
              p.write_text(k)

          p = Path("KernelSU-Next/kernel/selinux/selinux.c")
          c = p.read_text()
          wrapper = '''

          #ifdef CONFIG_KSU_SUSFS
          /* Stage 5 2.3.0 compile-probe adapters for Samsung 4.19. */
          bool susfs_is_current_ksu_domain(void)
          {
              return is_ksu_domain();
          }

          bool susfs_is_current_zygote_domain(void)
          {
              return is_zygote(current_cred());
          }
          #endif
          '''
          if "bool susfs_is_current_ksu_domain(void)" not in c:
              p.write_text(c + wrapper)

          p = Path("arch/arm64/configs/exynos850-m12nsxx_defconfig")
          d = p.read_text()
          symbols = [
              "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y",
              "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set",
              "# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set",
              "# CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT is not set",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y",
          ]
          for sym in symbols:
              name = sym.replace("# ", "").split("=", 1)[0].split(" is not set", 1)[0]
              lines = [line for line in d.splitlines()
                       if not (line.startswith(name + "=") or line == f"# {name} is not set")]
              lines.append(sym)
              d = "\n".join(lines) + "\n"
          p.write_text(d)

          print("Stage 4 minimal KSUN SUSFS compile-probe glue prepared")
          PY

          git -C KernelSU-Next diff --binary \
            > .github/patches/stage5-ksun-susfs-compile-probe.patch

          test -s .github/patches/stage5-ksun-susfs-compile-probe.patch
          git -C KernelSU-Next diff --stat

          git -C KernelSU-Next reset --hard
          git -C KernelSU-Next clean -fd

      - name: Prepare disposable Stage 4 build workflow
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path(".github/workflows/build-ksun.yml")
          s = p.read_text()

          anchor = "      - name: Patch KSUN file wrapper for Samsung 4.19\n"
          if anchor not in s:
              raise SystemExit("build workflow KSUN patch anchor missing")

          step = "\n".join([
              "      - name: Stage 4 apply SUSFS KSUN compile-probe glue",
              "        run: |",
              "          set -euxo pipefail",
              "          test -s .github/patches/stage5-ksun-susfs-compile-probe.patch",
              "          git -C KernelSU-Next apply ../.github/patches/stage5-ksun-susfs-compile-probe.patch",
              "          grep -n 'KernelSU - SUSFS Stage4 compile probe' KernelSU-Next/kernel/Kconfig",
              "          grep -n 'susfs_is_current_ksu_domain' KernelSU-Next/kernel/selinux/selinux.c",
              "          grep -n 'susfs_is_current_zygote_domain' KernelSU-Next/kernel/selinux/selinux.c",
              "",
              "",
          ])
          if "Stage 4 apply SUSFS KSUN compile-probe glue" not in s:
              s = s.replace(anchor, step + anchor, 1)

          verify_anchor = "      - name: Prepare AnyKernel package\n"
          if verify_anchor not in s:
              raise SystemExit("build workflow package anchor missing")

          verify = "\n".join([
              "      - name: Verify Stage 4 SUSFS compile probe",
              "        run: |",
              "          set -euxo pipefail",
              "          grep -E '^CONFIG_KSU_SUSFS(=|_)' .config || true",
              "          grep -q '^CONFIG_KSU_SUSFS=y$' .config",
              "          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' .config",
              "          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' .config",
              "          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' .config",
              "          test -s fs/susfs.o",
              "          if ! grep -Eq '(^|[[:space:]])susfs_' System.map; then",
              '            echo "ERROR: SUSFS symbols not linked into final kernel"',
              "            exit 1",
              "          fi",
              "          ls -lh fs/susfs.o",
              "          grep -E '(^|[[:space:]])susfs_' System.map | head -40",
              '          echo "Stage 4 compile probe passed."',
              "",
              "",
          ])
          if "Verify Stage 4 SUSFS compile probe" not in s:
              s = s.replace(verify_anchor, verify + verify_anchor, 1)

          # Compile-probe mode: keep building independent objects after an
          # error so one trial exposes multiple Samsung-4.19 incompatibilities.
          make_parallel = '            -j"$(nproc)"\n'
          if s.count(make_parallel) != 1:
              raise SystemExit(
                  "expected exactly one kernel parallel make line"
              )
          s = s.replace(
              make_parallel,
              '            -k -j"$(nproc)"\n',
              1
          )

          s = s.replace(
              "M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS230.zip",
              "M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-STAGE4-COMPILE-PROBE.zip"
          )
          s = s.replace(
              "name: M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS230\n",
              "name: M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-STAGE4-COMPILE-PROBE\n"
          )
          p.write_text(s)
          PY

          grep -n 'Stage 4 apply SUSFS KSUN compile-probe glue' .github/workflows/build-ksun.yml
          grep -n 'Verify Stage 4 SUSFS compile probe' .github/workflows/build-ksun.yml

      - name: Verify disposable Stage 4 source tree
        run: |
          set -euxo pipefail
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          grep -q 'susfs_copy_mnt_ns_samsung419' fs/namespace.c
          grep -q 'fdinfo_susfs_samsung419' fs/notify/fdinfo.c
          grep -q 'susfs_statfs_kdp_samsung419' fs/statfs.c
          grep -q 'susfs_namespace_generic_cleanup_samsung419' fs/namespace.c
          ! grep -q 'bool is_current_zygote_domain =' fs/namespace.c
          ! grep -q 'int attach_mnt_count = 0;' fs/namespace.c
          ! grep -q 'bool is_zygote_pid =' fs/namespace.c
          ! grep -q 'int last_entry_mnt_id = 0;' fs/namespace.c
          grep -q '^\s*u32 mask;$' fs/notify/fdinfo.c
          grep -q '^\s*mask = mark->mask & IN_ALL_EVENTS;$' fs/notify/fdinfo.c
          ! grep -q '^\s*u32 mask = mark->mask & IN_ALL_EVENTS;$' fs/notify/fdinfo.c
          grep -q 'may_create_susfs_samsung419' fs/namei.c
          grep -q '^CONFIG_KSU_SUSFS=y$' arch/arm64/configs/exynos850-m12nsxx_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' arch/arm64/configs/exynos850-m12nsxx_defconfig
          test -z "$(git -C KernelSU-Next status --porcelain)"
          test "$(find . -name '*.rej' -type f | wc -l)" -eq 0
          git diff --check

      - name: Push disposable Stage 4 source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          BRANCH="ci-susfs-stage5-trial18-${GITHUB_RUN_ID}"
          echo "STAGE4_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add \
            fs \
            include/linux \
            kernel \
            arch/arm64/configs/exynos850-m12nsxx_defconfig

          # GitHub Actions' repository token cannot push a modified workflow
          # without the separate workflows permission. Keep the generated
          # Stage-4 build recipe as ordinary data instead.
          mkdir -p .ci/stage4
          cp .github/workflows/build-ksun.yml .ci/stage5/build-ksun-stage5.yml
          git checkout -- .github/workflows/build-ksun.yml

          git add -f \
            .github/patches/stage5-ksun-susfs-compile-probe.patch \
            .ci/stage5/build-ksun-stage5.yml \
            .ci/stage5

          git status --short
          git commit -m "CI: SUSFS Stage 5 Trial 18 audit remaining 2.3.0 semantic gaps"
          git push origin "$BRANCH"
          echo "Disposable Stage 4 branch pushed: $BRANCH"

      - name: Execute Stage 4 build recipe
        run: |
          set -euxo pipefail

          # Execute shell steps from the generated build recipe in this runner.
          # Action-only steps (checkout/setup/upload) are skipped.
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          wf = yaml.safe_load(Path(".ci/stage5/build-ksun-stage5.yml").read_text())
          jobs = wf.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"expected one build job, got {list(jobs)}")

          steps = next(iter(jobs.values())).get("steps", [])
          chunks = ["#!/usr/bin/env bash", "set -euo pipefail", ""]

          for idx, step in enumerate(steps, 1):
              name = step.get("name", f"step-{idx}")
              script = step.get("run")
              if script is None:
                  print(f"skip action-only step: {name}")
                  continue
              chunks += [
                  f'echo "===== Stage 5 Trial 7: {name} ====="',
                  script,
                  "",
              ]

          Path("/tmp/stage4-build-recipe.sh").write_text("\n".join(chunks))
          PY

          chmod +x /tmp/stage4-build-recipe.sh
          bash /tmp/stage4-build-recipe.sh

          echo "Stage 5 Trial 7 compile recipe completed."
          echo "Compile probe only — do not flash."

      - name: Upload Stage 5 Trial 7 compile outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m127f-susfs-stage5-trial18
          if-no-files-found: warn
          path: |
            Image
            System.map
            .config
            .ci/stage5/
            M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-STAGE4-COMPILE-PROBE.zip

