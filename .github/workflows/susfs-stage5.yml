      - name: Resolve Samsung inotify fdinfo reject
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/notify/fdinfo.c")
          s = p.read_text()

          if "fdinfo_susfs_samsung419" in s:
              print("fdinfo SUSFS adaptation already present")
              raise SystemExit(0)

          # Stage 1 successfully applies the SUSFS callback plumbing:
          # under CONFIG_KSU_SUSFS_SUS_MOUNT the callback order is
          #   inotify_fdinfo(m, mark, file)
          # Only the Samsung-specific function-body hunk rejects.
          signature = (
              "static void inotify_fdinfo("
              "struct seq_file *m, struct fsnotify_mark *mark, "
              "struct file *file)"
          )

          start = s.find(signature)

          if start == -1:
              raise SystemExit(
                  "Expected Stage-1 inotify (m, mark, file) signature missing"
              )

          anchor = "\tif (inode) {\n"
          idx = s.find(anchor, start)

          if idx == -1:
              raise SystemExit(
                  "inotify inode block missing"
              )

          insert_at = idx + len(anchor)

          block = (
              "\t\tu32 mask;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t\t/* fdinfo_susfs_samsung419 */\n"
              "\t\tif (likely(current->susfs_task_state & "
              "TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&\n"
              "\t\t    unlikely(inode->i_state & "
              "INODE_STATE_SUS_KSTAT)) {\n"
              "\t\t\tstruct path susfs_path;\n"
              "\t\t\tchar *pathname;\n"
              "\t\t\tchar *dpath;\n"
              "\n"
              "\t\t\tpathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n"
              "\t\t\tif (!pathname)\n"
              "\t\t\t\tgoto susfs_fdinfo_fallback;\n"
              "\n"
              "\t\t\tdpath = d_path("
              "&file->f_path, pathname, PAGE_SIZE);\n"
              "\t\t\tif (IS_ERR(dpath)) {\n"
              "\t\t\t\tkfree(pathname);\n"
              "\t\t\t\tgoto susfs_fdinfo_fallback;\n"
              "\t\t\t}\n"
              "\n"
              "\t\t\tif (!kern_path(dpath, 0, &susfs_path)) {\n"
              "\t\t\t\tu32 susfs_mask = "
              "mark->mask & IN_ALL_EVENTS;\n"
              "\n"
              "\t\t\t\tseq_printf(m,\n"
              "\t\t\t\t\t\"inotify wd:%x ino:%lx "
              "sdev:%x mask:%x ignored_mask:%x \",\n"
              "\t\t\t\t\tinode_mark->wd,\n"
              "\t\t\t\t\tsusfs_path.dentry->d_inode->i_ino,\n"
              "\t\t\t\t\tsusfs_path.dentry->d_inode->"
              "i_sb->s_dev,\n"
              "\t\t\t\t\tsusfs_mask,\n"
              "\t\t\t\t\tmark->ignored_mask);\n"
              "\n"
              "\t\t\t\tshow_mark_fhandle(\n"
              "\t\t\t\t\tm,\n"
              "\t\t\t\t\tsusfs_path.dentry->d_inode);\n"
              "\t\t\t\tseq_putc(m, '\\n');\n"
              "\t\t\t\tpath_put(&susfs_path);\n"
              "\t\t\t\tkfree(pathname);\n"
              "\t\t\t\tiput(inode);\n"
              "\t\t\t\treturn;\n"
              "\t\t\t}\n"
              "\n"
              "\t\t\tkfree(pathname);\n"
              "\t\t}\n"
              "susfs_fdinfo_fallback:\n"
              "#endif\n"
          )

          s = s[:insert_at] + block + s[insert_at:]

          # Samsung's original declaration used to be the first item in
          # the inode block.  SUSFS now executes before it, so leaving it
          # there violates the kernel's C90 declaration-before-statements
          # rule.  Convert only that original declaration to assignment.
          original_mask = (
              "\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n"
          )
          mask_pos = s.find(
              original_mask,
              insert_at + len(block)
          )
          if mask_pos == -1:
              raise SystemExit(
                  "Samsung fdinfo original mask declaration missing"
              )

          replacement_mask = (
              "\t\tmask = mark->mask & IN_ALL_EVENTS;\n"
          )
          s = (
              s[:mask_pos]
              + replacement_mask
              + s[mask_pos + len(original_mask):]
          )

          p.write_text(s)

          print("Resolved Samsung fdinfo reject")
          PY

