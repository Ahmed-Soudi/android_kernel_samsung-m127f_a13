name: SUSFS Samsung 4.19 Stage 5 - Trial 18

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - ksun-3.3.0-ps5-susfs230
    paths:
      - '.github/workflows/susfs-stage5.yml'

jobs:
  stage2:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout exact kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify baseline
        run: |
          set -euxo pipefail

          echo "HEAD:"
          git rev-parse HEAD

          echo "KernelSU:"
          git submodule status KernelSU-Next

          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

      - name: Fetch SUSFS 4.19 compatibility reference
        run: |
          set -euxo pipefail

          BASE="https://raw.githubusercontent.com/sch-lda/susfs4ksu-4.19-1.5.7/Branch_a/kernel_patches"

          curl -fL --retry 5 \
            "$BASE/50_add_susfs_in_kernel-4.19.patch" \
            -o /tmp/susfs419.patch

          curl -fL --retry 5 \
            "$BASE/fs/susfs.c" \
            -o /tmp/susfs.c

          curl -fL --retry 5 \
            "$BASE/fs/sus_su.c" \
            -o /tmp/sus_su.c

          curl -fL --retry 5 \
            "$BASE/include/linux/susfs.h" \
            -o /tmp/susfs.h

          curl -fL --retry 5 \
            "$BASE/include/linux/susfs_def.h" \
            -o /tmp/susfs_def.h

          curl -fL --retry 5 \
            "$BASE/include/linux/sus_su.h" \
            -o /tmp/sus_su.h

      - name: Recreate Stage 1 reference application
        run: |
          set -euxo pipefail

          set +e

          git apply \
            --reject \
            --whitespace=nowarn \
            /tmp/susfs419.patch

          RC=$?

          set -e

          echo "reference patch rc=$RC"

          cp /tmp/susfs.c fs/susfs.c
          cp /tmp/sus_su.c fs/sus_su.c

          cp /tmp/susfs.h include/linux/susfs.h
          cp /tmp/susfs_def.h include/linux/susfs_def.h
          cp /tmp/sus_su.h include/linux/sus_su.h

      - name: Recreate Samsung task_struct adaptation
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/sched.h")
          s = p.read_text()

          if "u64 susfs_task_state;" not in s:
              marker = "randomized_struct_fields_end"

              idx = s.find(marker)

              if idx == -1:
                  raise SystemExit(
                      "randomized_struct_fields_end not found"
                  )

              insert = (
                  "#ifdef CONFIG_KSU_SUSFS\n"
                  "\tu64\t\t\t\tsusfs_task_state;\n"
                  "\tu64\t\t\t\tsusfs_last_fake_mnt_id;\n"
                  "#endif\n\n"
              )

              s = s[:idx] + insert + s[idx:]

              p.write_text(s)

          print("Samsung task_struct adaptation ready")
          PY

      - name: Recreate Samsung vfsmount adaptation
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/mount.h")
          s = p.read_text()

          if "susfs_mnt_id_backup" not in s:
              marker = "\tint mnt_flags;\n"

              idx = s.find(marker)

              if idx == -1:
                  raise SystemExit(
                      "vfsmount mnt_flags marker not found"
                  )

              insert_at = idx + len(marker)

              insert = (
                  "#ifdef CONFIG_KSU_SUSFS\n"
                  "\tu64 susfs_mnt_id_backup;\n"
                  "#endif\n"
              )

              s = s[:insert_at] + insert + s[insert_at:]

              p.write_text(s)

          print("Samsung vfsmount adaptation ready")
          PY

      - name: Recreate include-only adaptations
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def add_after(path, anchor, block):
              p = Path(path)
              s = p.read_text()

              if "#include <linux/susfs_def.h>" in s:
                  return

              if anchor not in s:
                  raise SystemExit(
                      f"{path}: anchor missing: {anchor!r}"
                  )

              s = s.replace(
                  anchor,
                  anchor + "\n" + block,
                  1
              )

              p.write_text(s)

          add_after(
              "fs/dcache.c",
              "#include <linux/list_lru.h>",
              (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif"
              )
          )

          add_after(
              "fs/namei.c",
              "#include <linux/build_bug.h>",
              (
                  "#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || "
                  "defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif"
              )
          )

          add_after(
              "fs/proc/task_mmu.c",
              "#include <linux/mm_inline.h>",
              (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif"
              )
          )
          PY

      - name: Recreate Samsung namespace declarations
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/namespace.c")
          s = p.read_text()

          if "#include <linux/susfs_def.h>" not in s:
              anchor = "#include <linux/sched/task.h>\n"

              if anchor not in s:
                  raise SystemExit(
                      "namespace include anchor missing"
                  )

              block = (
                  "#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || "
                  "defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif\n"
              )

              s = s.replace(
                  anchor,
                  anchor + block,
                  1
              )

          if "static DEFINE_IDA(susfs_mnt_id_ida)" not in s:
              anchor = '#include "internal.h"\n'

              if anchor not in s:
                  raise SystemExit(
                      "namespace internal.h anchor missing"
                  )

              block = (
                  "\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "extern bool susfs_is_current_ksu_domain(void);\n"
                  "extern bool susfs_is_current_zygote_domain(void);\n"
                  "\n"
                  "static DEFINE_IDA(susfs_mnt_id_ida);\n"
                  "static DEFINE_IDA(susfs_mnt_group_ida);\n"
                  "\n"
                  "#define CL_COPY_MNT_NS BIT(25)\n"
                  "#endif\n"
                  "\n"
                  "#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT\n"
                  "extern void susfs_auto_add_sus_ksu_default_mount(\n"
                  "    const char __user *to_pathname);\n"
                  "bool susfs_is_auto_add_sus_ksu_default_mount_enabled = true;\n"
                  "#endif\n"
                  "\n"
                  "#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT\n"
                  "extern int susfs_auto_add_sus_bind_mount(\n"
                  "    const char *pathname,\n"
                  "    struct path *path_target);\n"
                  "bool susfs_is_auto_add_sus_bind_mount_enabled = true;\n"
                  "#endif\n"
                  "\n"
                  "#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT\n"
                  "extern void susfs_auto_add_try_umount_for_bind_mount(\n"
                  "    struct path *path);\n"
                  "bool susfs_is_auto_add_try_umount_for_bind_mount_enabled = true;\n"
                  "#endif\n"
              )

              s = s.replace(
                  anchor,
                  anchor + block,
                  1
              )

          p.write_text(s)
          PY

      - name: Remove superseded generic namespace SUSFS variables
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/namespace.c")
          s = p.read_text()

          marker = "susfs_namespace_generic_cleanup_samsung419"
          if marker in s:
              print("generic namespace SUSFS cleanup already applied")
              raise SystemExit(0)

          removals = [
              (
                  "\t#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tbool is_current_zygote_domain = susfs_is_current_zygote_domain();\n"
                  "\t#endif\n",
                  ""
              ),
              (
                  "\t\t#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t\tint attach_mnt_count = 0;\n"
                  "\t\t#endif\n",
                  ""
              ),
              (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tbool is_zygote_pid = susfs_is_current_zygote_domain();\n"
                  "\tint last_entry_mnt_id = 0;\n"
                  "#endif\n",
                  ""
              ),
          ]

          for old, new in removals:
              if old not in s:
                  raise SystemExit(
                      "expected superseded generic namespace block missing"
                  )
              s = s.replace(old, new, 1)

          include_anchor = '#include "internal.h"\n'
          if include_anchor not in s:
              raise SystemExit("namespace internal include anchor missing")
          s = s.replace(
              include_anchor,
              include_anchor
              + "/* susfs_namespace_generic_cleanup_samsung419 */\n",
              1,
          )

          p.write_text(s)
          print("Removed superseded generic SUSFS namespace variables")
          PY

          ! grep -q 'bool is_current_zygote_domain =' fs/namespace.c
          ! grep -q 'int attach_mnt_count = 0;' fs/namespace.c
          ! grep -q 'bool is_zygote_pid =' fs/namespace.c
          ! grep -q 'int last_entry_mnt_id = 0;' fs/namespace.c
          grep -q 'susfs_namespace_generic_cleanup_samsung419' fs/namespace.c

      - name: Resolve Samsung KDP namespace rejects
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("fs/namespace.c")
          s = p.read_text()

          # ----------------------------------------------------------
          # 1. KDP-safe accessor for vfsmount SUSFS backup mount ID.
          # The generic 4.19 SUSFS patch assumes:
          #     struct mount { struct vfsmount mnt; }
          # Samsung CONFIG_KDP_NS uses:
          #     struct mount { struct vfsmount *mnt; }
          # ----------------------------------------------------------
          if "SUSFS_MNT_ID_BACKUP(" not in s:
              anchor = '#include "internal.h"\n'
              if anchor not in s:
                  raise SystemExit("namespace internal.h anchor missing")

              block = (
                  "\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "#ifdef CONFIG_KDP_NS\n"
                  "#define SUSFS_MNT_ID_BACKUP(m) ((m)->mnt->susfs_mnt_id_backup)\n"
                  "#else\n"
                  "#define SUSFS_MNT_ID_BACKUP(m) ((m)->mnt.susfs_mnt_id_backup)\n"
                  "#endif\n"
                  "#endif\n"
              )

              s = s.replace(anchor, anchor + block, 1)

          # Convert generic SUSFS backup field uses that may have applied
          # cleanly into the Samsung/KDP-safe accessor.
          s = re.sub(
              r'([A-Za-z_][A-Za-z0-9_]*)->mnt\.susfs_mnt_id_backup',
              r'SUSFS_MNT_ID_BACKUP(\1)',
              s
          )

          # ----------------------------------------------------------
          # 2. alloc_vfsmnt(): support normal IDs, SUSFS IDs and
          # custom IDs while preserving Samsung's KDP allocation.
          # ----------------------------------------------------------
          old_sig = "static struct mount *alloc_vfsmnt(const char *name)\n{"
          new_sig = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "static struct mount *alloc_vfsmnt(const char *name,\n"
              "\t\t\t\t bool should_spoof, int custom_mnt_id)\n"
              "#else\n"
              "static struct mount *alloc_vfsmnt(const char *name)\n"
              "#endif\n"
              "{"
          )

          if "bool should_spoof, int custom_mnt_id" not in s:
              if old_sig not in s:
                  raise SystemExit("alloc_vfsmnt signature anchor missing")
              s = s.replace(old_sig, new_sig, 1)

          normal_alloc = "\t\terr = mnt_alloc_id(mnt);\n"
          if "susfs_alloc_vfsmnt_samsung419" not in s:
              idx = s.find(normal_alloc, s.find("static struct mount *alloc_vfsmnt"))
              if idx == -1:
                  raise SystemExit("alloc_vfsmnt mnt_alloc_id anchor missing")

              replacement = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t\t/* susfs_alloc_vfsmnt_samsung419 */\n"
                  "\t\tif (should_spoof) {\n"
                  "\t\t\tif (custom_mnt_id) {\n"
                  "\t\t\t\tmnt->mnt_id = custom_mnt_id;\n"
                  "\t\t\t\terr = 0;\n"
                  "\t\t\t} else {\n"
                  "\t\t\t\terr = susfs_mnt_alloc_id(mnt);\n"
                  "\t\t\t}\n"
                  "\t\t} else {\n"
                  "\t\t\terr = mnt_alloc_id(mnt);\n"
                  "\t\t}\n"
                  "#else\n"
                  "\t\terr = mnt_alloc_id(mnt);\n"
                  "#endif\n"
              )
              s = s[:idx] + replacement + s[idx + len(normal_alloc):]

          # ----------------------------------------------------------
          # 3. Update all ordinary alloc_vfsmnt() call sites.
          # clone_mnt() and vfs_kern_mount() are handled specially below.
          # ----------------------------------------------------------
          # mnt_clone_internal etc do not call alloc_vfsmnt directly.
          # Any still-generic direct calls outside our target functions
          # should remain normal allocations.
          def function_region(text, signature, end_marker):
              """
              Return a stable source slice without trying to count C braces.

              Samsung namespace.c has CONFIG_KDP_NS / #else alternatives
              that each contain their own opening braces but share closing
              braces after #endif. A raw lexical brace counter therefore
              sees both mutually-exclusive branches and cannot determine
              function boundaries correctly.
              """
              start = text.find(signature)
              if start == -1:
                  raise SystemExit(f"function missing: {signature}")

              end = text.find(end_marker, start)
              if end == -1:
                  raise SystemExit(
                      f"function end marker missing: {signature} -> {end_marker}"
                  )

              return start, end

          # ----------------------------------------------------------
          # 4. vfs_kern_mount(): KSU-created mounts get SUSFS IDs.
          # Preserve KDP mount object allocation and root setup.
          # ----------------------------------------------------------
          vstart, vend = function_region(
              s,
              "struct vfsmount *\nvfs_kern_mount(",
              "EXPORT_SYMBOL_GPL(vfs_kern_mount);"
          )
          vf = s[vstart:vend]

          if "susfs_vfs_kern_mount_samsung419" not in vf:
              decl_anchor = "\tstruct mount *mnt;\n"
              if decl_anchor not in vf:
                  raise SystemExit("vfs_kern_mount mnt declaration missing")
              decl_block = (
                  decl_anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "\t/* susfs_vfs_kern_mount_samsung419 */\n"
                  + "\tstruct mount *susfs_iter;\n"
                  + "\tstruct mnt_namespace *susfs_ns;\n"
                  + "\tint susfs_fake_mnt_id;\n"
                  + "#endif\n"
              )
              vf = vf.replace(decl_anchor, decl_block, 1)

              alloc_anchor = "\tmnt = alloc_vfsmnt(name);\n"
              if alloc_anchor not in vf:
                  raise SystemExit("vfs_kern_mount alloc_vfsmnt anchor missing")
              alloc_block = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tif (unlikely(susfs_is_current_ksu_domain()))\n"
                  "\t\tmnt = alloc_vfsmnt(name, true, 0);\n"
                  "\telse\n"
                  "\t\tmnt = alloc_vfsmnt(name, false, 0);\n"
                  "#else\n"
                  "\tmnt = alloc_vfsmnt(name);\n"
                  "#endif\n"
              )
              vf = vf.replace(alloc_anchor, alloc_block, 1)

              parent_anchor = "\tmnt->mnt_parent = mnt;\n"
              if parent_anchor not in vf:
                  raise SystemExit("vfs_kern_mount parent anchor missing")
              fake_block = (
                  parent_anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "\tif (susfs_is_current_zygote_domain()) {\n"
                  + "\t\tsusfs_ns = current->nsproxy->mnt_ns;\n"
                  + "\t\tif (susfs_ns) {\n"
                  + "\t\t\tget_mnt_ns(susfs_ns);\n"
                  + "\t\t\trcu_read_lock();\n"
                  + "\t\t\tsusfs_fake_mnt_id = list_first_entry(\n"
                  + "\t\t\t\t&susfs_ns->list, struct mount, mnt_list)->mnt_id;\n"
                  + "\t\t\tlist_for_each_entry_rcu(susfs_iter,\n"
                  + "\t\t\t\t&susfs_ns->list, mnt_list) {\n"
                  + "\t\t\t\tif (susfs_iter->mnt_id < DEFAULT_SUS_MNT_ID)\n"
                  + "\t\t\t\t\tsusfs_fake_mnt_id++;\n"
                  + "\t\t\t}\n"
                  + "\t\t\tSUSFS_MNT_ID_BACKUP(mnt) = READ_ONCE(mnt->mnt_id);\n"
                  + "\t\t\tWRITE_ONCE(mnt->mnt_id, susfs_fake_mnt_id);\n"
                  + "\t\t\trcu_read_unlock();\n"
                  + "\t\t\tput_mnt_ns(susfs_ns);\n"
                  + "\t\t}\n"
                  + "\t}\n"
                  + "#endif\n"
              )
              vf = vf.replace(parent_anchor, fake_block, 1)

              s = s[:vstart] + vf + s[vend:]

          # ----------------------------------------------------------
          # 5. clone_mnt(): distinguish namespace-copy clones from
          # single clones and use KDP-safe vfsmount access.
          # ----------------------------------------------------------
          cstart, cend = function_region(
              s,
              "static struct mount *clone_mnt(",
              "static void cleanup_mnt("
          )
          cf = s[cstart:cend]

          if "susfs_clone_mnt_samsung419" not in cf:
              decl_anchor = "\tstruct mount *mnt;\n\tint err;\n"
              if decl_anchor not in cf:
                  raise SystemExit("clone_mnt declarations anchor missing")

              decl_block = (
                  "\tstruct mount *mnt;\n"
                  "\tint err;\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t/* susfs_clone_mnt_samsung419 */\n"
                  "\tstruct mount *susfs_iter;\n"
                  "\tstruct mnt_namespace *susfs_ns;\n"
                  "\tint susfs_fake_mnt_id;\n"
                  "\tbool susfs_ksu = susfs_is_current_ksu_domain();\n"
                  "\tbool susfs_zygote = susfs_is_current_zygote_domain();\n"
                  "#endif\n"
              )
              cf = cf.replace(decl_anchor, decl_block, 1)

              alloc_anchor = "\tmnt = alloc_vfsmnt(old->mnt_devname);\n"
              if alloc_anchor not in cf:
                  raise SystemExit("clone_mnt alloc_vfsmnt anchor missing")

              alloc_block = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tif (unlikely(susfs_ksu)) {\n"
                  "\t\tif (!(flag & CL_COPY_MNT_NS)) {\n"
                  "\t\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                  "\t\t} else {\n"
                  "\t\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, old->mnt_id);\n"
                  "\t\t\tif (mnt)\n"
                  "\t\t\t\tSUSFS_MNT_ID_BACKUP(mnt) =\n"
                  "\t\t\t\t\tDEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE;\n"
                  "\t\t}\n"
                  "\t} else if (old->mnt_id >= DEFAULT_SUS_MNT_ID) {\n"
                  "\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                  "\t} else {\n"
                  "\t\tmnt = alloc_vfsmnt(old->mnt_devname, false, 0);\n"
                  "\t}\n"
                  "#else\n"
                  "\tmnt = alloc_vfsmnt(old->mnt_devname);\n"
                  "#endif\n"
              )
              cf = cf.replace(alloc_anchor, alloc_block, 1)

              parent_anchor = "\tmnt->mnt_parent = mnt;\n"
              if parent_anchor not in cf:
                  raise SystemExit("clone_mnt parent anchor missing")

              fake_block = (
                  parent_anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "\tif (likely(susfs_zygote) && !(flag & CL_COPY_MNT_NS)) {\n"
                  + "\t\tsusfs_ns = current->nsproxy->mnt_ns;\n"
                  + "\t\tif (susfs_ns) {\n"
                  + "\t\t\tget_mnt_ns(susfs_ns);\n"
                  + "\t\t\trcu_read_lock();\n"
                  + "\t\t\tsusfs_fake_mnt_id = list_first_entry(\n"
                  + "\t\t\t\t&susfs_ns->list, struct mount, mnt_list)->mnt_id;\n"
                  + "\t\t\tlist_for_each_entry_rcu(susfs_iter,\n"
                  + "\t\t\t\t&susfs_ns->list, mnt_list) {\n"
                  + "\t\t\t\tif (susfs_iter->mnt_id < DEFAULT_SUS_MNT_ID)\n"
                  + "\t\t\t\t\tsusfs_fake_mnt_id++;\n"
                  + "\t\t\t}\n"
                  + "\t\t\tSUSFS_MNT_ID_BACKUP(mnt) = READ_ONCE(mnt->mnt_id);\n"
                  + "\t\t\tWRITE_ONCE(mnt->mnt_id, susfs_fake_mnt_id);\n"
                  + "\t\t\trcu_read_unlock();\n"
                  + "\t\t\tput_mnt_ns(susfs_ns);\n"
                  + "\t\t}\n"
                  + "\t}\n"
                  + "#endif\n"
              )
              cf = cf.replace(parent_anchor, fake_block, 1)

              s = s[:cstart] + cf + s[cend:]

          # ----------------------------------------------------------
          # 6. copy_tree(): compensate mount IDs for zygote single-tree
          # cloning while leaving copy_mnt_ns() clones alone.
          # ----------------------------------------------------------
          tstart, tend = function_region(
              s,
              "struct mount *copy_tree(",
              "/* Caller should check returned pointer for errors */"
          )
          tf = s[tstart:tend]

          if "susfs_copy_tree_samsung419" not in tf:
              decl_anchor = "\tstruct mount *res, *p, *q, *r, *parent;\n"
              if decl_anchor not in tf:
                  raise SystemExit("copy_tree declarations anchor missing")
              decl_block = (
                  decl_anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "\t/* susfs_copy_tree_samsung419 */\n"
                  + "\tbool susfs_zygote = susfs_is_current_zygote_domain();\n"
                  + "#endif\n"
              )
              tf = tf.replace(decl_anchor, decl_block, 1)

              loop_anchor = (
                  "\tlist_for_each_entry(r, &mnt->mnt_mounts, mnt_child) {\n"
                  "\t\tstruct mount *s;\n"
              )
              if loop_anchor not in tf:
                  raise SystemExit("copy_tree outer loop anchor missing")
              loop_block = (
                  loop_anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "\t\tint susfs_attach_mnt_count = 0;\n"
                  + "#endif\n"
              )
              tf = tf.replace(loop_anchor, loop_block, 1)

              attach_anchor = (
                  "\t\t\tattach_mnt(q, parent, p->mnt_mp);\n"
                  "\t\t\tunlock_mount_hash();\n"
              )
              if attach_anchor not in tf:
                  raise SystemExit("copy_tree attach anchor missing")

              attach_block = (
                  "\t\t\tattach_mnt(q, parent, p->mnt_mp);\n"
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t\t\tif (susfs_zygote &&\n"
                  "\t\t\t    !(flag & CL_COPY_MNT_NS) &&\n"
                  "\t\t\t    q->mnt_id < DEFAULT_SUS_MNT_ID) {\n"
                  "\t\t\t\tsusfs_attach_mnt_count++;\n"
                  "\t\t\t\tq->mnt_id += susfs_attach_mnt_count;\n"
                  "\t\t\t}\n"
                  "#endif\n"
                  "\t\t\tunlock_mount_hash();\n"
              )
              tf = tf.replace(attach_anchor, attach_block, 1)

              s = s[:tstart] + tf + s[tend:]

          # ----------------------------------------------------------
          # 7. copy_mnt_ns(): flag namespace clones and then create the
          # zygote-facing sequential fake ID view.
          # ----------------------------------------------------------
          nstart, nend = function_region(
              s,
              "struct mnt_namespace *copy_mnt_ns(",
              "/**\n * create_mnt_ns"
          )
          nf = s[nstart:nend]

          if "susfs_copy_mnt_ns_samsung419" not in nf:
              decl_anchor = "\tint copy_flags;\n"
              if decl_anchor not in nf:
                  raise SystemExit("copy_mnt_ns declarations anchor missing")

              decl_block = (
                  decl_anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "\t/* susfs_copy_mnt_ns_samsung419 */\n"
                  + "\tbool susfs_zygote = susfs_is_current_zygote_domain();\n"
                  + "\tint susfs_last_mnt_id = 0;\n"
                  + "#endif\n"
              )
              nf = nf.replace(decl_anchor, decl_block, 1)

              flag_anchor = (
                  "\tif (user_ns != ns->user_ns)\n"
                  "\t\tcopy_flags |= CL_SHARED_TO_SLAVE | CL_UNPRIVILEGED;\n"
              )
              if flag_anchor not in nf:
                  raise SystemExit("copy_mnt_ns copy_flags anchor missing")
              flag_block = (
                  flag_anchor
                  + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  + "\tcopy_flags |= CL_COPY_MNT_NS;\n"
                  + "#endif\n"
              )
              nf = nf.replace(flag_anchor, flag_block, 1)

              unlock_anchor = "\tnamespace_unlock();\n"
              # We need the final namespace_unlock(), after the second pass.
              idx = nf.rfind(unlock_anchor)
              if idx == -1:
                  raise SystemExit("copy_mnt_ns final namespace_unlock missing")

              before_unlock = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tif (susfs_zygote && !list_empty(&new_ns->list)) {\n"
                  "\t\tsusfs_last_mnt_id = list_first_entry(\n"
                  "\t\t\t&new_ns->list, struct mount, mnt_list)->mnt_id;\n"
                  "\t\tlist_for_each_entry(q, &new_ns->list, mnt_list) {\n"
                  "\t\t\tif (unlikely(q->mnt_id >= DEFAULT_SUS_MNT_ID))\n"
                  "\t\t\t\tcontinue;\n"
                  "\t\t\tSUSFS_MNT_ID_BACKUP(q) = q->mnt_id;\n"
                  "\t\t\tq->mnt_id = susfs_last_mnt_id++;\n"
                  "\t\t}\n"
                  "\t}\n"
                  "#endif\n"
              )
              nf = nf[:idx] + before_unlock + nf[idx:]

              s = s[:nstart] + nf + s[nend:]

          # ----------------------------------------------------------
          # 8. Any remaining normal alloc_vfsmnt call sites introduced
          # by Samsung outside the special functions need the new normal
          # arguments when SUSFS is enabled.  The only expected direct
          # callers in this tree are vfs_kern_mount() and clone_mnt().
          # ----------------------------------------------------------
          leftovers = [
              line for line in s.splitlines()
              if "alloc_vfsmnt(" in line
              and "static struct mount *alloc_vfsmnt" not in line
              and "mnt = alloc_vfsmnt(name," not in line
              and "mnt = alloc_vfsmnt(old->mnt_devname," not in line
              and "mnt = alloc_vfsmnt(name);" not in line
              and "mnt = alloc_vfsmnt(old->mnt_devname);" not in line
          ]

          if leftovers:
              print("Unexpected alloc_vfsmnt call sites:")
              for line in leftovers:
                  print(line)
              raise SystemExit("Unexpected alloc_vfsmnt call site")

          p.write_text(s)

          print("Resolved Samsung/KDP namespace SUSFS rejects")
          PY

