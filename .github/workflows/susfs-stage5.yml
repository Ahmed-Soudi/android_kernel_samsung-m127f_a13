      - name: Stage 5 Trial 7 import official SUSFS 2.3.0 core
        run: |
          set -euxo pipefail

          # Stage 4 proved that our Samsung 4.19 VFS adaptation compiles.
          # Stage 5 now replaces the old 1.5.7 SUSFS implementation/header
          # payload with the current official 2.3.0 implementation.  We do
          # NOT apply the modern 5.15 kernel patch wholesale: Samsung 4.19
          # keeps the already-adapted VFS hooks from Stage 3/4.
          BASE="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15/kernel_patches"

          curl --fail --location --retry 3 \
            "$BASE/fs/susfs.c" \
            --output /tmp/susfs-230.c

          curl --fail --location --retry 3 \
            "$BASE/include/linux/susfs.h" \
            --output /tmp/susfs-230.h

          curl --fail --location --retry 3 \
            "$BASE/include/linux/susfs_def.h" \
            --output /tmp/susfs_def-230.h

          test -s /tmp/susfs-230.c
          test -s /tmp/susfs-230.h
          test -s /tmp/susfs_def-230.h

          if ! grep -Eq 'SUSFS_VERSION.*2\.3\.0|2\.3\.0.*SUSFS_VERSION' \
              /tmp/susfs-230.h /tmp/susfs_def-230.h /tmp/susfs-230.c; then
            echo "::error::Downloaded official source does not identify itself as SUSFS 2.3.0"
            grep -nE 'SUSFS_VERSION|2\.3\.0' \
              /tmp/susfs-230.h /tmp/susfs_def-230.h /tmp/susfs-230.c || true
            exit 1
          fi

          mkdir -p .ci/stage5
          cp fs/susfs.c .ci/stage5/susfs-1.5.7-reference.c
          cp include/linux/susfs.h .ci/stage5/susfs-1.5.7-reference.h
          cp include/linux/susfs_def.h .ci/stage5/susfs_def-1.5.7-reference.h

          cp /tmp/susfs-230.c fs/susfs.c
          cp /tmp/susfs-230.h include/linux/susfs.h
          cp /tmp/susfs_def-230.h include/linux/susfs_def.h

          # Save the exact upstream delta used by this trial.  This makes the
          # next 4.19 backport pass deterministic from the Actions artifact.
          diff -u \
            .ci/stage5/susfs-1.5.7-reference.c \
            fs/susfs.c \
            > .ci/stage5/susfs-core-1.5.7-to-2.3.0.diff || true

          diff -u \
            .ci/stage5/susfs-1.5.7-reference.h \
            include/linux/susfs.h \
            > .ci/stage5/susfs-header-1.5.7-to-2.3.0.diff || true

          diff -u \
            .ci/stage5/susfs_def-1.5.7-reference.h \
            include/linux/susfs_def.h \
            > .ci/stage5/susfs-def-1.5.7-to-2.3.0.diff || true

          {
            echo "Stage 5 Trial 7"
            echo "Official branch: gki-android13-5.15"
            grep -E '^#define[[:space:]]+SUSFS_VERSION' include/linux/susfs.h
            sha256sum \
              fs/susfs.c \
              include/linux/susfs.h \
              include/linux/susfs_def.h
          } | tee .ci/stage5/official-230-source.txt

          grep -Eq 'SUSFS_VERSION.*2\.3\.0|2\.3\.0.*SUSFS_VERSION' \
            fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          test -s .ci/stage5/susfs-core-1.5.7-to-2.3.0.diff

          echo "Official SUSFS 2.3.0 core imported and verified."

      - name: Backport official 2.3.0 core interfaces to Samsung 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/susfs_def.h")
          x = p.read_text()
          cred_anchor = "#include <linux/bits.h>\n"
          if "#include <linux/cred.h>" not in x:
              if cred_anchor not in x:
                  raise SystemExit("susfs_def bits include anchor missing")
              x = x.replace(cred_anchor, cred_anchor + "#include <linux/cred.h>\n", 1)

          compat_anchor = "#define DEFAULT_KSU_MNT_MINOR_DEV (1 << 12)"
          compat = "\n".join([
              "",
              "/* Samsung 4.19 Stage 5 compile bridge. */",
              "#define DEFAULT_SUS_MNT_ID DEFAULT_KSU_MNT_ID",
              "#define DEFAULT_SUS_MNT_GROUP_ID DEFAULT_KSU_MNT_GROUP_ID",
              "#define DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE DEFAULT_KSU_MNT_ID",
              "",
          ])
          if "DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE" not in x:
              pos = x.find(compat_anchor)
              if pos < 0:
                  raise SystemExit("2.3.0 KSU mount ID anchor missing")
              eol = x.find("\n", pos)
              x = x[:eol + 1] + compat + x[eol + 1:]
          p.write_text(x)

          p = Path("fs/susfs.c")
          x = p.read_text()
          fs_anchor = "#include <linux/fs.h>\n"
          if "#include <linux/security.h>" not in x:
              if fs_anchor not in x:
                  raise SystemExit("susfs.c fs include anchor missing")
              x = x.replace(fs_anchor, fs_anchor + "#include <linux/security.h>\n", 1)

          modern_handler = "\n".join([
              "static const struct fsnotify_ops fsnotify_ops = {",
              "\t.handle_inode_event = susfs_handle_sdcard_inode_event,",
              "};",
          ])
          old_handler = "\n".join([
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)",
              "static const struct fsnotify_ops fsnotify_ops = {",
              "\t.handle_inode_event = susfs_handle_sdcard_inode_event,",
              "};",
              "#else",
              "static int susfs_handle_sdcard_event_419(struct fsnotify_group *group,",
              "\t\tstruct inode *inode, u32 mask, const void *data, int data_type,",
              "\t\tconst unsigned char *file_name, u32 cookie,",
              "\t\tstruct fsnotify_iter_info *iter_info)",
              "{",
              "\tif (!file_name || memcmp(file_name, \"Android\", 7) || file_name[7] != '\\0')",
              "\t\treturn 0;",
              "",
              "\tif (test_and_set_bit(0, &sdcard_cleanup_scheduled))",
              "\t\treturn 0;",
              "",
              "\tSUSFS_LOGI(\"'%s' detected, mask: 0x%x\\\\n\", SDCARD_ANDROID_PATH, mask);",
              "\tSUSFS_LOGI(\"deferring cleanup for 5 seconds\\\\n\");",
              "\tqueue_delayed_work(system_unbound_wq, &sdcard_cleanup_dwork, 5 * HZ);",
              "\treturn 0;",
              "}",
              "",
              "static const struct fsnotify_ops fsnotify_ops = {",
              "\t.handle_event = susfs_handle_sdcard_event_419,",
              "};",
              "#endif",
          ])
          if modern_handler not in x:
              raise SystemExit("2.3.0 fsnotify_ops block missing")
          x = x.replace(modern_handler, old_handler, 1)
          p.write_text(x)

          for p in [
              Path("fs/readdir.c"),
              Path("fs/dcache.c"),
              Path("fs/namei.c"),
              Path("fs/notify/fdinfo.c"),
              Path("fs/proc/fd.c"),
              Path("fs/proc/task_mmu.c"),
              Path("fs/stat.c"),
              Path("fs/statfs.c"),
          ]:
              x = p.read_text()
              x = x.replace(
                  "current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC",
                  "susfs_is_current_proc_umounted_app()",
              )
              x = x.replace(
                  "dentry->d_inode->i_state & INODE_STATE_SUS_PATH",
                  "dentry->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &dentry->d_inode->i_mapping->flags)",
              )
              x = x.replace(
                  "inode->i_state & INODE_STATE_SUS_PATH",
                  "inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &inode->i_mapping->flags)",
              )
              x = x.replace(
                  "inode->i_state & INODE_STATE_SUS_MOUNT",
                  "inode->i_mapping && test_bit(AS_FLAGS_SUS_MOUNT, &inode->i_mapping->flags)",
              )
              x = x.replace(
                  "inode->i_state & INODE_STATE_SUS_KSTAT",
                  "inode->i_mapping && test_bit(AS_FLAGS_SUS_KSTAT, &inode->i_mapping->flags)",
              )
              # Generic text conversion cannot infer the local variable in
              # statfs.c.  Its original expression is rooted at s->s_root.
              x = x.replace(
                  "s->s_root->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_MOUNT, &inode->i_mapping->flags)",
                  "s->s_root->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_MOUNT, &s->s_root->d_inode->i_mapping->flags)",
              )
              p.write_text(x)

          # Trial 4 showed that generic replacement correctly changed the
          # state model but could not infer four local object roots in
          # namei.c. Repair those exact Samsung 4.19 contexts.
          p = Path("fs/namei.c")
          x = p.read_text()
          x = x.replace(
              "link->dentry->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &dentry->d_inode->i_mapping->flags)",
              "link->dentry->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &link->dentry->d_inode->i_mapping->flags)",
          )
          x = x.replace(
              "nd->inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &inode->i_mapping->flags)",
              "nd->inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &nd->inode->i_mapping->flags)",
          )
          x = x.replace(
              "path->dentry->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &dentry->d_inode->i_mapping->flags)",
              "path->dentry->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &path->dentry->d_inode->i_mapping->flags)",
          )
          x = x.replace(
              "child->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &inode->i_mapping->flags)",
              "child->d_inode->i_mapping && test_bit(AS_FLAGS_SUS_PATH, &child->d_inode->i_mapping->flags)",
          )

          # OPEN_REDIRECT also moved from inode->i_state to
          # inode->i_mapping->flags in 2.3.0.
          x = x.replace(
              "filp->f_inode->i_state & INODE_STATE_OPEN_REDIRECT",
              "filp->f_inode->i_mapping && test_bit(AS_FLAGS_OPEN_REDIRECT, &filp->f_inode->i_mapping->flags)",
          )
          p.write_text(x)

          # On 4.19 only the handle_event adapter is referenced. Keep the
          # modern handler compiled only on kernels whose fsnotify_ops has
          # handle_inode_event, avoiding -Werror=unused-function.
          p = Path("fs/susfs.c")
          x = p.read_text()
          sig = "static int susfs_handle_sdcard_inode_event(struct fsnotify_mark *mark, u32 mask,"
          if sig not in x:
              raise SystemExit("modern sdcard handler signature missing")
          start = x.index(sig)
          ops_guard = "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\nstatic const struct fsnotify_ops fsnotify_ops = {"
          guardpos = x.index(ops_guard, start)
          x = x[:start] + "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n" + x[start:guardpos] + x[guardpos:].replace(
              ops_guard,
              "static const struct fsnotify_ops fsnotify_ops = {",
              1,
          )
          # The existing adapter block's #else now pairs with this guard.
          p.write_text(x)

          print("Applied Samsung 4.19 interfaces for official SUSFS 2.3.0")
          PY

          grep -q '#include <linux/cred.h>' include/linux/susfs_def.h
          grep -q '#include <linux/security.h>' fs/susfs.c
          grep -q 'handle_event = susfs_handle_sdcard_event_419' fs/susfs.c
          grep -q 'DEFAULT_SUS_MNT_ID DEFAULT_KSU_MNT_ID' include/linux/susfs_def.h
          legacy_scan=(
            fs/dcache.c
            fs/namei.c
            fs/notify/fdinfo.c
            fs/proc/fd.c
            fs/proc/task_mmu.c
            fs/readdir.c
            fs/stat.c
            fs/statfs.c
          )
          ! grep -n 'TASK_STRUCT_NON_ROOT_USER_APP_PROC' "${legacy_scan[@]}"
          ! grep -n 'INODE_STATE_SUS_PATH' "${legacy_scan[@]}"
          ! grep -n 'INODE_STATE_SUS_MOUNT' "${legacy_scan[@]}"
          ! grep -n 'INODE_STATE_SUS_KSTAT' "${legacy_scan[@]}"
          grep -q 'AS_FLAGS_SUS_KSTAT' fs/notify/fdinfo.c
          grep -q 'AS_FLAGS_SUS_KSTAT' fs/proc/task_mmu.c
          grep -q 'AS_FLAGS_SUS_KSTAT' fs/stat.c
          grep -q '&s->s_root->d_inode->i_mapping->flags' fs/statfs.c
          ! grep -nE '&dentry->d_inode->i_mapping->flags|&inode->i_mapping->flags' fs/namei.c
          ! grep -n 'INODE_STATE_OPEN_REDIRECT' fs/namei.c
          grep -q 'AS_FLAGS_OPEN_REDIRECT' fs/namei.c
          grep -q 'test_bit(AS_FLAGS_SUS_PATH, &link->dentry->d_inode->i_mapping->flags)' fs/namei.c
          grep -q 'test_bit(AS_FLAGS_SUS_PATH, &nd->inode->i_mapping->flags)' fs/namei.c
          grep -q 'test_bit(AS_FLAGS_SUS_PATH, &path->dentry->d_inode->i_mapping->flags)' fs/namei.c
          grep -q 'test_bit(AS_FLAGS_SUS_PATH, &child->d_inode->i_mapping->flags)' fs/namei.c

          mkdir -p .ci/stage5
          {
            echo "Stage 5 Trial 7 Samsung 4.19 compatibility bridge"
            echo "cred include: yes"
            echo "security include: yes"
            echo "4.19 fsnotify handle_event adapter: yes"
            echo "legacy task/inode SUSFS state converted: yes"
            echo "legacy mount-ID names bridged to 2.3.0 KSU IDs: yes"
          } > .ci/stage5/trial7-samsung419-bridge.txt

      - name: Retire obsolete 1.5.7 callsites exposed at Trial 5 link
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          obsolete = {
              "fs/stat.c": ["susfs_sus_ino_for_generic_fillattr"],
              "fs/readdir.c": ["susfs_sus_ino_for_filldir64"],
              "fs/proc/task_mmu.c": ["susfs_sus_ino_for_show_map_vma"],
              "fs/namei.c": ["susfs_get_redirected_path"],
              "fs/namespace.c": [
                  "susfs_auto_add_sus_ksu_default_mount",
                  "susfs_auto_add_sus_bind_mount",
              ],
          }

          for fn, symbols in obsolete.items():
              p = Path(fn)
              x = p.read_text()
              for sym in symbols:
                  while sym in x:
                      # Find the nearest enclosing simple CONFIG_KSU_SUSFS block.
                      spos = x.find(sym)
                      starts = [x.rfind("#ifdef CONFIG_KSU_SUSFS_", 0, spos),
                                x.rfind("#if defined(CONFIG_KSU_SUSFS_", 0, spos)]
                      start = max(starts)
                      if start < 0:
                          raise SystemExit(f"No SUSFS block start for {sym} in {fn}")
                      end = x.find("#endif", spos)
                      if end < 0:
                          raise SystemExit(f"No SUSFS block end for {sym} in {fn}")
                      end = x.find("\n", end)
                      if end < 0:
                          end = len(x)
                      else:
                          end += 1
                      x = x[:start] + x[end:]
              p.write_text(x)

          p = Path("fs/namespace.c")
          x = p.read_text()
          marker = "/* susfs_stage5_trial6_non_sus_mount_bridge */"
          if marker not in x:
              insert = (
                  "\n#ifdef CONFIG_KSU_SUSFS\n"
                  "/* susfs_stage5_trial6_non_sus_mount_bridge */\n"
                  "int susfs_get_non_sus_mnt_id_from_mnt(struct mount *orig_mnt)\n"
                  "{\n"
                  "\treturn orig_mnt ? orig_mnt->mnt_id : 0;\n"
                  "}\n\n"
                  "struct vfsmount *susfs_get_non_sus_vfsmnt_from_vfsmnt(struct vfsmount *vfsmnt)\n"
                  "{\n"
                  "\tif (!vfsmnt)\n"
                  "\t\treturn NULL;\n"
                  "\treturn mntget(vfsmnt);\n"
                  "}\n"
                  "#endif\n\n"
              )
              pos = x.find("unsigned int sysctl_mount_max")
              if pos < 0:
                  raise SystemExit("namespace insertion anchor missing")
              x = x[:pos] + insert + x[pos:]
          p.write_text(x)

          print("Retired Trial-5 legacy link callsites and installed 4.19 mount compile bridge")
          PY

          obsolete_symbols=(
            susfs_sus_ino_for_generic_fillattr
            susfs_sus_ino_for_filldir64
            susfs_sus_ino_for_show_map_vma
            susfs_get_redirected_path
            susfs_auto_add_sus_ksu_default_mount
            susfs_auto_add_sus_bind_mount
          )
          for sym in "${obsolete_symbols[@]}"; do
            if grep -n "$sym" fs/stat.c fs/readdir.c fs/proc/task_mmu.c fs/namei.c fs/namespace.c; then
              echo "::error::Legacy 1.5.7 symbol survived: $sym"
              exit 1
            fi
          done

          grep -q 'susfs_stage5_trial6_non_sus_mount_bridge' fs/namespace.c
          grep -q 'int susfs_get_non_sus_mnt_id_from_mnt' fs/namespace.c
          grep -q 'struct vfsmount \*susfs_get_non_sus_vfsmnt_from_vfsmnt' fs/namespace.c

          {
            echo "Stage 5 Trial 6"
            echo "Trial 5 reached vmlinux link."
            echo "Obsolete 1.5.7 exported-helper callsites retired."
            echo "2.3.0 non-SUS mount helpers use a conservative Samsung 4.19 compile bridge."
            echo "NOT A FLASH CANDIDATE: final 2.3.0 mount semantics still pending."
          } > .ci/stage5/trial6-link-bridge.txt

      - name: Clean orphaned 1.5.7 labels and declarations
