      - name: Remove Stage 2 handled reject files
        run: |
          set -euxo pipefail

          rm -f \
            include/linux/sched.h.rej \
            include/linux/mount.h.rej \
            fs/dcache.c.rej \
            fs/proc/task_mmu.c.rej \
            fs/namei.c.rej \
            fs/notify/fdinfo.c.rej \
            fs/overlayfs/readdir.c.rej \
            fs/readdir.c.rej \
            fs/namespace.c.rej

          echo "=== REMAINING REJECT FILES ==="

          find . \
            -name '*.rej' \
            -print \
            | sort

      - name: Verify Stage 2 adaptations
        run: |
          set -euxo pipefail

          grep -n \
            "may_create_susfs_samsung419" \
            fs/namei.c

          grep -n \
            "fdinfo_susfs_samsung419" \
            fs/notify/fdinfo.c

          grep -n \
            "ovl_susfs_samsung419" \
            fs/overlayfs/readdir.c

          grep -n \
            "compat_fillonedir_susfs_samsung419" \
            fs/readdir.c

          grep -n \
            "susfs_task_state" \
            include/linux/sched.h

          grep -n \
            "susfs_mnt_id_backup" \
            include/linux/mount.h

          REJECT_COUNT="$(
            find . \
              -name '*.rej' \
              -type f \
              | wc -l
          )"

          echo "Remaining reject count: $REJECT_COUNT"

          test "$REJECT_COUNT" -eq 0

          git diff --check

      - name: Generate Stage 2 patch
        run: |
          set -euxo pipefail

          git diff --binary \
            > /tmp/M127F-SUSFS-Stage3-SamsungKDP.patch

          git status --short \
            > /tmp/M127F-SUSFS-Stage3-status.txt

          find . \
            -name '*.rej' \
            -print \
            -exec cat {} \; \
            > /tmp/M127F-SUSFS-Stage3-remaining-rejects.txt

          git diff --stat \
            > /tmp/M127F-SUSFS-Stage3-diff-stat.txt

          echo "=== STAGE 3 DIFF STAT ==="
          cat /tmp/M127F-SUSFS-Stage3-diff-stat.txt

          echo
          echo "=== REMAINING REJECT ==="
          cat /tmp/M127F-SUSFS-Stage3-remaining-rejects.txt

      - name: Upload Stage 2 result
        uses: actions/upload-artifact@v4
        with:
          name: m127f-susfs-stage3-samsung-kdp
          path: |
            /tmp/M127F-SUSFS-Stage3-SamsungKDP.patch
            /tmp/M127F-SUSFS-Stage3-status.txt
            /tmp/M127F-SUSFS-Stage3-remaining-rejects.txt
            /tmp/M127F-SUSFS-Stage3-diff-stat.txt
          if-no-files-found: error
          retention-days: 7
