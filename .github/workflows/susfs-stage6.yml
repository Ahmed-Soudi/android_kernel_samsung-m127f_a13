          if 'KSUD_PATH " services\\n"' not in w:
              raise SystemExit("Trial92: ksud services command missing near marker")
          print("Trial92: FBE zygote-start -> ksud services source audit passed")
          PY92AUDIT

          cat /tmp/trial92-fbe-zygote-services.patch \
