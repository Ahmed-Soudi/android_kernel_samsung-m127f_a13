name: SUSFS Samsung 4.19 Stage 6 - Trial 101

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - ksun-3.3.0-ps5-susfs230
    paths:
      - ".github/workflows/susfs-stage6.yml"

# Trial 101 fixes the Trial 98 GitHub Actions trigger mistake.
# workflow_dispatch alone cannot auto-run on a branch push; this workflow now
# runs when .github/workflows/susfs-stage6.yml is committed to the active branch.

jobs:
  trial101:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore exact Trial 92 green source
        run: |
          set -euxo pipefail

          # Trial 101 starts from the exact disposable Trial 92 source commit
          # that was runtime-green on this M127F. This freezes the SUSFS
          # backport and avoids the moving upstream 2.3.0 branch.
          git fetch origin ci-susfs-stage6-trial92-35934393973
          git reset --hard c9022cdf5d640d267068172fba54c12e7d58103c
          git submodule update --init --recursive

          test "$(git rev-parse HEAD)" = \
            "c9022cdf5d640d267068172fba54c12e7d58103c"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

          test -s .ci/stage5/build-ksun-stage5.yml
          test -s .github/patches/stage5-ksun-susfs-compile-probe.patch

      - name: Trial 101 backport ptrace stop-state lifetime fix
        shell: bash
        run: |
          set -euxo pipefail

          # Evidence from VexZygisk debug:
          # app_process64 reaches Vex's deliberate __libc_init GOT fault at
          # 0xfffffffffffffff0, but the ptrace transaction does not recover.
          # Upstream ptrace maintainers later fixed stale ptrace_message state
          # because event payloads could survive into unrelated ptrace stops.
          #
          # ONE Trial98 functional change:
          # clear ptrace_message on attach, resume and detach so each ptrace
          # transaction starts with clean event state.
          #
          # Trial92 KSUN/FBE timing, SUSFS, PS5 UAC1 and all other source are
          # preserved exactly.

          python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/ptrace.c")
          s = p.read_text()

          marker = "trial101_ptrace_state_lifetime_fix"
          if marker in s:
              raise SystemExit("Trial98 marker already present")

          old = """\tif (seize)\n\t\tflags |= PT_SEIZED;\n\ttask->ptrace = flags;\n\n\tptrace_link(task, current);\n"""
          new = """\tif (seize)\n\t\tflags |= PT_SEIZED;\n\ttask->ptrace = flags;\n\n\t/* trial101_ptrace_state_lifetime_fix: do not inherit stale event state */\n\ttask->ptrace_message = 0;\n\n\tptrace_link(task, current);\n"""
          if s.count(old) != 1:
              raise SystemExit("Trial98: ptrace_attach anchor mismatch")
          s = s.replace(old, new, 1)

          old = """\tif (need_siglock)\n\t\tspin_lock_irq(&child->sighand->siglock);\n\tchild->exit_code = data;\n\twake_up_state(child, __TASK_TRACED);\n"""
          new = """\tif (need_siglock)\n\t\tspin_lock_irq(&child->sighand->siglock);\n\t/* trial101_ptrace_state_lifetime_fix */\n\tchild->ptrace_message = 0;\n\tchild->exit_code = data;\n\twake_up_state(child, __TASK_TRACED);\n"""
          if s.count(old) != 1:
              raise SystemExit("Trial98: ptrace_resume anchor mismatch")
          s = s.replace(old, new, 1)

          old = """\t/*\n\t * tasklist_lock avoids the race with wait_task_stopped(), see\n\t * the comment in ptrace_resume().\n\t */\n\tchild->exit_code = data;\n\t__ptrace_detach(current, child);\n"""
          new = """\t/*\n\t * tasklist_lock avoids the race with wait_task_stopped(), see\n\t * the comment in ptrace_resume().\n\t */\n\t/* trial101_ptrace_state_lifetime_fix */\n\tchild->ptrace_message = 0;\n\tchild->exit_code = data;\n\t__ptrace_detach(current, child);\n"""
          if s.count(old) != 1:
              raise SystemExit("Trial98: ptrace_detach anchor mismatch")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          grep -n -A5 -B5 'trial101_ptrace_state_lifetime_fix' kernel/ptrace.c
          test "$(grep -c 'trial101_ptrace_state_lifetime_fix' kernel/ptrace.c)" -eq 3

          mkdir -p .ci/trial101
          git diff -- kernel/ptrace.c > .ci/trial101/ptrace-state-lifetime-fix.patch
          test -s .ci/trial101/ptrace-state-lifetime-fix.patch

      - name: Trial 101 fix SUSFS SUS_MAP macro precedence for clang 11
        shell: bash
        run: |
          set -euxo pipefail

          # Trial 99 proved the ptrace patch itself applies. The build stopped
          # in fs/proc/task_mmu.c because SUSFS_IS_INODE_SUS_MAP expands to a
          # bare && chain and is negated inside || expressions. Clang 11 emits
          # -Wlogical-op-parentheses, and this kernel treats warnings as errors.
          #
          # Single Trial101 compile fix: wrap the complete macro expression.
          # Boolean behavior is unchanged.

          python3 - <<'PY101'
          from pathlib import Path

          p = Path("include/linux/susfs_def.h")
          t = p.read_text()

          old = (
              "#define SUSFS_IS_INODE_SUS_MAP(inode) \\\n"
              "\t\tinode && inode->i_mapping && \\\n"
              "\t\tunlikely(test_bit(AS_FLAGS_SUS_MAP, &inode->i_mapping->flags)) && \\\n"
              "\t\tsusfs_is_current_proc_umounted_app()\n"
          )
          new = (
              "#define SUSFS_IS_INODE_SUS_MAP(inode) \\\n"
              "\t\t((inode) && (inode)->i_mapping && \\\n"
              "\t\t unlikely(test_bit(AS_FLAGS_SUS_MAP, &(inode)->i_mapping->flags)) && \\\n"
              "\t\t susfs_is_current_proc_umounted_app())\n"
          )

          count = t.count(old)
          if count != 1:
              raise SystemExit(
                  "Trial101: expected exactly one SUSFS_IS_INODE_SUS_MAP macro, "
                  f"got {count}"
              )

          p.write_text(t.replace(old, new, 1))
          PY101

          grep -n -A5 -B2 'SUSFS_IS_INODE_SUS_MAP' include/linux/susfs_def.h
          grep -q '((inode) && (inode)->i_mapping' include/linux/susfs_def.h
          git diff --check

          mkdir -p .ci/trial101
          git diff -- include/linux/susfs_def.h             > .ci/trial101/susfs-sus-map-macro-precedence.patch
          test -s .ci/trial101/susfs-sus-map-macro-precedence.patch

      - name: Prepare Trial 101 build recipe
        run: |
          set -euxo pipefail

          cp .ci/stage5/build-ksun-stage5.yml /tmp/trial101-build.yml

          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/trial101-build.yml")
          s = p.read_text()
          old = "M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL92-FBE-ZYGOTE-SERVICES"
          new = "M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL101-PTRACE-STATE-FIX"
          if old not in s:
              raise SystemExit("Trial98: Trial92 artifact name not found in pinned recipe")
          s = s.replace(old, new)
          p.write_text(s)
          PY

          grep -q 'TRIAL101-PTRACE-STATE-FIX' /tmp/trial101-build.yml

      - name: Execute pinned Trial 92 build recipe with Trial 101 ptrace fix
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          wf = yaml.safe_load(Path("/tmp/trial101-build.yml").read_text())
          jobs = wf.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"expected one build job, got {list(jobs)}")

          steps = next(iter(jobs.values())).get("steps", [])
          chunks = ["#!/usr/bin/env bash", "set -euo pipefail", ""]
          for idx, step in enumerate(steps, 1):
              name = step.get("name", f"step-{idx}")
              script = step.get("run")
              if script is None:
                  print(f"skip action-only step: {name}")
                  continue
              chunks += [
                  f'echo "===== Trial 101: {name} ====="',
                  script,
                  "",
              ]
          Path("/tmp/trial101-build.sh").write_text("\n".join(chunks))
          PY

          chmod +x /tmp/trial101-build.sh
          bash /tmp/trial101-build.sh

          test -s M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL101-PTRACE-STATE-FIX.zip
          test -s arch/arm64/boot/Image

      - name: Verify Trial 101 invariants
        run: |
          set -euxo pipefail

          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

          grep -q 'trial101_ptrace_state_lifetime_fix' kernel/ptrace.c
          grep -q 'susfs_stage6_trial92_fbe_zygote_services' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch

          ! grep -R -q 'prezygote_services' KernelSU-Next/kernel \
            .github/patches/stage5-ksun-susfs-compile-probe.patch

          grep -q 'CONFIG_USB_CONFIGFS_F_UAC1=y' /tmp/trial101-build.yml
          grep -q 'CONFIG_USB_F_UAC1=y' /tmp/trial101-build.yml
          grep -q 'CONFIG_USB_U_AUDIO=y' /tmp/trial101-build.yml

          {
            echo "Trial 101"
            echo "base=c9022cdf5d640d267068172fba54c12e7d58103c (Trial92 runtime-green)"
            echo "single_change=ptrace_message lifetime reset on attach/resume/detach"
            echo "ksun=3b18216f71df189ab3d1b1ce0bdb21be1268e771"
            echo "susfs=Trial92 pinned 2.3.0 Samsung 4.19 backport"
            echo "fbe_trigger=Trial92 zygote-start preserved"
            echo "ps5_uac1=preserved"
            sha256sum arch/arm64/boot/Image
            sha256sum M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL101-PTRACE-STATE-FIX.zip
          } | tee .ci/trial101/manifest.txt

      - name: Upload Trial 101 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL101-PTRACE-STATE-FIX
          if-no-files-found: warn
          compression-level: 0
          path: |
            M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL101-PTRACE-STATE-FIX.zip
            arch/arm64/boot/Image
            System.map
            .config
            .ci/trial101/
