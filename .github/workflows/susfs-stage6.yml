          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/proc/task_mmu.c")
          t = p.read_text()

          fixes = [
              (
                  "!SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))",
                  "!(SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))))",
              ),
