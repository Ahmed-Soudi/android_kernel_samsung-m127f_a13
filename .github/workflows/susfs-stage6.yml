      - name: Audit official SUSFS 2.3.0 semantic delta
        run: |
          set -euxo pipefail
          rm -rf .ci/stage5/official230
          mkdir -p .ci/stage5/official230/src

          # Trial 8 used guessed raw patch filenames and GitLab returned 404.
          # Fetch the official branch archive instead, then discover the exact
          # patch paths from the archive so filename changes cannot break us.
          curl -fL --retry 3             'https://gitlab.com/simonpunk/susfs4ksu/-/archive/gki-android13-5.15/susfs4ksu-gki-android13-5.15.tar.gz'             -o .ci/stage5/official230/upstream.tar.gz

          tar -xzf .ci/stage5/official230/upstream.tar.gz             -C .ci/stage5/official230/src --strip-components=1

          # Do not assume the branch keeps the kernel version in the patch
          # filename. Trial 9 proved the archive is valid but this overly
          # specific "*5.15*" filename filter returned nothing.
          mapfile -t kernel_patches < <(find .ci/stage5/official230/src/kernel_patches -maxdepth 1 -type f -name '50_add_susfs_in_*.patch' -print | sort)
          mapfile -t ksu_patches < <(find .ci/stage5/official230/src/kernel_patches/KernelSU -maxdepth 1 -type f -name '10_enable_susfs_for_ksu*.patch' -print | sort)

          printf 'kernel patch candidates:\n%s\n' "${kernel_patches[*]}"
          printf 'KSU patch candidates:\n%s\n' "${ksu_patches[*]}"

          if [ "${#kernel_patches[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one official 50_add_susfs_in_* patch, found ${#kernel_patches[@]}"
            find .ci/stage5/official230/src/kernel_patches -maxdepth 2 -type f -print | sort
            exit 1
          fi
          if [ "${#ksu_patches[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one official KernelSU integration patch, found ${#ksu_patches[@]}"
            find .ci/stage5/official230/src/kernel_patches/KernelSU -maxdepth 1 -type f -print | sort
            exit 1
          fi

          kernel_patch="${kernel_patches[0]}"
          ksu_patch="${ksu_patches[0]}"

          cp "$kernel_patch" .ci/stage5/official230/kernel.patch
          cp "$ksu_patch" .ci/stage5/official230/ksu.patch

          required=(TIF_PROC_UMOUNTED TIF_PROC_NO_SU SUS_MAP zygote_next ksu_handle_faccessat ksu_handle_stat OPEN_REDIRECT hide_sus_mnts_for_non_su_procs susfs_get_non_sus_mnt_id_from_mnt susfs_get_non_sus_vfsmnt_from_vfsmnt)
          : > .ci/stage5/trial12-semantic-audit.txt
          # This is an inventory, not a compatibility assertion. Trial 11
          # proved that assuming every expected concept still appears under
          # the same symbol name is wrong (TIF_PROC_NO_SU is absent from these
          # two current official patch files). Record zeroes and continue.
          for sym in "${required[@]}"; do
            count=$( { grep -h -F "$sym" .ci/stage5/official230/kernel.patch .ci/stage5/official230/ksu.patch || true; } | wc -l )
            printf '%-48s %s\n' "$sym" "$count" | tee -a .ci/stage5/trial12-semantic-audit.txt
          done

          {
            echo
            echo '===== ABSENT REQUESTED MARKERS (INFORMATIONAL) ====='
            while read -r sym count; do
              if [ "$count" = "0" ]; then
                echo "$sym"
              fi
            done < .ci/stage5/trial12-semantic-audit.txt
          } >> .ci/stage5/trial12-semantic-audit.txt

          {
            echo '===== DISCOVERED OFFICIAL FILES ====='
            echo "kernel_patch=$kernel_patch"
            echo "ksu_patch=$ksu_patch"
            echo
            echo '===== OFFICIAL 2.3.0 FOCUSED CONTEXT ====='
            grep -n -C 16 -E 'susfs_get_non_sus_mnt_id_from_mnt|susfs_get_non_sus_vfsmnt_from_vfsmnt|hide_sus_mnts_for_non_su_procs|TIF_PROC_UMOUNTED|TIF_PROC_NO_SU|zygote_next|SUS_MAP|OPEN_REDIRECT|ksu_handle_faccessat|ksu_handle_stat'               .ci/stage5/official230/kernel.patch .ci/stage5/official230/ksu.patch || true
          } > .ci/stage5/trial12-official230-focused-context.txt

          {
            echo '===== SAMSUNG 4.19 CURRENT INVENTORY ====='
            for sym in "${required[@]}"; do
              echo "--- $sym ---"
              grep -R -n -F "$sym" fs include KernelSU-Next/kernel --include='*.c' --include='*.h' --include='Kconfig' 2>/dev/null || true
            done
            echo '===== TEMP BRIDGES ====='
            grep -R -n -E 'susfs_stage5_trial6_non_sus_mount_bridge|DEFAULT_SUS_MNT_ID DEFAULT_KSU_MNT_ID|DEFAULT_SUS_MNT_GROUP_ID DEFAULT_KSU_MNT_GROUP_ID|DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE'               fs include KernelSU-Next 2>/dev/null || true
          } > .ci/stage5/trial12-samsung419-semantic-inventory.txt

          grep -q 'susfs_stage5_trial6_non_sus_mount_bridge' fs/namespace.c
          printf '%s\n'             'Stage 5 Trial 12'             'Official SUSFS 2.3.0 semantic audit captured from branch archive.'             'Green Trial 7 compile baseline preserved.'             'NOT A FLASH CANDIDATE.'             > .ci/stage5/trial12-status.txt

      - name: Port official 2.3.0 non-SUS mount lookup to Samsung KDP 4.19
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path("fs/namespace.c")
          x = p.read_text()

          marker = "/* susfs_stage5_trial6_non_sus_mount_bridge */"
          m = x.find(marker)
          if m < 0:
              raise SystemExit("Trial-6 temporary mount bridge marker missing")

          start = x.rfind("#ifdef CONFIG_KSU_SUSFS", 0, m)
          end = x.find("#endif", m)
          if start < 0 or end < 0:
              raise SystemExit("temporary bridge bounds missing")
          end = x.find("\n", end)
          end = len(x) if end < 0 else end + 1

          real = textwrap.dedent(r"""
          #if defined(CONFIG_KSU_SUSFS) && defined(CONFIG_KSU_SUSFS_SUS_MOUNT)
          /* susfs_stage5_trial13_non_sus_mount_semantics */
          /* susfs_stage6_trial34_gate_non_sus_mount_helpers */
          static inline struct vfsmount *susfs_mount_to_vfsmnt_419(struct mount *mnt)
          {
          #ifdef CONFIG_KDP_NS
          	return mnt->mnt;
          #else
          	return &mnt->mnt;
          #endif
          }

          int susfs_get_non_sus_mnt_id_from_mnt(struct mount *orig_mnt)
          {
          	struct mount *mnt = orig_mnt;
          	int mnt_id;

          	if (!mnt)
          		return 0;
          	if (mnt->mnt_id < DEFAULT_KSU_MNT_ID)
          		return mnt->mnt_id;

          	lock_mount_hash();
          	for (; mnt && mnt->mnt_parent && mnt != mnt->mnt_parent &&
          	       mnt->mnt_id >= DEFAULT_KSU_MNT_ID;
          	     mnt = mnt->mnt_parent)
          		;
          	mnt_id = mnt ? mnt->mnt_id : 0;
          	unlock_mount_hash();
          	return mnt_id;
          }

          struct vfsmount *susfs_get_non_sus_vfsmnt_from_vfsmnt(struct vfsmount *vfsmnt)
          {
          	struct mount *mnt;
          	struct vfsmount *result;

          	if (!vfsmnt)
          		return NULL;
          	mnt = real_mount(vfsmnt);
          	if (!mnt)
          		return vfsmnt;

          	if (mnt->mnt_id < DEFAULT_KSU_MNT_ID) {
          		result = susfs_mount_to_vfsmnt_419(mnt);
          		mntget(result);
          		dget(result->mnt_root);
          		return result;
          	}

          	lock_mount_hash();
          	for (; mnt && mnt->mnt_parent && mnt != mnt->mnt_parent &&
          	       mnt->mnt_id >= DEFAULT_KSU_MNT_ID;
          	     mnt = mnt->mnt_parent)
          		;

          	if (!mnt) {
          		unlock_mount_hash();
          		return vfsmnt;
          	}

          	result = susfs_mount_to_vfsmnt_419(mnt);
          	mntget(result);
          	if (!result->mnt_root || IS_ERR(result->mnt_root)) {
          		mntput(result);
          		unlock_mount_hash();
          		return vfsmnt;
          	}
          	dget(result->mnt_root);
          	unlock_mount_hash();
          	return result;
          }
          #endif
          """).lstrip()

          x = x[:start] + real + x[end:]
          p.write_text(x)
          PY

          ! grep -q 'susfs_stage5_trial6_non_sus_mount_bridge' fs/namespace.c
          grep -q 'susfs_stage5_trial13_non_sus_mount_semantics' fs/namespace.c
          grep -q 'susfs_stage6_trial34_gate_non_sus_mount_helpers' fs/namespace.c
          grep -q '#if defined(CONFIG_KSU_SUSFS) && defined(CONFIG_KSU_SUSFS_SUS_MOUNT)' fs/namespace.c
