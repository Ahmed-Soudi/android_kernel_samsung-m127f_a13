      - name: Trial 78 retain SPOOF_UNAME 2.3.0 static-key caller fix
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("kernel/sys.c")
          t = p.read_text()

          # Current SUSFS 2.3.0 moved the "is a spoof buffer configured?"
          # guard to the newuname() caller.  The legacy 4.19 hook calls
          # susfs_spoof_uname() unconditionally; paired with the 2.3.0
          # implementation that would copy the initially-zero my_uname buffer
          # into tmp on every uname() call.
          #
          # Restore the current caller contract on Samsung 4.19:
          #   DECLARE_STATIC_KEY_FALSE(...)
          #   if (static_branch_unlikely(&key))
          #       susfs_spoof_uname(&tmp);

          if "#include <linux/jump_label.h>" not in t:
              inc = "#include <linux/utsname.h>\n"
              if inc not in t:
                  raise SystemExit("Trial74: utsname include anchor missing")
              t = t.replace(inc, inc + "#include <linux/jump_label.h>\n", 1)

          old_decl = (
              "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
              "extern void susfs_spoof_uname(struct new_utsname* tmp);\n"
              "#endif"
          )
          new_decl = (
              "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
              "DECLARE_STATIC_KEY_FALSE(susfs_is_uname_spoof_buffer_set);\n"
              "extern void susfs_spoof_uname(struct new_utsname* tmp);\n"
              "#endif"
          )
          if "DECLARE_STATIC_KEY_FALSE(susfs_is_uname_spoof_buffer_set);" not in t:
              if old_decl not in t:
                  raise SystemExit("Trial74: legacy SPOOF_UNAME declaration block missing")
              t = t.replace(old_decl, new_decl, 1)

          f_start = t.find("SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)")
          f_end = t.find("#ifdef __ARCH_WANT_SYS_OLD_UNAME", f_start)
          if f_start < 0 or f_end < 0:
              raise SystemExit("Trial74: newuname function range missing")

          fn = t[f_start:f_end]

          # Remove the legacy/current SUSFS uname call block from this function
          # so it can be reinserted at one canonical Samsung-4.19 location.
          call_rx = re.compile(
              r"#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\s*"
              r"(?:if\s*\(\s*static_branch_unlikely\s*\(\s*&susfs_is_uname_spoof_buffer_set\s*\)\s*\)\s*)?"
              r"susfs_spoof_uname\s*\(\s*&tmp\s*\)\s*;\s*"
              r"#endif\s*",
              re.S,
          )
          fn2, n = call_rx.subn("", fn, count=1)
          if n != 1:
              raise SystemExit(f"Trial74: expected one newuname SUSFS call block, found {n}")

          memcpy_anchor = "\tmemcpy(&tmp, utsname(), sizeof(tmp));\n"
          if memcpy_anchor not in fn2:
              raise SystemExit("Trial74: newuname memcpy anchor missing")

          gated = (
              "\tmemcpy(&tmp, utsname(), sizeof(tmp));\n"
              "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
              "\t/* susfs_stage6_trial86_uname_static_key_gate */\n"
              "\tif (static_branch_unlikely(&susfs_is_uname_spoof_buffer_set))\n"
              "\t\tsusfs_spoof_uname(&tmp);\n"
              "#endif\n"
          )
          fn2 = fn2.replace(memcpy_anchor, gated, 1)

          t = t[:f_start] + fn2 + t[f_end:]
          p.write_text(t)
          PY

          # The 2.3.0 implementation owns the key; the caller only declares it.
          grep -q 'DEFINE_STATIC_KEY_FALSE(susfs_is_uname_spoof_buffer_set)' fs/susfs.c
          grep -q 'DECLARE_STATIC_KEY_FALSE(susfs_is_uname_spoof_buffer_set)' kernel/sys.c
          grep -q 'susfs_stage6_trial86_uname_static_key_gate' kernel/sys.c
          grep -q 'static_branch_unlikely(&susfs_is_uname_spoof_buffer_set)' kernel/sys.c

          python3 - <<'PY'
          from pathlib import Path
          t = Path("kernel/sys.c").read_text()
          a = t.index("SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)")
          b = t.index("#ifdef __ARCH_WANT_SYS_OLD_UNAME", a)
          fn = t[a:b]

          if fn.count("susfs_spoof_uname(&tmp);") != 1:
              raise SystemExit("Trial74: newuname must contain exactly one SUSFS spoof call")
          if "if (static_branch_unlikely(&susfs_is_uname_spoof_buffer_set))" not in fn:
              raise SystemExit("Trial74: SPOOF_UNAME call is not static-key gated")
          if fn.index("susfs_stage6_trial86_uname_static_key_gate") > fn.index("up_read(&uts_sem);"):
              raise SystemExit("Trial74: uname gate must execute while the copied UTS snapshot is in the canonical pre-unlock region")

          print("Trial74: Samsung 4.19 uname caller now matches SUSFS 2.3.0 static-key contract")
          PY

          # Preserve the exact Trial73 split for a controlled runtime comparison.
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' arch/arm64/configs/exynos850-m12nsxx_defconfig
          ! grep -q '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y$' arch/arm64/configs/exynos850-m12nsxx_defconfig

          echo "Trial74: SPOOF_UNAME remains ON; only its legacy 4.19 caller semantics were repaired."

      - name: Trial 78 retain CMDLINE spoof 2.3.0 static-key caller fix
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("fs/proc/cmdline.c")
          t = p.read_text()

          # Current SUSFS keeps fake_cmdline_or_bootconfig == NULL until
          # userspace configures a spoof value. Therefore the old 4.19
          # unconditional caller contract is unsafe. Current 2.3.x gates the
          # call with susfs_is_fake_cmdline_or_bootconfig_buffer_set.
          if "#include <linux/jump_label.h>" not in t:
              inc = "#include <linux/seq_file.h>\n"
              if inc not in t:
                  raise SystemExit("Trial75: seq_file include anchor missing")
              t = t.replace(inc, inc + "#include <linux/jump_label.h>\n", 1)

          # Canonical declaration: current core defines the key and proc/cmdline
          # only declares it.
          decl_rx = re.compile(
              r"\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\s*"
              r"(?:DECLARE_STATIC_KEY_FALSE\(susfs_is_fake_cmdline_or_bootconfig_buffer_set\);\s*)?"
              r"extern\s+(?:int|void)\s+susfs_spoof_cmdline_or_bootconfig"
              r"\s*\(\s*struct seq_file \*m\s*\)\s*;\s*"
              r"#endif\s*",
              re.S,
          )
          t, _ = decl_rx.subn("\n", t, count=1)

          decl = (
              "\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
              "DECLARE_STATIC_KEY_FALSE(susfs_is_fake_cmdline_or_bootconfig_buffer_set);\n"
              "extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n"
              "#endif\n"
          )
          inc = "#include <linux/jump_label.h>\n"
          if "DECLARE_STATIC_KEY_FALSE(susfs_is_fake_cmdline_or_bootconfig_buffer_set);" not in t:
              if inc not in t:
                  raise SystemExit("Trial75: jump-label include anchor missing")
              t = t.replace(inc, inc + decl, 1)

          f_start = t.find("static int cmdline_proc_show(struct seq_file *m, void *v)")
          if f_start < 0:
              raise SystemExit("Trial75: cmdline_proc_show missing")
          brace = t.find("{", f_start)
          if brace < 0:
              raise SystemExit("Trial75: cmdline_proc_show opening brace missing")

          depth = 0
          f_end = -1
          for i in range(brace, len(t)):
              if t[i] == "{":
                  depth += 1
              elif t[i] == "}":
                  depth -= 1
                  if depth == 0:
                      f_end = i + 1
                      break
          if f_end < 0:
              raise SystemExit("Trial75: cmdline_proc_show closing brace missing")

          fn = t[f_start:f_end]

          # Remove the legacy 4.19 SUSFS block (or any already-current block)
          # from cmdline_proc_show and install one canonical 2.3.x block.
          block_rx = re.compile(
              r"#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG.*?#endif\s*",
              re.S,
          )
          fn_clean, n = block_rx.subn("", fn, count=1)
          if n > 1:
              raise SystemExit("Trial75: duplicate SUSFS cmdline blocks")

          body_anchor = "{\n"
          if body_anchor not in fn_clean:
              raise SystemExit("Trial75: cmdline show body anchor missing")

          gate = (
              "{\n"
              "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
              "\t/* susfs_stage6_trial86_cmdline_static_key_gate */\n"
              "\tif (static_branch_unlikely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n"
              "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n"
              "\t\tseq_putc(m, '\\n');\n"
              "\t\treturn 0;\n"
              "\t}\n"
              "#endif\n"
          )
          fn_clean = fn_clean.replace(body_anchor, gate, 1)
          t = t[:f_start] + fn_clean + t[f_end:]
          p.write_text(t)
          PY

          grep -q 'DEFINE_STATIC_KEY_FALSE(susfs_is_fake_cmdline_or_bootconfig_buffer_set)' fs/susfs.c
          grep -q 'DECLARE_STATIC_KEY_FALSE(susfs_is_fake_cmdline_or_bootconfig_buffer_set)' fs/proc/cmdline.c
          grep -q 'susfs_stage6_trial86_cmdline_static_key_gate' fs/proc/cmdline.c
          grep -q 'static_branch_unlikely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)' fs/proc/cmdline.c

          python3 - <<'PY'
          from pathlib import Path

          t = Path("fs/proc/cmdline.c").read_text()
          a = t.index("static int cmdline_proc_show(struct seq_file *m, void *v)")
          brace = t.index("{", a)
          depth = 0
          b = None
          for i in range(brace, len(t)):
              if t[i] == "{":
                  depth += 1
              elif t[i] == "}":
                  depth -= 1
                  if depth == 0:
                      b = i + 1
                      break
          if b is None:
              raise SystemExit("Trial75: cmdline function audit range missing")

          fn = t[a:b]
          if fn.count("susfs_spoof_cmdline_or_bootconfig(m);") != 1:
              raise SystemExit("Trial75: expected exactly one cmdline spoof call")
          if "if (static_branch_unlikely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set))" not in fn:
              raise SystemExit("Trial75: cmdline spoof call is not static-key gated")
          if "seq_puts(m, saved_command_line);" not in fn:
              raise SystemExit("Trial75: Samsung original cmdline fallback was lost")

          print("Trial76: retained Samsung 4.19 cmdline static-key caller contract")
          PY

          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' arch/arm64/configs/exynos850-m12nsxx_defconfig
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y$' arch/arm64/configs/exynos850-m12nsxx_defconfig

          echo "Trial75: both spoof features ON with current static-key caller semantics."

      - name: Trial 78 harden Samsung 4.19 sucompat VFS parity
        shell: bash
        run: |
          set -euxo pipefail

          # Add current_chrooted() parity guards to both Samsung-4.19
          # sucompat VFS bridge helpers. Also make stat rebuild its
          # struct filename only when an actual su->sh redirect occurs.
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path(".github/patches/stage5-ksun-susfs-compile-probe.patch")
          t = patch.read_text()

          bridge_anchor = "+/* susfs_stage5_trial21_samsung419_vfs_facessat_bridge\n"
          if bridge_anchor not in t:
              raise SystemExit("Trial82: Samsung419 sucompat bridge patch anchor missing")

          if "+extern bool current_chrooted(void);\n" not in t:
              t = t.replace(
                  bridge_anchor,
                  "+/* susfs_stage6_trial86_chroot_guard */\n"
                  "+extern bool current_chrooted(void);\n"
                  "+\n" + bridge_anchor,
                  1,
              )

          stat_old = (
              "+\tif (!ksu_is_allow_uid_for_current(current_uid().val))\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+\tif (strncpy_from_user(path, *filename_user, sizeof(path)) < 0)\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+\tif (unlikely(!memcmp(path, su_path, sizeof(su_path)))) {\n"
              "+\t\treplacement = userspace_stack_buffer(sh_path, sizeof(sh_path));\n"
              "+\t\tif (replacement)\n"
              "+\t\t\t*filename_user = replacement;\n"
              "+\t}\n"
              "+\treturn 0;\n"
              "+}\n"
              "+\n"
              "+int ksu_handle_faccessat_samsung419"
          )
          stat_new = (
              "+\tif (!ksu_is_allow_uid_for_current(current_uid().val))\n"
              "+\t\treturn 0;\n"
              "+\tif (current_chrooted())\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+\tif (strncpy_from_user(path, *filename_user, sizeof(path)) < 0)\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+\t/* susfs_stage6_trial86_stat_redirect_result */\n"
              "+\tif (unlikely(!memcmp(path, su_path, sizeof(su_path)))) {\n"
              "+\t\treplacement = userspace_stack_buffer(sh_path, sizeof(sh_path));\n"
              "+\t\tif (replacement) {\n"
              "+\t\t\t*filename_user = replacement;\n"
              "+\t\t\treturn 1;\n"
              "+\t\t}\n"
              "+\t}\n"
              "+\treturn 0;\n"
              "+}\n"
              "+\n"
              "+int ksu_handle_faccessat_samsung419"
          )
          if stat_old not in t:
              raise SystemExit("Trial82: stat bridge body anchor missing")
          t = t.replace(stat_old, stat_new, 1)

          fac_old = (
              "+\tif (!ksu_is_allow_uid_for_current(current_uid().val))\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+\tif (strncpy_from_user(path, *filename_user, sizeof(path)) < 0)\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+/* susfs_stage6_trial53_faccessat_redirect_result */"
          )
          fac_new = (
              "+\tif (!ksu_is_allow_uid_for_current(current_uid().val))\n"
              "+\t\treturn 0;\n"
              "+\tif (current_chrooted())\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+\tif (strncpy_from_user(path, *filename_user, sizeof(path)) < 0)\n"
              "+\t\treturn 0;\n"
              "+\n"
              "+/* susfs_stage6_trial53_faccessat_redirect_result */"
          )
          if fac_old not in t:
              raise SystemExit("Trial82: faccessat bridge body anchor missing")
          t = t.replace(fac_old, fac_new, 1)
          # The bridge edits above add lines inside an existing unified-diff
          # hunk. Trial78 left the original @@ old_count/new_count values intact,
          # so git apply rejected the patch as corrupt. Recalculate hunk lengths
          # mechanically without changing hunk start positions or patch content.
          lines = t.splitlines(keepends=True)
          out = []
          i = 0
          hunk_re = re.compile(
              r"^@@ -(?P<os>\d+)(?:,(?P<oc>\d+))? \+(?P<ns>\d+)(?:,(?P<nc>\d+))? @@(?P<tail>.*)$"
          )

          while i < len(lines):
              raw = lines[i]
              line = raw.rstrip("\r\n")
              m = hunk_re.match(line)
              if not m:
                  out.append(raw)
                  i += 1
                  continue

              body = []
              j = i + 1
              while j < len(lines):
                  probe = lines[j].rstrip("\r\n")
                  if probe.startswith("@@ ") or probe.startswith("diff --git "):
                      break
                  # File headers can only occur outside a hunk after its body,
                  # but stop defensively if we encounter them.
                  if probe.startswith("--- a/") and body:
                      break
                  body.append(lines[j])
                  j += 1

              old_count = 0
              new_count = 0
              for braw in body:
                  b = braw.rstrip("\r\n")
                  if b.startswith("\\ No newline at end of file"):
                      continue
                  if b.startswith("+"):
                      new_count += 1
                  elif b.startswith("-"):
                      old_count += 1
                  else:
                      # Unified-diff context line, including an empty context
                      # represented by a single leading space.
                      old_count += 1
                      new_count += 1

              hdr = (
                  f"@@ -{m.group('os')},{old_count} "
                  f"+{m.group('ns')},{new_count} @@{m.group('tail')}\n"
              )
              out.append(hdr)
              out.extend(body)
              i = j

          t = "".join(out)
          patch.write_text(t)
          PY

          # Trial79 regression gate: the edited KernelSU patch must be syntactically
          # valid before we spend time downloading the compiler/building the kernel.
          git -C KernelSU-Next apply --check ../.github/patches/stage5-ksun-susfs-compile-probe.patch

          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/stat.c")
          t = p.read_text()
          old = (
              "\t\tksu_handle_stat_samsung419(&dfd, &susfs_stat_user_filename, &flags);\n"
              "\t\tputname(susfs_stat_fname);\n"
              "\t\tsusfs_stat_fname = getname_flags(susfs_stat_user_filename,\n"
              "\t\t\t\t\t\tlookup_flags, NULL);\n"
              "\t\tif (IS_ERR(susfs_stat_fname)) {\n"
              "\t\t\terror = PTR_ERR(susfs_stat_fname);\n"
              "\t\t\tgoto out;\n"
              "\t\t}\n"
          )
          new = (
              "\t\t/* susfs_stage6_trial86_stat_redirect_only */\n"
              "\t\tif (ksu_handle_stat_samsung419(&dfd, &susfs_stat_user_filename,\n"
              "\t\t\t\t\t\t   &flags) > 0) {\n"
              "\t\t\tstruct filename *redirected_fname;\n"
              "\n"
              "\t\t\tredirected_fname = getname_flags(susfs_stat_user_filename,\n"
              "\t\t\t\t\t\t\t lookup_flags, NULL);\n"
              "\t\t\tif (IS_ERR(redirected_fname)) {\n"
              "\t\t\t\terror = PTR_ERR(redirected_fname);\n"
              "\t\t\t\tgoto out;\n"
              "\t\t\t}\n"
              "\t\t\tputname(susfs_stat_fname);\n"
              "\t\t\tsusfs_stat_fname = redirected_fname;\n"
              "\t\t}\n"
          )
          if old not in t:
              raise SystemExit("Trial82: stat caller redirect anchor missing")
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY

          for cfg in SUS_PATH SUS_MOUNT AUTO_ADD_SUS_KSU_DEFAULT_MOUNT AUTO_ADD_SUS_BIND_MOUNT SUS_KSTAT SPOOF_UNAME ENABLE_LOG HIDE_KSU_SUSFS_SYMBOLS SPOOF_CMDLINE_OR_BOOTCONFIG OPEN_REDIRECT SUS_MAP; do
            grep -q "^CONFIG_KSU_SUSFS_${cfg}=y$" arch/arm64/configs/exynos850-m12nsxx_defconfig
          done

          grep -q 'susfs_stage6_trial86_susfs_init_runtime_on' .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'susfs_stage6_trial86_uname_static_key_gate' kernel/sys.c
          grep -q 'susfs_stage6_trial86_cmdline_static_key_gate' fs/proc/cmdline.c
          grep -q 'susfs_stage6_trial86_chroot_guard' .github/patches/stage5-ksun-susfs-compile-probe.patch
          test "$(grep -c '^+.*current_chrooted()' .github/patches/stage5-ksun-susfs-compile-probe.patch)" -ge 2
          grep -q 'susfs_stage6_trial86_stat_redirect_result' .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'susfs_stage6_trial86_stat_redirect_only' fs/stat.c
          grep -q '^extern bool current_chrooted(void);' include/linux/fs_struct.h
          git -C KernelSU-Next apply --check ../.github/patches/stage5-ksun-susfs-compile-probe.patch

          grep -q 'susfs_stage6_trial32_stat_filename_ownership' fs/stat.c
          grep -q 'susfs_stage6_trial59_faccessat_filename_ownership' fs/open.c
          if grep -A2 'filename_lookup(dfd, susfs_stat_fname' fs/stat.c | grep -q 'putname(susfs_stat_fname)'; then
            echo "ERROR: stat post-filename_lookup double release reintroduced"
            exit 1
          fi
          if grep -A2 'filename_lookup(dfd, susfs_fname' fs/open.c | grep -q 'putname(susfs_fname)'; then
            echo "ERROR: faccessat post-filename_lookup double release reintroduced"
            exit 1
          fi

          git diff --check
          echo "Trial82: chroot guards + redirect-only stat bridge applied; full SUSFS feature set preserved."

