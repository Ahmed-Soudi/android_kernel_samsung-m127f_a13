              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_MAP
              bool "Hide suspicious mapped files"
              depends on KSU_SUSFS
              default y

          endmenu

          '''
              pos = k.rfind(marker)
              k = k[:pos] + block + k[pos:]
              p.write_text(k)

          p = Path("KernelSU-Next/kernel/selinux/selinux.c")
          c = p.read_text()
          wrapper = '''

          #ifdef CONFIG_KSU_SUSFS
          /* Stage 5 2.3.0 compile-probe adapters for Samsung 4.19. */
          bool susfs_is_current_ksu_domain(void)
          {
              return is_ksu_domain();
          }

          bool susfs_is_current_zygote_domain(void)
          {
              return is_zygote(current_cred());
          }
          #endif
          '''
          if "bool susfs_is_current_ksu_domain(void)" not in c:
              p.write_text(c + wrapper)

          # Current SUSFS 2.3.0 integration calls susfs_init() from
          # kernelsu_init(). Keep KSUN 3.3.0's existing initialization flow,
          # but add the SUSFS initialization hook instead of replacing KSUN.
          p = Path("KernelSU-Next/kernel/core/init.c")
          c = p.read_text()

          include_anchor = "#include <linux/workqueue.h>\n"
          if "#include <linux/susfs.h>" not in c:
              if include_anchor not in c:
                  raise SystemExit("Trial74: KSUN core/init.c include anchor missing")
              c = c.replace(
                  include_anchor,
                  include_anchor + "#include <linux/susfs.h>\n",
                  1
              )

          init_anchor = "#endif\n\tif (allow_shell) {"
          init_block = (
              "#endif\n"
              "#ifdef CONFIG_KSU_SUSFS\n"
              "\t/* susfs_stage6_trial86_official_susfs_init */\n"
              "\t/* susfs_stage6_trial86_susfs_init_runtime_on */\n\tsusfs_init();\n"
              "#endif\n"
              "\tif (allow_shell) {"
          )
          if "susfs_stage6_trial86_official_susfs_init" not in c:
              if init_anchor not in c:
                  raise SystemExit("Trial74: kernelsu_init() SUSFS init anchor missing")
              c = c.replace(init_anchor, init_block, 1)

          p.write_text(c)

          p = Path("arch/arm64/configs/exynos850-m12nsxx_defconfig")
          d = p.read_text()
          symbols = [
              "CONFIG_KSU_SUSFS=y",
              "CONFIG_KSU_SUSFS_SUS_PATH=y",
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y",
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y",
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y",
              "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set",
              "# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set",
              "# CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT is not set",
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y",
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y",
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y",
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y",
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y",
              "CONFIG_KSU_SUSFS_SUS_MAP=y",
          ]
          for sym in symbols:
              name = sym.replace("# ", "").split("=", 1)[0].split(" is not set", 1)[0]
              lines = [line for line in d.splitlines()
                       if not (line.startswith(name + "=") or line == f"# {name} is not set")]
              lines.append(sym)
              d = "\n".join(lines) + "\n"
          p.write_text(d)

          print("Stage 6 Trial60 full SUSFS hiding configuration prepared")
          PY

          git -C KernelSU-Next diff --binary \
            > .github/patches/stage5-ksun-susfs-compile-probe.patch

          test -s .github/patches/stage5-ksun-susfs-compile-probe.patch
          git -C KernelSU-Next diff --stat

          git -C KernelSU-Next reset --hard
          git -C KernelSU-Next clean -fd

      - name: Trial 80 add native KSUN SUSFS supercall ABI
        shell: bash
        run: |
          set -euxo pipefail

          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/supercall/supercall.c")
          t = p.read_text()

          if "susfs_stage6_trial86_supercall_dispatch" in t:
              raise SystemExit("Trial82: dispatcher unexpectedly already present")

          # Exact pinned 3b18216f source guard: reboot_handler_pre uses
          # four-space indentation for the install-fd comment.
          if "static int reboot_handler_pre(struct kprobe *p, struct pt_regs *regs)\n" not in t:
              raise SystemExit("Trial82: reboot_handler_pre signature missing")
          if "    /* Check if this is a request to install KSU fd */\n" not in t:
              raise SystemExit("Trial82: pinned install-fd comment shape changed")

          inc_anchor = "#include <linux/version.h>\n"
          if inc_anchor not in t:
              raise SystemExit("Trial82: supercall include anchor missing")

          include_block = (
              "#include <linux/version.h>\n"
              "#ifdef CONFIG_KSU_SUSFS\n"
              "#include <linux/susfs.h>\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n"
          )
          t = t.replace(inc_anchor, include_block, 1)

          dispatch_anchor = "    /* Check if this is a request to install KSU fd */\n"
          if dispatch_anchor not in t:
              raise SystemExit("Trial82: exact pinned reboot-handler install-fd anchor missing")

          dispatcher = "\n".join([
              '#ifdef CONFIG_KSU_SUSFS',
              '    /*',
              '     * susfs_stage6_trial86_supercall_dispatch',
              '     * Native SUSFS 2.3.0 ABI for pinned KernelSU Next 3.3.0.',
              '     */',
              '    pr_info("Trial86 SUSFS ENTRY: magic1=0x%x magic2=0x%x cmd=0x%x uid=%u\\n", magic1, magic2, cmd, current_uid().val);',
              '    if (magic1 == KSU_INSTALL_MAGIC1 &&',
              '        magic2 == SUSFS_MAGIC &&',
              '        current_uid().val == 0) {',
              '        /* susfs_stage6_trial86_userspace_pointer_adapter */',
              '        void __user *susfs_user_arg = (void __user *)arg4;',
              '        void __user **susfs_arg = &susfs_user_arg;',
              '        pr_info("Trial86 SUSFS ABI: cmd=0x%x uid=%u\\n", cmd, current_uid().val);',
              '',
              '        switch (cmd) {',
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH',
              '        case CMD_SUSFS_ADD_SUS_PATH:',
              '            susfs_add_sus_path(susfs_arg);',
              '            return 0;',
              '        case CMD_SUSFS_ADD_SUS_PATH_LOOP:',
              '            susfs_add_sus_path_loop(susfs_arg);',
              '            return 0;',
              '#endif',
              '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT',
              '        case CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS:',
              '            susfs_set_hide_sus_mnts_for_non_su_procs(susfs_arg);',
              '            return 0;',
              '#endif',
              '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT',
              '        case CMD_SUSFS_ADD_SUS_KSTAT:',
              '        case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:',
              '            susfs_add_sus_kstat(susfs_arg);',
              '            return 0;',
              '        case CMD_SUSFS_UPDATE_SUS_KSTAT:',
              '            susfs_update_sus_kstat(susfs_arg);',
              '            return 0;',
              '#endif',
              '#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME',
              '        case CMD_SUSFS_SET_UNAME:',
              '            susfs_set_uname(susfs_arg);',
              '            return 0;',
              '#endif',
              '#ifdef CONFIG_KSU_SUSFS_ENABLE_LOG',
              '        case CMD_SUSFS_ENABLE_LOG:',
              '            susfs_enable_log(susfs_arg);',
              '            return 0;',
              '#endif',
              '#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
              '        case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:',
              '            susfs_set_cmdline_or_bootconfig(susfs_arg);',
              '            return 0;',
              '#endif',
              '#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT',
              '        case CMD_SUSFS_ADD_OPEN_REDIRECT:',
              '            susfs_add_open_redirect(susfs_arg);',
              '            return 0;',
              '#endif',
              '#ifdef CONFIG_KSU_SUSFS_SUS_MAP',
              '        case CMD_SUSFS_ADD_SUS_MAP:',
              '            susfs_add_sus_map(susfs_arg);',
              '            return 0;',
              '#endif',
              '        case CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING:',
              '            susfs_set_avc_log_spoofing(susfs_arg);',
              '            return 0;',
              '        case CMD_SUSFS_SHOW_ENABLED_FEATURES:',
              '            pr_info("Trial86 SUSFS ABI: dispatch CMD_SUSFS_SHOW_ENABLED_FEATURES\\n");',
              '            susfs_get_enabled_features(susfs_arg);',
              '            return 0;',
              '        case CMD_SUSFS_SHOW_VARIANT:',
              '            pr_info("Trial86 SUSFS ABI: dispatch CMD_SUSFS_SHOW_VARIANT\\n");',
              '            susfs_show_variant(susfs_arg);',
              '            return 0;',
              '        case CMD_SUSFS_SHOW_VERSION:',
              '            pr_info("Trial86 SUSFS ABI: dispatch CMD_SUSFS_SHOW_VERSION\\n");',
              '            susfs_show_version(susfs_arg);',
              '            return 0;',
              '        default:',
              '            return 0;',
              '        }',
              '    }',
              '#endif',
              '',
          ])
          t = t.replace(dispatch_anchor, dispatcher + dispatch_anchor, 1)
          p.write_text(t)
          PY

          git -C KernelSU-Next diff --check
          git -C KernelSU-Next diff -- kernel/supercall/supercall.c \
            > /tmp/trial80-supercall.patch
          test -s /tmp/trial80-supercall.patch

          cat /tmp/trial80-supercall.patch \
            >> .github/patches/stage5-ksun-susfs-compile-probe.patch

          git -C KernelSU-Next reset --hard
          git -C KernelSU-Next clean -fd

          git -C KernelSU-Next apply --check \
            ../.github/patches/stage5-ksun-susfs-compile-probe.patch

          grep -q 'susfs_stage6_trial86_supercall_dispatch' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'susfs_stage6_trial86_userspace_pointer_adapter' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'Trial86 SUSFS ABI: cmd=' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'Trial86 SUSFS ENTRY: magic1=' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'void __user \*susfs_user_arg = (void __user \*)arg4;' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'void __user \*\*susfs_arg = &susfs_user_arg;' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch
          if grep -q 'void __user \*\*susfs_arg = (void __user \*\*)arg4;' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch; then
            echo "ERROR: broken Trial81 direct pointer-to-pointer cast remains"
            exit 1
          fi

          for cmd in CMD_SUSFS_SHOW_ENABLED_FEATURES CMD_SUSFS_SHOW_VARIANT CMD_SUSFS_SHOW_VERSION; do
            grep -q "${cmd}" .github/patches/stage5-ksun-susfs-compile-probe.patch
          done

          for cmd in CMD_SUSFS_ADD_SUS_PATH CMD_SUSFS_ADD_SUS_PATH_LOOP CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS CMD_SUSFS_ADD_SUS_KSTAT CMD_SUSFS_UPDATE_SUS_KSTAT CMD_SUSFS_SET_UNAME CMD_SUSFS_ENABLE_LOG CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG CMD_SUSFS_ADD_OPEN_REDIRECT CMD_SUSFS_ADD_SUS_MAP CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING; do
            grep -q "${cmd}" .github/patches/stage5-ksun-susfs-compile-probe.patch
          done

          echo "Trial82: native KSUN 3.3.0 <-> SUSFS 2.3.0 supercall dispatcher added."
      - name: Trial 92 add FBE zygote-start KSUN services trigger
        shell: bash
        run: |
          set -euxo pipefail

          # Trial 91 was consumed during workflow generation because its pinned
          # KSUN source guard used the wrong indentation. Trial 92 starts again
          # from the boot-green Trial 90 workflow and makes ONE runtime change:
          # add an FBE-capable zygote-start trigger for `ksud services`.
          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

          python3 - <<'PY92'
          from pathlib import Path

          p = Path("KernelSU-Next/kernel/runtime/ksud_integration.c")
          t = p.read_text()

          marker = "susfs_stage6_trial92_fbe_zygote_services"
          if marker in t:
              raise SystemExit("Trial92: FBE zygote-start services trigger unexpectedly already present")

          # Exact pinned KSUN 3.3.0 source shape at commit 3b18216f.
          # Preserve both legacy triggers; add one additional FBE event only.
          legacy = (
              '    "on nonencrypted\\n"\n'
              '    "    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- " KSUD_PATH " services\\n"\n'
              '    "\\n"\n'
              '    "on property:vold.decrypt=trigger_restart_framework\\n"\n'
              '    "    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- " KSUD_PATH " services\\n"\n'
          )
          if legacy not in t:
              raise SystemExit("Trial92: exact pinned legacy KSUN services trigger block changed")

          replacement = (
              '    "on nonencrypted\\n"\n'
              '    "    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- " KSUD_PATH " services\\n"\n'
              '    "\\n"\n'
              '    /* susfs_stage6_trial92_fbe_zygote_services */\n'
              '    "on zygote-start\\n"\n'
              '    "    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- " KSUD_PATH " services\\n"\n'
              '    "\\n"\n'
              '    "on property:vold.decrypt=trigger_restart_framework\\n"\n'
              '    "    exec u:r:" KERNEL_SU_DOMAIN ":s0 root -- " KSUD_PATH " services\\n"\n'
          )

          t = t.replace(legacy, replacement, 1)
          p.write_text(t)
          PY92

          git -C KernelSU-Next diff --check
          git -C KernelSU-Next diff -- kernel/runtime/ksud_integration.c \
            > /tmp/trial92-fbe-zygote-services.patch
          test -s /tmp/trial92-fbe-zygote-services.patch

