              '            grep -q "^CONFIG_KSU_SUSFS_${cfg}=y$" .config || { echo "ERROR: required SUSFS feature ${cfg} is not enabled"; exit 1; }',
              "          done",
              "          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' .config",
              "          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' .config",
              "          grep -q '^CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y$' .config",
              "          grep -q '^CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y$' .config",
              "          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' .config",
              "          test -s fs/susfs.o",
              "          if ! grep -Eq '(^|[[:space:]])susfs_' System.map; then",
