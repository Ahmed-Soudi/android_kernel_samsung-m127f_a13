          # with a high DEFAULT_KSU_* allocation range.
          x = x.replace("DEFAULT_SUS_MNT_GROUP_ID", "DEFAULT_KSU_MNT_GROUP_ID")
          x = x.replace("DEFAULT_SUS_MNT_ID", "DEFAULT_KSU_MNT_ID")

          # The old 4.19 port used separate SUSFS IDAs. Current 2.3.0 deliberately
          # allocates high IDs from the normal IDAs, so release paths remain coherent.
          x = x.replace("&susfs_mnt_id_ida, DEFAULT_KSU_MNT_ID", "&mnt_id_ida, DEFAULT_KSU_MNT_ID")
          x = x.replace("&susfs_mnt_group_ida, DEFAULT_KSU_MNT_GROUP_ID", "&mnt_group_ida, DEFAULT_KSU_MNT_GROUP_ID")
          x = x.replace("ida_free(&susfs_mnt_id_ida, mnt->mnt_id);", "ida_free(&mnt_id_ida, mnt->mnt_id);")
          x = x.replace("ida_free(&susfs_mnt_group_ida, mnt->mnt_group_id);", "ida_free(&mnt_group_ida, mnt->mnt_group_id);")

          # Old unshare detection used a magic backup-ID sentinel. 2.3.0 marks the
          # cloned vfsmount instead, because its reused ID was never allocated by IDA.
          old = """\t// We should first check the 'SUSFS_MNT_ID_BACKUP(mnt)', see if it is DEFAULT_KSU_MNT_ID_FOR_KSU_PROC_UNSHARE
          \t// if so, these mnt_id were not assigned by mnt_alloc_id() so we don't need to free it.
          \tif (unlikely(SUSFS_MNT_ID_BACKUP(mnt) == DEFAULT_KSU_MNT_ID_FOR_KSU_PROC_UNSHARE)) {
          \t\treturn;
          \t}
          """
          if old in x:
              x = x.replace(old, """#ifdef CONFIG_KDP_NS
          \tif (unlikely(mnt->mnt->mnt_flags & VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT))
          \t\treturn;
          #else
          \tif (unlikely(mnt->mnt.mnt_flags & VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT))
          \t\treturn;
          #endif
          """, 1)
          else:
              raise SystemExit("old unshare mnt_free_id sentinel block not found")

          # The high-ID branch is now the normal IDA too; no separate SUSFS free path.
          old = """\t// Now we can check if its mnt_id is sus
          \tif (unlikely(mnt->mnt_id >= DEFAULT_KSU_MNT_ID)) {
          \t\tida_free(&mnt_id_ida, mnt->mnt_id);
          \t\treturn;
          \t}
          """
          x = x.replace(old, "", 1)

          # Any spoof-backup ID still belongs to the normal IDA.
          # Keep that Samsung 4.19 bookkeeping until the later zygote-spoof batch.

          # Replace the old magic sentinel assignment in clone_mnt. The unshared clone
          # keeps old->mnt_id; after flags are copied we mark it as not IDA-owned.
          old = """\t\t\tif (mnt)
          \t\t\t\tSUSFS_MNT_ID_BACKUP(mnt) =
          \t\t\t\t\tDEFAULT_KSU_MNT_ID_FOR_KSU_PROC_UNSHARE;
          """
          if old not in x:
              raise SystemExit("clone_mnt magic unshare sentinel assignment not found")
          x = x.replace(old, "", 1)

          # Mark the reused-ID clone after Samsung/non-Samsung mount flags are copied.
          kdp = "\tkdp_assign_mnt_flags(mnt->mnt, ns_flags);\n"
          if kdp not in x:
              raise SystemExit("Samsung kdp_assign_mnt_flags anchor missing")
          x = x.replace(kdp, """\tif (susfs_ksu && (flag & CL_COPY_MNT_NS))
          \t\tns_flags |= VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;
          \tkdp_assign_mnt_flags(mnt->mnt, ns_flags);
