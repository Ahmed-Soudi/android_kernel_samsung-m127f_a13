          grep -q 'susfs_stage5_trial25_sus_map_show_smap' fs/proc/task_mmu.c
          grep -q 'susfs_stage5_trial26_open_redirect_show_map' fs/proc/task_mmu.c
          grep -q 'susfs_stage5_trial26_map_files_count' fs/proc/base.c
          grep -q 'susfs_stage5_trial26_open_redirect_proc_readlink' fs/proc/base.c
