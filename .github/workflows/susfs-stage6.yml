      - name: Trial 59 fix Samsung 4.19 faccessat filename ownership
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/open.c")
          t = p.read_text()

          old = (
              "\tres = filename_lookup(dfd, susfs_fname, lookup_flags, &path, NULL);\n"
              "\tputname(susfs_fname);\n"
              "#else\n"
          )
          new = (
              "\t/*\n"
              "\t * susfs_stage6_trial59_faccessat_filename_ownership\n"
              "\t *\n"
              "\t * Samsung/Linux 4.19 filename_lookup() consumes the struct\n"
              "\t * filename reference. This matches the ownership rule that\n"
              "\t * caused Trial31's stat-path putname() panic. Do not release\n"
              "\t * susfs_fname a second time after filename_lookup().\n"
              "\t */\n"
              "\tres = filename_lookup(dfd, susfs_fname, lookup_flags, &path, NULL);\n"
              "#else\n"
          )

          if old not in t:
              raise SystemExit(
                  "Trial59: expected faccessat filename_lookup + putname ownership anchor missing"
              )

          t = t.replace(old, new, 1)
          p.write_text(t)
          PY

          grep -q 'susfs_stage6_trial59_faccessat_filename_ownership' fs/open.c
          grep -q 'ksu_handle_faccessat_samsung419(&dfd, &susfs_user_filename' fs/open.c
          grep -q 'susfs_stage6_trial53_faccessat_redirect_only' fs/open.c

          python3 - <<'PY'
          from pathlib import Path
          t = Path("fs/open.c").read_text()
          marker = "susfs_stage6_trial59_faccessat_filename_ownership"
          pos = t.find(marker)
          if pos < 0:
              raise SystemExit("Trial59 marker missing")
          window = t[pos:pos+900]
          needle = "filename_lookup(dfd, susfs_fname, lookup_flags, &path, NULL);"
          if needle not in window:
              raise SystemExit("Trial59 filename_lookup missing near ownership marker")
          lookup = window.find(needle)
          tail = window[lookup:lookup+220]
          if "putname(susfs_fname)" in tail:
              raise SystemExit("Trial59: double-put still present after filename_lookup")
          print("Trial59: faccessat filename_lookup ownership audit passed")
          PY

          echo "Trial59: full faccessat SUSFS path ACTIVE; only the post-filename_lookup double putname is removed."

