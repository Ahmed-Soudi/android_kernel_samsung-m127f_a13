      - name: Trial 90 bridge raw reboot SUSFS manager reporting
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("kernel/reboot.c")
          t = p.read_text()

          if "susfs_stage6_trial90_raw_reboot_manager_bridge" in t:
              raise SystemExit("Trial90: raw reboot bridge unexpectedly already present")

          include_block = (
              "#ifdef CONFIG_KSU_SUSFS\n"
              "#include <linux/susfs.h>\n"
              "#include <linux/susfs_def.h>\n"
              "#endif\n"
          )
          if "#include <linux/susfs.h>" not in t:
              anchors = [
                  "#include <linux/syscalls.h>\n",
                  "#include <linux/reboot.h>\n",
                  "#include <linux/kernel.h>\n",
              ]
              for inc_anchor in anchors:
                  if inc_anchor in t:
                      t = t.replace(inc_anchor, inc_anchor + include_block, 1)
                      break
              else:
                  raise SystemExit("Trial90: no safe kernel/reboot.c include anchor found")

          pat = re.compile(
              r'(SYSCALL_DEFINE4\(reboot\s*,\s*int\s*,\s*magic1\s*,\s*int\s*,\s*magic2\s*,\s*'
              r'unsigned\s+int\s*,\s*cmd\s*,\s*void\s+__user\s*\*\s*,\s*arg\s*\)\s*\{\s*\n)',
              re.M,
          )
          m = pat.search(t)
          if not m:
              candidates = [line for line in t.splitlines() if "SYSCALL_DEFINE4(reboot" in line]
              print("Trial90 reboot candidates:", candidates)
              raise SystemExit("Trial90: Samsung SYSCALL_DEFINE4(reboot) signature not matched")

          bridge_lines = [
              "#ifdef CONFIG_KSU_SUSFS",
              "\t/*",
              "\t * susfs_stage6_trial90_raw_reboot_manager_bridge",
              "\t * KSUN 3.3.0 ksud probes SUSFS with raw SYS_reboot.",
              "\t * Trial90 exposes the complete SUSFS 2.3.0 command ABI on the",
              "\t * real Samsung 4.19 reboot syscall path used by userspace.",
              "\t */",
              "\tif (magic1 == 0xDEADBEEF && magic2 == SUSFS_MAGIC &&",
              "\t    current_uid().val == 0) {",
              "\t\tvoid __user *susfs_user_arg = arg;",
              "\t\tvoid __user **susfs_arg = &susfs_user_arg;",
              "",
              "\t\tpr_info(\"Trial90 SUSFS RAW REBOOT: cmd=0x%x uid=%u\\n\",",
              "\t\t\tcmd, current_uid().val);",
              "",
              "\t\tswitch (cmd) {",
              "#ifdef CONFIG_KSU_SUSFS_SUS_PATH",
              "\t\tcase CMD_SUSFS_ADD_SUS_PATH:",
              "\t\t\tsusfs_add_sus_path(susfs_arg);",
              "\t\t\treturn 0;",
              "\t\tcase CMD_SUSFS_ADD_SUS_PATH_LOOP:",
              "\t\t\tsusfs_add_sus_path_loop(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT",
              "\t\tcase CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS:",
              "\t\t\tsusfs_set_hide_sus_mnts_for_non_su_procs(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT",
              "\t\tcase CMD_SUSFS_ADD_SUS_KSTAT:",
              "\t\tcase CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:",
              "\t\t\tsusfs_add_sus_kstat(susfs_arg);",
              "\t\t\treturn 0;",
              "\t\tcase CMD_SUSFS_UPDATE_SUS_KSTAT:",
              "\t\t\tsusfs_update_sus_kstat(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME",
              "\t\tcase CMD_SUSFS_SET_UNAME:",
              "\t\t\tsusfs_set_uname(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "#ifdef CONFIG_KSU_SUSFS_ENABLE_LOG",
              "\t\tcase CMD_SUSFS_ENABLE_LOG:",
              "\t\t\tsusfs_enable_log(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG",
              "\t\tcase CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:",
              "\t\t\tsusfs_set_cmdline_or_bootconfig(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT",
              "\t\tcase CMD_SUSFS_ADD_OPEN_REDIRECT:",
              "\t\t\tsusfs_add_open_redirect(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "#ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              "\t\tcase CMD_SUSFS_ADD_SUS_MAP:",
              "\t\t\tsusfs_add_sus_map(susfs_arg);",
              "\t\t\treturn 0;",
              "#endif",
              "\t\tcase CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING:",
              "\t\t\tsusfs_set_avc_log_spoofing(susfs_arg);",
              "\t\t\treturn 0;",
              "\t\tcase CMD_SUSFS_SHOW_ENABLED_FEATURES:",
              "\t\t\tsusfs_get_enabled_features(susfs_arg);",
              "\t\t\treturn 0;",
              "\t\tcase CMD_SUSFS_SHOW_VARIANT:",
              "\t\t\tsusfs_show_variant(susfs_arg);",
              "\t\t\treturn 0;",
              "\t\tcase CMD_SUSFS_SHOW_VERSION:",
              "\t\t\tsusfs_show_version(susfs_arg);",
              "\t\t\treturn 0;",
              "\t\tdefault:",
              "\t\t\tbreak;",
              "\t\t}",
              "\t}",
              "#endif",
              "",
          ]
          bridge = "\n".join(bridge_lines)
          # Trial90 C90 fix: do not inject executable code before the
          # reboot syscall's existing function-scope declarations.
          # Samsung 4.19 follows the standard layout:
          #   struct pid_namespace *pid_ns = ...;
          #   char buffer[256];
          #   int ret = 0;
          # Insert immediately after the final declaration instead.
          decl_anchor = "int ret = 0;\n"
          decl_pos = t.find(decl_anchor, m.end(), m.end() + 1024)
          if decl_pos < 0:
              context = t[m.end():m.end() + 1024]
              print("Trial90 reboot declaration context:")
              print(context)
              raise SystemExit("Trial90: reboot declaration block anchor 'int ret = 0;' not found")
          insert_at = decl_pos + len(decl_anchor)
          t = t[:insert_at] + bridge + t[insert_at:]
          p.write_text(t)
          PY

