            echo "===== no-SU / zygote / mount inventory ====="
            grep -RIn -E 'TIF_PROC_NO_SU|TIF_PROC_UMOUNTED|zygote_next|hide_sus_mnts_for_non_su_procs|CL_COPY_MNT_NS|kernel_umount' fs include KernelSU-Next/kernel .github/patches 2>/dev/null || true
          } > .ci/stage6-trial86/focused-parity.txt

      - name: Trial 80 audit Manager SUSFS ABI parity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ci/stage6-trial86

          grep -q '^#define SUSFS_MAGIC 0xFAFAFAFA$' include/linux/susfs_def.h
          grep -q '^#define CMD_SUSFS_SHOW_VERSION 0x555e1$' include/linux/susfs_def.h
          grep -q '^#define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x555e2$' include/linux/susfs_def.h
          grep -q '^#define CMD_SUSFS_SHOW_VARIANT 0x555e3$' include/linux/susfs_def.h
          grep -q '^#define SUSFS_VERSION "v2.3.0"$' include/linux/susfs.h
          grep -q '#define SUSFS_VARIANT "NON-GKI"' include/linux/susfs.h

          grep -q 'void susfs_show_version(void __user \*\*user_info)' fs/susfs.c
          grep -q 'void susfs_show_variant(void __user \*\*user_info)' fs/susfs.c
          grep -q 'void susfs_get_enabled_features(void __user \*\*user_info)' fs/susfs.c
          grep -q 'susfs_stage6_trial86_supercall_dispatch' .github/patches/stage5-ksun-susfs-compile-probe.patch

          {
            echo 'Stage 6 Trial 86 Manager ABI target'
            echo 'trial81_boot=GREEN_manager_susfs=NOT_DETECTED'
            echo 'trial86_change=trace_reboot_handler_entry_before_susfs_magic_gate'
            echo 'expected_manager_status=Supported'
            echo 'expected_susfs_version=v2.3.0'
            echo 'expected_susfs_variant=NON-GKI'
            echo 'expected_manager_display=Supported | v2.3.0 (NON-GKI)'
            echo 'userspace_module_required_for_manager_detection=no'
            echo 'BRENE_role=runtime_SUSFS_configuration_and_hiding'
          } | tee .ci/stage6-trial86/manager-abi-status.txt

          echo 'Trial82: Manager-facing SUSFS support/version ABI statically complete.'
      - name: Execute Stage 4 build recipe
        run: |
          set -euxo pipefail

          # Execute shell steps from the generated build recipe in this runner.
          # Action-only steps (checkout/setup/upload) are skipped.
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          wf = yaml.safe_load(Path(".ci/stage5/build-ksun-stage5.yml").read_text())
          jobs = wf.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"expected one build job, got {list(jobs)}")

          steps = next(iter(jobs.values())).get("steps", [])
          chunks = ["#!/usr/bin/env bash", "set -euo pipefail", ""]

          for idx, step in enumerate(steps, 1):
              name = step.get("name", f"step-{idx}")
              script = step.get("run")
              if script is None:
                  print(f"skip action-only step: {name}")
                  continue
              chunks += [
                  f'echo "===== Stage 6 Trial 92: {name} ====="',
                  script,
                  "",
              ]

          Path("/tmp/stage4-build-recipe.sh").write_text("\n".join(chunks))
          PY

          chmod +x /tmp/stage4-build-recipe.sh
          bash /tmp/stage4-build-recipe.sh

          echo "Stage 6 Trial 92 full build recipe completed."
          echo "Trial81 full build completed; runtime boot + Manager SUSFS detection validation required."

      - name: Mark Stage 6 Trial 92 flash candidate
        run: |
          set -euxo pipefail
          mkdir -p .ci/stage5/flash-candidate
          cp .ci/stage5/final-audit/README.txt .ci/stage5/flash-candidate/README.txt
          cp .ci/stage5/final-audit/live-semantic-inventory.txt .ci/stage5/flash-candidate/live-semantic-inventory.txt
          {
           echo "Stage 6 Trial 92 FLASH CANDIDATE"
           echo "source_head=${GITHUB_SHA}"
           echo "kernel=Samsung M127F Android 13 Linux 4.19.111"
           echo "kernelsu_next=3.3.0"
           echo "susfs=2.3.0 Samsung 4.19 backport"
           echo "ps5_uac1=preserved"
           echo "zygisk=external-module;trial92_fbe_zygote_services_trigger=enabled"
           echo "runtime_validation=trial77_full_features_boot_green;trial78_pending"
           [ ! -f Image ] || sha256sum Image
          } | tee .ci/stage5/flash-candidate/manifest.txt


      - name: Upload Stage 6 Trial 92 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m127f-susfs-stage6-trial92-fbe-zygote-services
          if-no-files-found: warn
          path: |
            Image
            System.map
            .config
            .ci/stage5/
            .ci/stage6-trial86/
            M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL92-FBE-ZYGOTE-SERVICES.zip

