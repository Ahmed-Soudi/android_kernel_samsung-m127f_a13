                  "!(SUSFS_IS_INODE_SUS_MAP(file_inode(susfs_vma->vm_file))))",
              ),
          ]

          changed = 0
          for old, new in fixes:
              if old in t:
                  t = t.replace(old, new, 1)
                  changed += 1
              elif new not in t:
                  raise SystemExit(f"Trial74: expected SUS_MAP condition missing: {old}")

          marker = "/* susfs_stage6_trial86_sus_map_logical_grouping */"
          if marker not in t:
              anchor = "!(SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))))"
              if anchor not in t:
                  raise SystemExit("Trial74: grouped rollup condition missing")
              t = t.replace(anchor, marker + "\n\t\t\t    " + anchor, 1)

          p.write_text(t)
          print("Trial62 SUS_MAP grouping fixes applied:", changed)
          PY

          grep -q 'susfs_stage6_trial86_sus_map_logical_grouping' fs/proc/task_mmu.c
          grep -q '!(SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))' fs/proc/task_mmu.c
          grep -q '!(SUSFS_IS_INODE_SUS_MAP(file_inode(susfs_vma->vm_file)))' fs/proc/task_mmu.c

          # No capability is disabled by this trial.
