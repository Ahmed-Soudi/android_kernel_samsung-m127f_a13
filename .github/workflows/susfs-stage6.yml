name: SUSFS Samsung 4.19 Stage 6 - Trial 123 ReZygisk Baseline

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - ksun-3.3.0-ps5-susfs230
    paths:
      - ".github/workflows/susfs-stage6.yml"

jobs:
  trial123:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore exact Trial 92 runtime-green source
        run: |
          set -euxo pipefail
          git fetch origin ci-susfs-stage6-trial92-35934393973
          git reset --hard c9022cdf5d640d267068172fba54c12e7d58103c
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "c9022cdf5d640d267068172fba54c12e7d58103c"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "3b18216f71df189ab3d1b1ce0bdb21be1268e771"
          test -s .ci/stage5/build-ksun-stage5.yml
          test -s .github/patches/stage5-ksun-susfs-compile-probe.patch

      - name: Preserve Trial 92 SUS_MAP semantics under clang 11
        run: |
          set -euxo pipefail
          cat >> fs/proc/Makefile <<'EOF123WARN'

          # trial123_preserve_trial92_susmap_semantics
          CFLAGS_task_mmu.o += -Wno-logical-op-parentheses
          EOF123WARN
          grep -q 'trial123_preserve_trial92_susmap_semantics' fs/proc/Makefile
          grep -q 'CFLAGS_task_mmu.o += -Wno-logical-op-parentheses' fs/proc/Makefile
          ! grep -q '((inode) && (inode)->i_mapping' include/linux/susfs_def.h

      - name: Prepare Trial 123 pinned build recipe
        run: |
          set -euxo pipefail
          cp .ci/stage5/build-ksun-stage5.yml /tmp/trial123-build.yml

          python3 - <<'PY123'
          from pathlib import Path
          p = Path('/tmp/trial123-build.yml')
          s = p.read_text()

          old_artifact = 'M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL92-FBE-ZYGOTE-SERVICES'
          new_artifact = 'M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL123-REZYGISK-BASELINE'
          if old_artifact not in s:
              raise SystemExit('Trial123: Trial92 artifact name not found')
          s = s.replace(old_artifact, new_artifact)

          # Trial123: update the stale Trial59 audit using line matching,
          # avoiding fragile escaped-newline comparisons.
          lines = s.splitlines(keepends=True)

          stale_hits = [
              i for i, line in enumerate(lines)
              if 'susfs_stage6_trial59_faccessat_filename_ownership' in line
          ]
          if len(stale_hits) != 1:
              raise SystemExit(
                  f'Trial123: expected one stale Trial59 audit line, got {len(stale_hits)}'
              )

          idx = stale_hits[0]
          indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
          lines[idx:idx + 1] = [
              indent + '# Trial123: pinned Trial92 faccessat semantic audit\n',
              indent + "grep -q 'susfs_stage6_trial53_faccessat_redirect_only' fs/open.c\n",
              indent + "grep -q 'ksu_handle_faccessat_samsung419' fs/open.c\n",
              indent + "grep -q 'filename_lookup(dfd, susfs_fname, lookup_flags, &path, NULL);' fs/open.c\n",
          ]
          s = ''.join(lines)

          # Trial123 deliberately adds NO kernel runtime patch for ReZygisk.
          # The exact Trial92 kernel semantics are the userspace-test baseline.

          p.write_text(s)
          PY123

          grep -q 'TRIAL123-REZYGISK-BASELINE' /tmp/trial123-build.yml
          grep -q 'susfs_stage6_trial53_faccessat_redirect_only' /tmp/trial123-build.yml
          grep -q 'ksu_handle_faccessat_samsung419' /tmp/trial123-build.yml
          ! grep -q 'susfs_stage6_trial59_faccessat_filename_ownership' /tmp/trial123-build.yml
          python3 - <<'PY123YAML'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('/tmp/trial123-build.yml').read_text())
          assert len(wf.get('jobs', {})) == 1
          print('Trial123 nested build recipe YAML valid')
          PY123YAML

      - name: Execute Trial 123 build
        run: |
          set -euxo pipefail
          python3 - <<'PY123EXEC'
          from pathlib import Path
          import yaml
          wf = yaml.safe_load(Path('/tmp/trial123-build.yml').read_text())
          jobs = wf.get('jobs', {})
          if len(jobs) != 1:
              raise SystemExit(f'expected one build job, got {list(jobs)}')
          steps = next(iter(jobs.values())).get('steps', [])
          chunks = ['#!/usr/bin/env bash', 'set -euo pipefail', '']
          for idx, step in enumerate(steps, 1):
              name = step.get('name', f'step-{idx}')
              script = step.get('run')
              if script is None:
                  print(f'skip action-only step: {name}')
                  continue
              chunks += [f'echo "===== Trial 123: {name} ====="', script, '']
          Path('/tmp/trial123-build.sh').write_text('\\n'.join(chunks))
          PY123EXEC
          chmod +x /tmp/trial123-build.sh
          bash /tmp/trial123-build.sh
          test -s M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL123-REZYGISK-BASELINE.zip
          test -s arch/arm64/boot/Image

      - name: Verify Trial 123 invariants
        run: |
          set -euxo pipefail
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "3b18216f71df189ab3d1b1ce0bdb21be1268e771"
          ! grep -q 'ptrace_state_lifetime_fix' kernel/ptrace.c
          ! grep -q '((inode) && (inode)->i_mapping' include/linux/susfs_def.h
          grep -q 'CFLAGS_task_mmu.o += -Wno-logical-op-parentheses' fs/proc/Makefile
          grep -q 'susfs_stage6_trial92_fbe_zygote_services' .github/patches/stage5-ksun-susfs-compile-probe.patch
          grep -q 'CONFIG_USB_CONFIGFS_F_UAC1=y' /tmp/trial123-build.yml
          grep -q 'CONFIG_USB_F_UAC1=y' /tmp/trial123-build.yml
          grep -q 'CONFIG_USB_U_AUDIO=y' /tmp/trial123-build.yml

          mkdir -p .ci/trial123
          {
            echo "Trial 123"
            echo "base=Trial92 runtime-green c9022cdf5d640d267068172fba54c12e7d58103c"
            echo "runtime_change=NONE; exact Trial92 runtime semantics for ReZygisk userspace test"
            echo "ptrace_patch=NONE"
            echo "susmap_semantics=Trial92 preserved; warning suppressed only"
            echo "ksun=3b18216f71df189ab3d1b1ce0bdb21be1268e771"
            echo "ps5_uac1=preserved"
            sha256sum arch/arm64/boot/Image
            sha256sum M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL123-REZYGISK-BASELINE.zip
          } | tee .ci/trial123/manifest.txt

      - name: Upload Trial 123 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL123-REZYGISK-BASELINE
          if-no-files-found: warn
          compression-level: 0
          path: |
            M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL123-REZYGISK-BASELINE.zip
            arch/arm64/boot/Image
            System.map
            .config
            .ci/trial123/
