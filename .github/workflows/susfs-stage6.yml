           echo "Trial27 failed before source push/build because it assumed a 5.15 smaps_rollup statement shape."
           echo "Trial28 discovers and wraps Samsung 4.19's actual smap_gather_stats callsites."
           echo "Also retains the pagemap SUS_MAP adaptation."
