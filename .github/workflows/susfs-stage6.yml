name: SUSFS Samsung 4.19 Stage 6 - Trial 98

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:

jobs:
  trial98:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore exact Trial 92 green source
        run: |
          set -euxo pipefail

          # Trial 98 starts from the exact disposable Trial 92 source commit
          # that was runtime-green on this M127F. This freezes the SUSFS
          # backport and avoids the moving upstream 2.3.0 branch.
          git fetch origin ci-susfs-stage6-trial92-35934393973
          git reset --hard c9022cdf5d640d267068172fba54c12e7d58103c
          git submodule update --init --recursive

          test "$(git rev-parse HEAD)" = \
            "c9022cdf5d640d267068172fba54c12e7d58103c"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

          test -s .ci/stage5/build-ksun-stage5.yml
          test -s .github/patches/stage5-ksun-susfs-compile-probe.patch

      - name: Trial 98 backport ptrace stop-state lifetime fix
        shell: bash
        run: |
          set -euxo pipefail

          # Evidence from VexZygisk debug:
          # app_process64 reaches Vex's deliberate __libc_init GOT fault at
          # 0xfffffffffffffff0, but the ptrace transaction does not recover.
          # Upstream ptrace maintainers later fixed stale ptrace_message state
          # because event payloads could survive into unrelated ptrace stops.
          #
          # ONE Trial98 functional change:
          # clear ptrace_message on attach, resume and detach so each ptrace
          # transaction starts with clean event state.
          #
          # Trial92 KSUN/FBE timing, SUSFS, PS5 UAC1 and all other source are
          # preserved exactly.

          python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/ptrace.c")
          s = p.read_text()

          marker = "trial98_ptrace_state_lifetime_fix"
          if marker in s:
              raise SystemExit("Trial98 marker already present")

          old = """\tif (seize)\n\t\tflags |= PT_SEIZED;\n\ttask->ptrace = flags;\n\n\tptrace_link(task, current);\n"""
          new = """\tif (seize)\n\t\tflags |= PT_SEIZED;\n\ttask->ptrace = flags;\n\n\t/* trial98_ptrace_state_lifetime_fix: do not inherit stale event state */\n\ttask->ptrace_message = 0;\n\n\tptrace_link(task, current);\n"""
          if s.count(old) != 1:
              raise SystemExit("Trial98: ptrace_attach anchor mismatch")
          s = s.replace(old, new, 1)

          old = """\tif (need_siglock)\n\t\tspin_lock_irq(&child->sighand->siglock);\n\tchild->exit_code = data;\n\twake_up_state(child, __TASK_TRACED);\n"""
          new = """\tif (need_siglock)\n\t\tspin_lock_irq(&child->sighand->siglock);\n\t/* trial98_ptrace_state_lifetime_fix */\n\tchild->ptrace_message = 0;\n\tchild->exit_code = data;\n\twake_up_state(child, __TASK_TRACED);\n"""
          if s.count(old) != 1:
              raise SystemExit("Trial98: ptrace_resume anchor mismatch")
          s = s.replace(old, new, 1)

          old = """\t/*\n\t * tasklist_lock avoids the race with wait_task_stopped(), see\n\t * the comment in ptrace_resume().\n\t */\n\tchild->exit_code = data;\n\t__ptrace_detach(current, child);\n"""
          new = """\t/*\n\t * tasklist_lock avoids the race with wait_task_stopped(), see\n\t * the comment in ptrace_resume().\n\t */\n\t/* trial98_ptrace_state_lifetime_fix */\n\tchild->ptrace_message = 0;\n\tchild->exit_code = data;\n\t__ptrace_detach(current, child);\n"""
          if s.count(old) != 1:
              raise SystemExit("Trial98: ptrace_detach anchor mismatch")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          grep -n -A5 -B5 'trial98_ptrace_state_lifetime_fix' kernel/ptrace.c
          test "$(grep -c 'trial98_ptrace_state_lifetime_fix' kernel/ptrace.c)" -eq 3

          mkdir -p .ci/trial98
          git diff -- kernel/ptrace.c > .ci/trial98/ptrace-state-lifetime-fix.patch
          test -s .ci/trial98/ptrace-state-lifetime-fix.patch

      - name: Prepare Trial 98 build recipe
        run: |
          set -euxo pipefail

          cp .ci/stage5/build-ksun-stage5.yml /tmp/trial98-build.yml

          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/trial98-build.yml")
          s = p.read_text()
          old = "M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL92-FBE-ZYGOTE-SERVICES"
          new = "M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL98-PTRACE-STATE-FIX"
          if old not in s:
              raise SystemExit("Trial98: Trial92 artifact name not found in pinned recipe")
          s = s.replace(old, new)
          p.write_text(s)
          PY

          grep -q 'TRIAL98-PTRACE-STATE-FIX' /tmp/trial98-build.yml

      - name: Execute pinned Trial 92 build recipe with Trial 98 ptrace fix
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          wf = yaml.safe_load(Path("/tmp/trial98-build.yml").read_text())
          jobs = wf.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"expected one build job, got {list(jobs)}")

          steps = next(iter(jobs.values())).get("steps", [])
          chunks = ["#!/usr/bin/env bash", "set -euo pipefail", ""]
          for idx, step in enumerate(steps, 1):
              name = step.get("name", f"step-{idx}")
              script = step.get("run")
              if script is None:
                  print(f"skip action-only step: {name}")
                  continue
              chunks += [
                  f'echo "===== Trial 98: {name} ====="',
                  script,
                  "",
              ]
          Path("/tmp/trial98-build.sh").write_text("\n".join(chunks))
          PY

          chmod +x /tmp/trial98-build.sh
          bash /tmp/trial98-build.sh

          test -s M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL98-PTRACE-STATE-FIX.zip
          test -s arch/arm64/boot/Image

      - name: Verify Trial 98 invariants
        run: |
          set -euxo pipefail

          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            "3b18216f71df189ab3d1b1ce0bdb21be1268e771"

          grep -q 'trial98_ptrace_state_lifetime_fix' kernel/ptrace.c
          grep -q 'susfs_stage6_trial92_fbe_zygote_services' \
            .github/patches/stage5-ksun-susfs-compile-probe.patch

          ! grep -R -q 'prezygote_services' KernelSU-Next/kernel \
            .github/patches/stage5-ksun-susfs-compile-probe.patch

          grep -q 'CONFIG_USB_CONFIGFS_F_UAC1=y' /tmp/trial98-build.yml
          grep -q 'CONFIG_USB_F_UAC1=y' /tmp/trial98-build.yml
          grep -q 'CONFIG_USB_U_AUDIO=y' /tmp/trial98-build.yml

          {
            echo "Trial 98"
            echo "base=c9022cdf5d640d267068172fba54c12e7d58103c (Trial92 runtime-green)"
            echo "single_change=ptrace_message lifetime reset on attach/resume/detach"
            echo "ksun=3b18216f71df189ab3d1b1ce0bdb21be1268e771"
            echo "susfs=Trial92 pinned 2.3.0 Samsung 4.19 backport"
            echo "fbe_trigger=Trial92 zygote-start preserved"
            echo "ps5_uac1=preserved"
            sha256sum arch/arm64/boot/Image
            sha256sum M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL98-PTRACE-STATE-FIX.zip
          } | tee .ci/trial98/manifest.txt

      - name: Upload Trial 98 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL98-PTRACE-STATE-FIX
          if-no-files-found: warn
          compression-level: 0
          path: |
            M127F-KSUN-v3.3.0-PS5-UAC1-SUSFS-TRIAL98-PTRACE-STATE-FIX.zip
            arch/arm64/boot/Image
            System.map
            .config
            .ci/trial98/
