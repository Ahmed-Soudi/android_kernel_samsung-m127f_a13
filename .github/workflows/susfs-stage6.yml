            echo "High KSU mount/group IDs now use the normal kernel IDAs."
            echo "Unshare reused-ID ownership now uses VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT."
            echo "Samsung CONFIG_KDP_NS flag storage adapted."
