      - name: Finish SUS_MAP using Samsung 4.19 rollup layout
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("fs/proc/task_mmu.c")
          x=p.read_text()

          fn=x.find("static int show_smaps_rollup(struct seq_file *m, void *v)")
          if fn < 0:
              raise SystemExit("show_smaps_rollup missing")
          end=x.find("\n}\n", fn)
          body=x[fn:end]

          # Samsung 4.19 does NOT use the 5.15-era
          #     smap_gather_stats(vma, &mss, last_vma_end)
          # shape that Trial27 assumed. Discover the actual gather statements inside
          # show_smaps_rollup and wrap them semantically instead of matching 5.15 text.
          gathers=[]
          off=0
          needle="smap_gather_stats("
          while True:
              i=body.find(needle, off)
              if i < 0:
                  break
              line_start=body.rfind("\n", 0, i)+1
              semi=body.find(";", i)
              if semi < 0:
                  raise SystemExit("unterminated smap_gather_stats")
              gathers.append((line_start, semi+1))
              off=semi+1

          if not gathers:
              raise SystemExit("no smap_gather_stats calls in show_smaps_rollup")

          # Work backwards so offsets remain valid. Every rollup gather is filtered.
          for idx,(a,b) in reversed(list(enumerate(gathers,1))):
              stmt=body[a:b]
              indent=stmt[:len(stmt)-len(stmt.lstrip())]
              marker=f"susfs_stage5_trial28_rollup_gather_{idx}"
              wrapped=(
                  indent+"#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                  +indent+f"/* {marker} */\n"
                  +indent+"if (!vma->vm_file ||\n"
                  +indent+"    !SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
                  +indent+"\t"+stmt.lstrip()+"\n"
                  +indent+"#else\n"
                  +stmt+"\n"
                  +indent+"#endif"
              )
              body=body[:a]+wrapped+body[b:]

          x=x[:fn]+body+x[end:]

          # Pagemap: adapt modern SUS_MAP visibility to Samsung 4.19.
          fn=x.find("static ssize_t pagemap_read(")
          if fn < 0:
              raise SystemExit("pagemap_read missing")
          end=x.find("\n}\n", fn)
          body=x[fn:end]

          if "susfs_stage5_trial28_pagemap" not in body:
              wp=body.find("\t\tret = walk_page_range(")
              if wp < 0:
                  wp=body.find("walk_page_range(")
                  if wp < 0:
                      raise SystemExit("pagemap walk_page_range anchor missing")
                  wp=body.rfind("\n",0,wp)+1
              semi=body.find(";", wp)
              if semi < 0:
                  raise SystemExit("pagemap walk terminator missing")
              stmt=body[wp:semi+1]
              indent=stmt[:len(stmt)-len(stmt.lstrip())]
              wrapped=(
                  indent+"#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                  +indent+"/* susfs_stage5_trial28_pagemap */\n"
                  +indent+"{\n"
                  +indent+"\tstruct vm_area_struct *susfs_vma = find_vma(mm, start_vaddr);\n"
                  +indent+"\tif (!susfs_vma || susfs_vma->vm_start > start_vaddr ||\n"
                  +indent+"\t    !susfs_vma->vm_file ||\n"
                  +indent+"\t    !SUSFS_IS_INODE_SUS_MAP(file_inode(susfs_vma->vm_file)))\n"
                  +indent+"\t\t"+stmt.lstrip()+"\n"
                  +indent+"}\n"
                  +indent+"#else\n"
                  +stmt+"\n"
                  +indent+"#endif"
              )
              body=body[:wp]+wrapped+body[semi+1:]
              x=x[:fn]+body+x[end:]

          p.write_text(x)
          PY

          grep -q 'susfs_stage5_trial28_rollup_gather_' fs/proc/task_mmu.c
          grep -q 'susfs_stage5_trial28_pagemap' fs/proc/task_mmu.c
          grep -q 'SUSFS_IS_INODE_SUS_MAP' fs/proc/task_mmu.c

          # Previous green semantic locks.
