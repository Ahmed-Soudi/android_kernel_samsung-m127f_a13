          normal = "\tmnt->mnt.mnt_flags &= ~(MNT_WRITE_HOLD|MNT_MARKED|MNT_INTERNAL);\n"
          if normal not in x:
              raise SystemExit("normal mount flags anchor missing")
          x = x.replace(normal, normal + """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (susfs_ksu && (flag & CL_COPY_MNT_NS))
          \t\tmnt->mnt.mnt_flags |= VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;
          #endif
          """, 1)

          # Remove now-unused separate IDA declarations if present.
          for decl in (
              "static DEFINE_IDA(susfs_mnt_id_ida);\n",
              "static DEFINE_IDA(susfs_mnt_group_ida);\n",
          ):
              x = x.replace(decl, "")

          p.write_text(x)
          PY

          # Hard gates: old aliases/sentinel/separate IDA ownership must be gone.
          ! grep -R -n 'DEFAULT_SUS_MNT_ID\|DEFAULT_SUS_MNT_GROUP_ID\|DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE' \
              include/linux/susfs_def.h fs/namespace.c
          ! grep -n 'susfs_mnt_id_ida\|susfs_mnt_group_ida' fs/namespace.c

